<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>当番</title>
<meta name="theme-color" content="#B5E1F8">
<link rel="manifest" href="toban.webmanifest">
<link rel="apple-touch-icon" href="toban-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="当番">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2833; --sub:#7A8794; --faint:#B8C2CC; --line:#E3E9EF;
  --bg:#EEF3F8; --card:#FFFFFF; --sky:#3C7DC4; --sky-d:#2F68A8; --sky-s:#E2EDF8;
  --want:#3C8F6B; --want-s:#E0F1E8;
  --avoid:#C2852A; --avoid-s:#FAEEDB;
  --no:#D2564F; --no-s:#FBE3E1;
  --summer:#2A9AA3; --summer-s:#DDF1F2;
  --burden:#8C6BC4;
  --early:#C2662E; --cs:#3C7DC4;
  --r:14px;
}
:root{
  --ink:#1E2833; --sub:#7A8794; --faint:#B8C2CC; --line:#E3E9EF;
  --bg:#EEF3F8; --card:#FFFFFF; --sky:#3C7DC4; --sky-d:#2F68A8; --sky-s:#E2EDF8;
  --ok:#3C8F6B; --ok-s:#E0F1E8; --warn:#C2852A; --warn-s:#FAEEDB; --no:#D2564F; --no-s:#FBE3E1;
  --early:#C2662E; --early-s:#F8E5D9; --cs:#3C7DC4; --me:#FFE48A;
  --r:14px;
}
:root{--nav:calc(62px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:calc(15px*var(--fs,1));line-height:1.5;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:var(--nav)}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:"Outfit",sans-serif;font-feature-settings:"tnum"}
#wWrap{min-height:calc(100vh - var(--nav));display:flex;flex-direction:column}
#wApp{flex:1;display:flex;flex-direction:column}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;background:rgba(30,40,51,.92);color:#fff;padding:12px 20px;border-radius:14px;font-size:calc(14px*var(--fs,1));z-index:9;max-width:84%;text-align:center;line-height:1.6;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:6}
#nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:calc(11px*var(--fs,1));font-weight:700;color:var(--sub);position:relative}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--sky)}
#demoBar{position:sticky;top:0;z-index:7;background:#1E2833;color:#fff;font-size:calc(12px*var(--fs,1));padding:8px 10px;text-align:center}
#demoBar .dt2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:5px}
#demoBar button{border:none;border-radius:999px;padding:4px 11px;font-size:calc(12px*var(--fs,1));background:#3B4856;color:#fff}
#demoBar button.on{background:#FFE48A;color:#1E2833;font-weight:700}
#demoBar #demoReset{background:#D2564F}
#pvBar{background:#1F4B68;color:#fff;font-size:calc(12px*var(--fs,1));padding:8px 10px 9px;text-align:center}
#pvBar .pt2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
#pvBar button{border:none;border-radius:999px;padding:6px 13px;font-size:calc(13px*var(--fs,1));background:#3A6685;color:#fff;font-weight:700}
#pvBar button.on{background:#fff;color:#1F4B68}
#pvBar .pt3{margin-top:7px;font-size:calc(12px*var(--fs,1));color:#FFE48A;font-weight:700}
#pvBar .pt3{line-height:1.6;font-weight:500;color:#DCEBF5}
#pvBar .pt3 .ed{display:block;color:#FFE48A;font-weight:700}
.tst{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#FFE48A;color:#5B4A00;font-size:calc(11px*var(--fs,1));font-weight:700;letter-spacing:0;vertical-align:2px}
#regBar{text-align:center;padding:20px 16px 28px;font-size:calc(11.5px*var(--fs,1));line-height:1.6;color:var(--sub)}
#regBar a{display:inline-block;margin-top:10px;color:#287FB8;text-decoration:underline}
#regBar button{display:inline-block;border:1px solid #C9D6E0;background:#fff;border-radius:999px;padding:8px 16px;font-size:calc(13px*var(--fs,1));font-weight:700;color:#287FB8;margin-bottom:6px}
/* Ver12.5.0：下から出る窓は、下のタブより手前に出す（「やめる」「申請する」がタブにかくれないように） */
#rWrap .sheet-bg{z-index:8 !important}
#rWrap .sheet,#rWrap .confirm{z-index:9 !important}
#nav button{white-space:nowrap}
#nav.n6 button{font-size:calc(10px*var(--fs,1));letter-spacing:-.02em}
#navBadge.g,#navBadgeLv.g,#navBadgeOk.g{background:#8FA3B2}
#navBadge,#navBadgeLv,#navBadgeOk,#navBadgeV{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:999px;background:var(--no);color:#fff;font-family:"Outfit",sans-serif;font-size:calc(11px*var(--fs,1));display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- 当番表・申し込み ---------- */


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:"Outfit",sans-serif;font-feature-settings:"tnum"}

#rWrap .head{padding:22px 20px 0}
#rWrap .hello{font-size:calc(13px*var(--fs,1));color:var(--sub);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
#rWrap .hello b{color:var(--ink);font-weight:700;font-size:calc(17px*var(--fs,1))}
#rWrap .reload{border:none;background:#fff;border-radius:999px;padding:5px 12px;font-size:calc(12px*var(--fs,1));color:var(--sub);box-shadow:0 1px 2px rgba(30,40,51,.08)}
#rWrap .seg{display:flex;background:#DDE6EF;border-radius:999px;padding:4px;margin-top:14px}
#rWrap .seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 0;font-size:calc(14px*var(--fs,1));font-weight:500;color:var(--sub);position:relative}
#rWrap .seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(30,40,51,.12)}
#rWrap .badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:999px;background:var(--no);color:#fff;font-family:"Outfit",sans-serif;font-size:calc(11px*var(--fs,1));font-weight:600;margin-left:5px;padding:0 5px;vertical-align:1px}
#rWrap .month{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
#rWrap .month .t{display:flex;align-items:baseline;gap:8px}
#rWrap .month .m{font-family:"Outfit",sans-serif;font-size:calc(44px*var(--fs,1));font-weight:500;line-height:1;letter-spacing:-.02em}
#rWrap .month .m small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:calc(18px*var(--fs,1));font-weight:700;margin-left:2px}
#rWrap .month .y{font-family:"Outfit",sans-serif;font-size:calc(15px*var(--fs,1));color:var(--sub)}
#rWrap .arrows{display:flex;gap:6px}
#rWrap .arrows button{width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:calc(18px*var(--fs,1));box-shadow:0 1px 2px rgba(30,40,51,.08)}
#rWrap .arrows button:disabled{opacity:.3;cursor:default}

#rWrap .sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
#rWrap .sum div{background:#fff;border-radius:12px;padding:9px 12px;font-size:calc(12px*var(--fs,1));color:var(--sub);display:flex;align-items:baseline;justify-content:space-between}
#rWrap .sum .num{font-size:calc(22px*var(--fs,1));font-weight:600;color:var(--ink)}
#rWrap .sum .E{color:var(--early)}
#rWrap .sum .C{color:var(--cs)}
#rWrap .filter{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 0;font-size:calc(12px*var(--fs,1));color:var(--sub)}
#rWrap .sw{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fs,1));color:var(--ink);cursor:pointer;user-select:none}
#rWrap .sw i{width:38px;height:22px;border-radius:999px;background:#C9D3DD;position:relative;transition:background .15s}
#rWrap .sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
#rWrap .sw.on i{background:var(--sky)}
#rWrap .sw.on i::after{left:19px}

#rWrap .alert{margin:14px 14px 0;background:var(--warn-s);border-radius:var(--r);padding:12px 14px;font-size:calc(13.5px*var(--fs,1));color:#7A5418;display:flex;align-items:center;justify-content:space-between;gap:10px}
#rWrap .alert button{border:none;background:var(--warn);color:#fff;border-radius:999px;padding:7px 14px;font-size:calc(13px*var(--fs,1));font-weight:700;white-space:nowrap}

#rWrap .list{padding:14px 14px 120px}
#rWrap .day{background:#fff;border-radius:var(--r);margin-bottom:7px;padding:10px 12px;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}
#rWrap .day.past{opacity:.5}
#rWrap .day.today{box-shadow:inset 0 0 0 2px var(--sky)}
#rWrap .dt{text-align:center;line-height:1.1}
#rWrap .dt .num{font-size:calc(24px*var(--fs,1));font-weight:500;display:block}
#rWrap .dt .w{font-size:calc(12px*var(--fs,1));color:var(--sub)}
#rWrap .dt.s6 .w{color:var(--sky)}
#rWrap .dt.s0 .w{color:var(--no)}
#rWrap .slots{display:grid;grid-template-columns:auto 1fr;gap:0;align-items:start}
#rWrap .gE,#rWrap .gC{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#rWrap .gE{padding-right:12px;min-width:96px}
#rWrap .gC{border-left:1.5px dashed var(--line);padding-left:12px}
#rWrap .sl{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:6px 10px 6px 6px;font-size:calc(14px*var(--fs,1));background:var(--bg);text-align:left}
#rWrap .sl .k{font-size:calc(11px*var(--fs,1));font-weight:700;border-radius:6px;padding:2px 6px;color:#fff}
#rWrap .sl .k.E{background:var(--early)}
#rWrap .sl .k.C{background:var(--cs)}
#rWrap .sl.mine{background:var(--me);font-weight:700}
#rWrap .sl.sel{box-shadow:0 0 0 3px var(--sky);transform:scale(1.04)}
#rWrap .sl.cand{box-shadow:0 0 0 2px var(--sky);background:#fff}
#rWrap .sl.dim{opacity:.25}
#rWrap .sl{transition:transform .1s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#rWrap .selbar{position:fixed;left:50%;bottom:calc(var(--nav) + 12px);transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:var(--sky);color:#fff;border-radius:14px;padding:12px 14px;font-size:calc(13.5px*var(--fs,1));line-height:1.6;box-shadow:0 6px 16px rgba(60,125,196,.35);z-index:4}
#rWrap .selbar span{display:block;text-align:right;font-weight:700;margin-top:2px}
#rWrap .confirm{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transition:transform .22s ease;z-index:7}
#rWrap .confirm.show{transform:translate(-50%,0)}
#rWrap .confirm .ct{font-size:calc(16px*var(--fs,1));font-weight:700;margin-bottom:10px}
#rWrap .undo{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;width:calc(100% - 28px);max-width:452px;background:rgba(30,40,51,.95);color:#fff;border-radius:14px;padding:12px 14px;font-size:calc(14px*var(--fs,1));display:flex;align-items:center;justify-content:space-between;gap:10px;transition:opacity .2s,transform .2s;z-index:8}
#rWrap .undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#rWrap .undo button{border:none;background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:calc(13px*var(--fs,1));font-weight:700;white-space:nowrap}
#rWrap .sl.tap{box-shadow:0 0 0 1.5px #E2B93B}
#rWrap .sl .ch{font-size:calc(11px*var(--fs,1));color:var(--ok);font-weight:700}
#rWrap .sl.empty{color:var(--faint)}
#rWrap .sl:disabled{cursor:default}
#rWrap .hint{font-size:calc(12px*var(--fs,1));color:var(--sub);text-align:center;margin:4px 20px 0;line-height:1.7}
#rWrap .calnote{margin:8px 4px 4px;padding:8px 11px;border-radius:10px;background:#EEF4FB;color:#2F5D80;font-size:calc(12.5px*var(--fs,1));line-height:1.6}

#rWrap .box{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px}
#rWrap .h2{font-size:calc(13px*var(--fs,1));color:var(--sub);font-weight:700;margin:18px 6px 8px;letter-spacing:.04em}
#rWrap .h2:first-child{margin-top:4px}
#rWrap .req .who{font-size:calc(14px*var(--fs,1))}
#rWrap .req .who b{font-size:calc(16px*var(--fs,1))}
#rWrap .req .what{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(14px*var(--fs,1))}
#rWrap .pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border-radius:8px;padding:4px 8px;font-size:calc(13.5px*var(--fs,1))}
#rWrap .pill .k{font-size:calc(10.5px*var(--fs,1));font-weight:700;border-radius:5px;padding:1px 5px;color:#fff}
#rWrap .pill .k.E{background:var(--early)}
#rWrap .pill .k.C{background:var(--cs)}
#rWrap .arrow{color:var(--sub);font-size:calc(13px*var(--fs,1))}
#rWrap .req .note{margin-top:8px;font-size:calc(13px*var(--fs,1));background:var(--bg);border-radius:8px;padding:7px 10px;white-space:pre-wrap}
#rWrap .req .st{margin-top:8px;font-size:calc(12.5px*var(--fs,1));font-weight:700}
#rWrap .st.done{color:var(--ok)}
#rWrap .st.no,#rWrap .st.bad{color:var(--no)}
#rWrap .st.wait{color:var(--warn)}
#rWrap .st.cancel{color:var(--sub)}
#rWrap .req .why{font-size:calc(12px*var(--fs,1));color:var(--sub);margin-top:2px}
/* Ver12.0.0：休み */
#rWrap .lvd{margin-top:6px;font-size:calc(12px*var(--fs,1));color:#7A5418;line-height:1.6}
#rWrap .lvd b{display:inline-block;background:#F6E7C8;color:#7A5418;border-radius:5px;padding:0 5px;margin-right:4px;font-size:calc(11px*var(--fs,1))}
#rWrap .badge.g{background:#8FA3B2}
#rWrap .lvd b.pd{background:#EEF2F5;color:#5E7383}
#rWrap .lvd .pdn{color:#5E7383}
#rWrap .lvseg{margin:12px 0 4px}
#rWrap .lvrow{display:flex;gap:10px;margin-top:14px}
#rWrap .lvrow button{flex:1;margin:0 !important;width:auto !important}
#rWrap .lvrow .back{flex:0 0 34%;background:#EEF2F5 !important;color:var(--sub) !important;border:none;border-radius:14px !important;font-size:calc(15px*var(--fs,1));font-weight:700;padding:14px 0 !important}
#rWrap .lvrow .go:disabled{opacity:.4}
#rWrap .lvx{position:absolute;top:10px;right:12px;width:36px;height:36px;border:none;border-radius:999px;background:#EEF2F5;color:var(--sub);font-size:calc(20px*var(--fs,1));line-height:1;padding:0}
#rWrap .lvbtn{display:block;width:100%;border:none;border-radius:14px;background:var(--sky);color:#fff;padding:14px;font-size:calc(16px*var(--fs,1));font-weight:700;margin:14px 0 4px}
#rWrap .lvp{display:flex;gap:8px;margin:8px 0}
#rWrap .lvp button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-size:calc(15px*var(--fs,1));font-weight:700;color:var(--ink)}
#rWrap .lvp button.on{background:var(--sky);border-color:var(--sky);color:#fff}
#rWrap .lvin{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:calc(16px*var(--fs,1));background:#fff}
#rWrap .lvdl{font-size:calc(13px*var(--fs,1));margin-top:8px;line-height:1.7;color:var(--sub)}
#rWrap .lvdl.ng{color:var(--no);font-weight:700}
#rWrap .lvh{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
#rWrap .lvh:last-child{border-bottom:none}
#rWrap .lvh .m{flex:1;min-width:0;font-size:calc(14px*var(--fs,1));line-height:1.5}
#rWrap .lvh .w{font-size:calc(12px*var(--fs,1));color:var(--sub)}
#rWrap .lvh button{border:none;background:#EEF2F5;color:var(--sub);border-radius:9px;padding:7px 12px;font-size:calc(13px*var(--fs,1));font-weight:700}
#rWrap .tp{font-size:calc(11px*var(--fs,1));font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;background:#EEE6F7;color:#5B3F86}
#rWrap .btns{display:flex;gap:8px;margin-top:12px}
#rWrap .btns button{flex:1;border:none;border-radius:12px;padding:12px;font-size:calc(15px*var(--fs,1));font-weight:700}
#rWrap .b-ok{background:var(--sky);color:#fff}
#rWrap .b-no{background:var(--bg);color:var(--ink)}
#rWrap .b-x{background:var(--bg);color:var(--sub)}
#rWrap .btns button:disabled{opacity:.5}
#rWrap .none{background:#fff;border-radius:var(--r);padding:16px;text-align:center;color:var(--sub);font-size:calc(14px*var(--fs,1))}

/* 下から出る画面 */
#rWrap .sheet-bg{position:fixed;inset:0;background:rgba(30,40,51,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#rWrap .sheet-bg.show{opacity:1;pointer-events:auto}
#rWrap .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--bg);
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));transition:transform .25s ease;z-index:6}
#rWrap .sheet.show{transform:translate(-50%,0)}
#rWrap .sheet h3{margin:0 0 4px;font-size:calc(17px*var(--fs,1))}
#rWrap .sheet .sub{font-size:calc(13px*var(--fs,1));color:var(--sub);margin-bottom:12px;line-height:1.7}
#rWrap .big:disabled{cursor:default}
#rWrap .big{display:block;width:100%;border:none;background:#fff;border-radius:14px;padding:14px 16px;text-align:left;margin-bottom:8px}
#rWrap .big b{font-size:calc(16px*var(--fs,1));display:block}
#rWrap .big span{font-size:calc(12.5px*var(--fs,1));color:var(--sub)}
#rWrap .pick{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:6px;font-size:calc(15px*var(--fs,1));text-align:left}
#rWrap .pick .d{color:var(--sub);font-size:calc(13px*var(--fs,1))}
#rWrap .pick.dis{opacity:.45;cursor:default}
#rWrap .pick .why{font-size:calc(11.5px*var(--fs,1));color:var(--sub)}
#rWrap .grp{font-size:calc(12px*var(--fs,1));color:var(--sub);font-weight:700;margin:12px 4px 6px}
#rWrap .sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:calc(15px*var(--fs,1));background:#fff;resize:none;margin-top:4px}
#rWrap .go{width:100%;margin-top:12px;border:none;border-radius:14px;background:var(--sky);color:#fff;padding:15px;font-size:calc(16px*var(--fs,1));font-weight:700;letter-spacing:.06em;box-shadow:0 6px 16px rgba(60,125,196,.28)}
#rWrap .go:disabled{background:#C9D3DD;box-shadow:none}
#rWrap .back{border:none;background:none;color:var(--sub);font-size:calc(14px*var(--fs,1));padding:10px 0 0;width:100%}
#rWrap .summary{background:#fff;border-radius:12px;padding:12px 14px;font-size:calc(14px*var(--fs,1));line-height:1.9}
#rWrap .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}

/* ---------- 希望・アンケート ---------- */


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:"Outfit",sans-serif;font-feature-settings:"tnum"}

/* ---------- 上の部分 ---------- */
#wWrap .head{padding:22px 20px 0}
#wWrap .hello{font-size:calc(13px*var(--fs,1));color:var(--sub);letter-spacing:.04em}
#wWrap .hello b{color:var(--ink);font-weight:700;font-size:calc(17px*var(--fs,1))}
#wWrap .seg{display:flex;background:#DDE6EF;border-radius:999px;padding:4px;margin-top:14px}
#wWrap .seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 0;font-size:calc(14px*var(--fs,1));font-weight:500;color:var(--sub);transition:background .2s,color .2s}
#wWrap .seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(30,40,51,.12)}
#wWrap .month{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
#wWrap .month .t{display:flex;align-items:baseline;gap:8px}
#wWrap .month .m{font-family:"Outfit",sans-serif;font-size:calc(44px*var(--fs,1));font-weight:500;line-height:1;letter-spacing:-.02em}
#wWrap .month .m small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:calc(18px*var(--fs,1));font-weight:700;margin-left:2px}
#wWrap .month .y{font-family:"Outfit",sans-serif;font-size:calc(15px*var(--fs,1));color:var(--sub)}
#wWrap .arrows{display:flex;gap:6px}
#wWrap .arrows button{width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:calc(18px*var(--fs,1));color:var(--ink);box-shadow:0 1px 2px rgba(30,40,51,.08)}
#wWrap .arrows button:disabled{opacity:.3;cursor:default}
#wWrap .status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:calc(12px*var(--fs,1));color:var(--sub);line-height:1.4}
#wWrap .chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:calc(13px*var(--fs,1));font-weight:700;background:#fff;color:var(--ink)}
#wWrap .chip .num{font-size:calc(15px*var(--fs,1))}
#wWrap .chip.ok{background:var(--want-s);color:var(--want)}
#wWrap .chip.warn{background:var(--avoid-s);color:var(--avoid)}
#wWrap .chip.closed{background:#E4E9EE;color:var(--sub)}
#wWrap .quota{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
#wWrap .qt{background:#fff;border-radius:12px;padding:10px 12px}
#wWrap .qt .l{font-size:calc(12px*var(--fs,1));color:var(--sub)}
#wWrap .qt .v{display:flex;align-items:baseline;gap:4px;margin-top:2px;font-size:calc(12px*var(--fs,1));color:var(--sub)}
#wWrap .qt .v .num{font-size:calc(22px*var(--fs,1));font-weight:600;color:var(--ink);line-height:1.1}
#wWrap .dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
#wWrap .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#wWrap .qt.no .dots i.u{background:var(--no)}
#wWrap .qt.su .dots i.u{background:var(--summer)}

/* ---------- 早出とCSの入り方 ---------- */
#wWrap .pair{background:#fff;border-radius:12px;padding:10px 12px 11px;margin-top:8px}
#wWrap .pl{font-size:calc(12px*var(--fs,1));color:var(--sub)}
#wWrap .pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;background:var(--bg);border-radius:10px;padding:3px}
#wWrap .pseg button{border:none;background:none;border-radius:8px;padding:8px 0;font-size:calc(12.5px*var(--fs,1));font-weight:500;color:var(--sub);white-space:nowrap}
#wWrap .pseg button.on{background:var(--sky);color:#fff;font-weight:700}
#wWrap .pnote{font-size:calc(12px*var(--fs,1));color:var(--sub);margin:0 6px 10px;line-height:1.7}
#wWrap .sq{font-size:calc(15px*var(--fs,1));font-weight:700;line-height:1.6;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#wWrap .sq b{font-family:"Outfit",sans-serif;font-size:calc(13px*var(--fs,1));color:#fff;background:var(--sky);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#wWrap .sq .em{border-radius:6px;padding:0 6px;font-size:calc(14px*var(--fs,1))}
#wWrap .sq .em.E{background:#F8E5D9;color:var(--early)}
#wWrap .sq .em.C{background:var(--sky-s);color:var(--cs)}
#wWrap .sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
#wWrap .sgrid button{border:none;background:var(--bg);border-radius:10px;padding:11px 0;font-size:calc(16px*var(--fs,1));font-weight:700;color:var(--ink)}
#wWrap .sgrid button.s6{color:var(--sky)}
#wWrap .sgrid button.none{grid-column:1/-1;font-size:calc(13px*var(--fs,1));font-weight:500;color:var(--sub);padding:9px 0}
#wWrap .sgrid button{position:relative}
#wWrap .sgrid button.on{background:var(--avoid);color:#fff}
#wWrap .sgrid .rk{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;font-family:"Outfit",sans-serif;font-size:calc(11px*var(--fs,1));font-weight:600;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
#wWrap .pair textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:calc(15px*var(--fs,1));line-height:1.6;color:var(--ink);background:var(--bg);resize:vertical}
#wWrap .pair textarea:focus{outline:2px solid var(--sky);outline-offset:0;background:#fff}
#wWrap .shint{font-size:calc(11.5px*var(--fs,1));color:var(--sub);margin:8px 2px 0;line-height:1.6}
#wWrap .sgrid button.none.on{background:var(--ink);color:#fff}
#wWrap .pair .pseg{margin-top:10px}
#wWrap .pair .pseg button{padding:11px 0;font-size:calc(14px*var(--fs,1))}

/* ---------- カレンダー ---------- */
#wWrap .calwrap{padding:18px 14px 6px}
#wWrap .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
#wWrap .wk div{text-align:center;font-size:calc(11px*var(--fs,1));color:var(--sub);letter-spacing:.05em}
#wWrap .wk .s0{color:var(--no)}
#wWrap .wk .s6{color:var(--sky)}
#wWrap .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
#wWrap .d{aspect-ratio:1/1.08;background:var(--card);border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
   user-select:none;cursor:pointer;transition:transform .12s ease,background .15s}
#wWrap .d:active{transform:scale(.92)}
#wWrap .d .n{font-family:"Outfit",sans-serif;font-size:calc(17px*var(--fs,1));font-weight:500;line-height:1}
#wWrap .d .ks{display:flex;gap:2px;margin-top:3px}
#wWrap .d .k{font-size:calc(9.5px*var(--fs,1));font-weight:700;letter-spacing:-.03em;white-space:nowrap;line-height:1}
#wWrap .d.avoid .k.kn{color:var(--no)}
#wWrap .d.no .k.ka{color:#FFE2B8}
#wWrap .d .b{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--burden)}
#wWrap .d.blank{background:none;cursor:default}
#wWrap .d.off{background:transparent;color:var(--faint);cursor:default}
#wWrap .d.off:active{transform:none}
#wWrap .d.lock{cursor:default}
#wWrap .d.lock:active{transform:none}
#wWrap .d.want{background:var(--want-s);color:var(--want);box-shadow:inset 0 0 0 1.5px var(--want)}
#wWrap .d.avoid{background:var(--avoid-s);color:var(--avoid);box-shadow:inset 0 0 0 1.5px var(--avoid)}
#wWrap .d.no{background:var(--no);color:#fff}
#wWrap .d.summer{background:var(--summer);color:#fff}
#wWrap .d.no .b,#wWrap .d.summer .b{background:#fff}
#wWrap .legend{display:flex;justify-content:center;gap:14px;font-size:calc(11px*var(--fs,1));color:var(--sub);padding:12px 0 4px}
#wWrap .legend span{display:flex;align-items:center;gap:5px}
#wWrap .legend i{width:6px;height:6px;border-radius:50%;background:var(--burden)}
#wWrap .legend i.off{background:none;border:1px solid var(--faint)}

/* ---------- 下の操作 ---------- */
#wWrap .dock{margin-top:auto;position:sticky;bottom:var(--nav);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(238,243,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#wWrap .pens{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:#fff;border-radius:16px;padding:6px}
#wWrap .pens button{border:none;background:none;border-radius:11px;padding:10px 0 9px;font-size:calc(13px*var(--fs,1));font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .15s,color .15s}
#wWrap .pens button i{width:10px;height:10px;border-radius:50%}
#wWrap .pens .pa i{background:var(--avoid)}
#wWrap .pens .pn i{background:var(--no)}
#wWrap .pens .pa.on{background:var(--avoid-s);color:var(--avoid)}
#wWrap .pens .pn.on{background:var(--no-s);color:var(--no)}
#wWrap .tip{font-size:calc(12px*var(--fs,1));color:var(--sub);text-align:center;margin:9px 0 0}
#wWrap .tip b{color:var(--ink);font-family:"Outfit",sans-serif;font-size:calc(14px*var(--fs,1));font-weight:600}
#wWrap .send{width:100%;margin-top:10px;border:none;border-radius:14px;background:var(--sky);color:#fff;padding:15px;font-size:calc(16px*var(--fs,1));font-weight:700;letter-spacing:.08em;
  box-shadow:0 6px 16px rgba(60,125,196,.28);transition:background .15s,box-shadow .15s}
#wWrap .send:active{background:var(--sky-d)}
#wWrap .send:disabled{background:#C9D3DD;box-shadow:none;cursor:default}
#wWrap .howto{font-size:calc(12px*var(--fs,1));color:var(--sub);text-align:center;padding:2px 20px 0;margin:0;line-height:1.7}

/* ---------- 決まった当番 ---------- */
#wWrap .body{padding:18px 14px 30px}
#wWrap .h2{font-size:calc(13px*var(--fs,1));color:var(--sub);font-weight:700;margin:4px 6px 10px;letter-spacing:.04em}
#wWrap .mine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#wWrap .duty{background:#fff;border-radius:var(--r);padding:12px 10px 11px;text-align:center}
#wWrap .duty .dn{font-family:"Outfit",sans-serif;font-size:calc(28px*var(--fs,1));font-weight:500;line-height:1}
#wWrap .duty .dw{font-size:calc(12px*var(--fs,1));color:var(--sub);margin-top:3px}
#wWrap .duty .dw.s6{color:var(--sky)}
#wWrap .duty .tags{display:flex;justify-content:center;gap:4px;margin-top:8px}
#wWrap .tag{font-size:calc(11px*var(--fs,1));font-weight:700;border-radius:999px;padding:2px 8px}
#wWrap .tag.E{background:#F8E5D9;color:var(--early)}
#wWrap .tag.C{background:var(--sky-s);color:var(--cs)}
#wWrap .none{background:#fff;border-radius:var(--r);padding:18px;text-align:center;color:var(--sub);font-size:calc(14px*var(--fs,1))}
#wWrap .all{background:#fff;border-radius:var(--r);overflow:hidden;margin-top:6px}
#wWrap .all .r{display:grid;grid-template-columns:78px 1fr 1fr;align-items:center;padding:10px 14px;font-size:calc(14px*var(--fs,1));border-top:1px solid #F0F3F6}
#wWrap .all .r:first-child{border-top:none}
#wWrap .all .hd{font-size:calc(11px*var(--fs,1));font-weight:700;color:var(--sub);padding:9px 14px}
#wWrap .all .hd .e{color:var(--early)}
#wWrap .all .hd .c{color:var(--cs)}
#wWrap .all .dt{color:var(--sub);font-size:calc(13px*var(--fs,1))}
#wWrap .all .dt .num{color:var(--ink);font-size:calc(15px*var(--fs,1));margin-right:2px}
#wWrap .all .dt.s6{color:var(--sky)}
#wWrap .all .me{background:#FFF1BF;border-radius:6px;padding:1px 6px;font-weight:700}
#wWrap .all .em{color:var(--faint)}
#wWrap .conf{font-size:calc(12px*var(--fs,1));color:var(--sub);margin-top:12px}
#wWrap .golink{display:block;margin-top:14px;background:#fff;border-radius:var(--r);padding:13px 16px;color:var(--sky);font-weight:700;font-size:calc(14px*var(--fs,1));text-decoration:none;text-align:center}

/* ---------- その他 ---------- */
#wWrap .empty,#wWrap .msg{margin:60px 24px;text-align:center;color:var(--sub);line-height:1.9}
#wWrap .msg .big{font-size:calc(17px*var(--fs,1));color:var(--ink);font-weight:700;margin-bottom:6px}
#wWrap .ver{text-align:center;font-size:calc(10px*var(--fs,1));color:var(--faint);padding:0 0 10px;font-family:"Outfit",sans-serif}

/* ====================================================================
   SKY MINIMAL DESIGN — visual-only stylesheet
   Existing application behavior, identifiers and data exchange unchanged.
   ==================================================================== */
:root {
  --ink:#24465F; --sub:#71899B; --faint:#A6B8C5; --line:#DCEAF3;
  --bg:#EAF5FC; --card:#FFFFFF; --sky:#287FB8; --sky-d:#206A9E;
  --sky-s:#E8F4FB; --r:15px;
  --early:#B76839; --cs:#287FB8; --me:#E8F4FD;
  --want:#31866D; --want-s:#E5F3EC;
  --avoid:#B58238; --avoid-s:#FAF0E0;
  --no:#C95758; --no-s:#FCE8E8;
}
html {background:#DFEFF9;}
body {
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink); max-width:480px; background:var(--bg);
  background-image:radial-gradient(ellipse at 100% 0%,rgba(167,218,247,.55),transparent 42%),
    linear-gradient(165deg,#E8F5FC 0%,#F4FAFE 48%,#E9F5FC 100%);
  background-attachment:fixed; font-size:calc(15px*var(--fs,1)); line-height:1.5;
}
button:focus-visible, [data-d]:focus-visible {outline:3px solid #79B9DE;outline-offset:2px}
/* Cloudlike curves confined to the top banner; content remains plain. */
#rWrap .head,#wWrap .head {
  position:relative; isolation:isolate; overflow:hidden;
  background:linear-gradient(143deg,#B5E1F8 0%,#CDEAF9 57%,#E3F4FC 100%);
  padding:20px 20px 23px;
  border-radius:0 0 26px 26px;
  box-shadow:0 7px 20px rgba(55,121,171,.065);
}
#rWrap .head::before,#wWrap .head::before {
  content:""; position:absolute; inset:-80px -90px auto 30%; height:185px;
  border-radius:0 0 45% 80%;transform:rotate(-13deg);
  background:linear-gradient(145deg,rgba(255,255,255,.50),rgba(255,255,255,0));
  pointer-events:none;z-index:-1;
}
#rWrap .head::after,#wWrap .head::after {
  content:"";position:absolute; width:230px;height:115px;right:-95px;bottom:-78px;
  border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none;z-index:-1;
}
#rWrap .hello,#wWrap .hello{color:#4C7590;font-size:calc(13px*var(--fs,1));letter-spacing:.015em}
#rWrap .hello::before,#wWrap .hello::before{
  content:"sky medical clinic";display:block;position:absolute;top:5px;left:20px;
  font-family:"Outfit",sans-serif;font-size:calc(9px*var(--fs,1));font-weight:600;letter-spacing:.20em;
  color:#538AAE;
}
#rWrap .head,#wWrap .head{padding-top:32px}
#rWrap .hello b,#wWrap .hello b{font-size:calc(17px*var(--fs,1));color:#214B68}
#rWrap .reload{background:#FFFFFFB8;color:#376B8A;border:1px solid #FFFFFFA8;box-shadow:none;padding:8px 12px}
#rWrap .month,#wWrap .month{margin-top:19px;align-items:end}
#rWrap .month .m,#wWrap .month .m{font-size:calc(43px*var(--fs,1));font-weight:500;color:#173F5D;letter-spacing:-.035em}
#rWrap .month .m small,#wWrap .month .m small{font-size:calc(18px*var(--fs,1))}
#rWrap .month .y,#wWrap .month .y{color:#577F98;font-size:calc(14px*var(--fs,1))}

  width:42px;height:42px;border-radius:13px;background:#FFFFFFB8;
  color:#275C80;border:1px solid #FFFFFFCF;box-shadow:none;font-size:calc(23px*var(--fs,1));
}
#rWrap .sum{gap:10px;margin-top:17px}
#rWrap .sum div{border-radius:14px;padding:12px 13px;background:#FFFFFFDE;box-shadow:0 2px 8px #518CB00A}

#rWrap .sum .E{color:var(--early)}#rWrap .sum .C{color:var(--cs)}
#rWrap .filter{margin:16px 3px 0}
#rWrap .sw i{background:#C4D5E2}

  margin-bottom:9px;grid-template-columns:50px minmax(0,1fr);
  border:1px solid #EDF3F8;box-shadow:0 2px 12px rgba(42,105,147,.035);
}

#rWrap .dt .num{font-size:calc(26px*var(--fs,1));font-weight:500;color:#27465C}

#rWrap .h2,#wWrap .h2{font-size:calc(13px*var(--fs,1));color:#55778F;letter-spacing:.025em}

<body>
<!-- 看護師当番 スマホアプリ「当番」 Ver12.63.0（当番表・申し込み・希望・アンケート）。GitHub Pages に toban.html として置きます -->
<div id="rWrap"><div id="rApp"><div class="msg">読み込んでいます…</div></div><div class="sheet-bg" id="sheetBg"></div><div class="sheet" id="sheet"></div><div class="confirm" id="confirm"></div></div>

<script>
'use strict';
/* ===== プレビュー（見本データ）：QRコードがなくても動きを見られる。データはこの画面の中だけで、院長には届かない ===== */
function demoBackend(){
const load=()=>JSON.parse(SS.get('toban_demo')||'{}'), save=d=>SS.set('toban_demo',JSON.stringify(d));
function sh(name){ return {
  getLastRow(){ return (load()[name]||[]).length; },
  getRange(r,c,nr,nc){ return {
    setValues(v){ const d=load(); const a=d[name]||[]; for(let i=0;i<nr;i++){ a[r-1+i]=a[r-1+i]||[]; for(let j=0;j<nc;j++) a[r-1+i][c-1+j]=v[i][j]; } d[name]=a; save(d); return this; },
    getValues(){ const a=load()[name]||[]; const o=[]; for(let i=0;i<nr;i++){ const row=a[r-1+i]||[]; o.push(Array.from({length:nc},(_,j)=>row[c-1+j]===undefined?'':row[c-1+j])); } return o; },
    clearContent(){ const d=load(); const a=d[name]||[]; a.splice(r-1,nr); d[name]=a; save(d); return this; },
    setNumberFormat(){ return this; } }; } }; }
const SpreadsheetApp={getActiveSpreadsheet(){ return { getSheetByName(n){ return load()[n]?sh(n):null; }, insertSheet(n){ const d=load(); d[n]=[]; save(d); return sh(n); } }; }};
const PropertiesService={getScriptProperties(){ return { getProperty(k){ return SS.get('toban_demo_'+k); }, setProperty(k,v){ SS.set('toban_demo_'+k,v); }, deleteProperty(k){ localStorage.removeItem('prop_'+k); } }; }};
const LockService={getScriptLock(){ return {waitLock(){}, releaseLock(){}}; }};
const Utilities={formatDate(d,tz,f){ const p=n=>('0'+n).slice(-2); const ds=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); return f==='yyyy-MM-dd'?ds:ds+' '+p(d.getHours())+':'+p(d.getMinutes()); }};
const ContentService={MimeType:{JSON:1}, createTextOutput(s){ return {setMimeType(){ return {getContent(){ return s; }}; }}; }};

/**
 * 看護師当番 スマホアプリ用 GAS  Ver12.58.0（当番管理・スマホアプリ「当番」と同じ版数）
 * スプレッドシートの「拡張機能 → Apps Script」に貼り付けて使います。
 * ファイルはこのコード（コード.gs）だけです。看護師さんのスマホアプリ「当番」は GitHub Pages（toban.html）に置き、ここを呼びます。
 */
const VER = '12.58.0';
const SH = {nurses:'看護師', wishes:'希望', months:'受付', roster:'当番表', survey:'アンケート', changes:'当番の変更', jchg:'事務の当番の変更', frames:'カレンダーの枠', duty:'カレンダー用当番表', calstaff:'カレンダーの担当者', clerks:'事務', jroster:'事務の当番表', leave:'休み', calreq:'カレンダーからの申請'};
const HEAD = {
  nurses: ['id','名前','合言葉','有効','早出','CS','入れない曜日（早出）','特別に入れる日','入れない曜日（CS）','リーダー（休みの許可）'],
  clerks: ['id','名前','合言葉','有効','リーダー（休みの許可）'],
  leave: ['番号','職種（n＝看護師・j＝事務）','人id','名前','日付','時間（all・am・pm）','理由（院長だけが見る）','状態','申請した日時','決めた人','決めた日時','入れ方（self・dr・pc）','取り消しの申請（日時）'],
  jroster: ['月','更新日時','当番表（事務：早出・会計）'],
  calreq: ['番号','カレンダーの番号','種類（duty・leave）','日付','枠（E・C・C2）／時間','外れる人id','外れる人','入る人id／職種','入る人','外れる人のOK','入る人のOK','状態','申請した日時','決まった日時','わけ','休みの番号'],   /* Ver12.57.0 */
  jchg: ['日付','枠（E＝早出・L＝会計）','前の人','新しい人','変えた人（dr＝院長・adm＝アプリ管理者・pc＝当番管理・cal＝カレンダー・n:名前＝本人たち）','日時'],
  wishes: ['月','看護師id','名前','日付','種類','送った日時'],
  months: ['月','しめきり','設定'],
  roster: ['月','確定日時','当番表'],
  frames: ['月','更新日時','中身（休診・EGD枠・CS枠のあるなし）'],
  calstaff: ['月','更新日時','中身（担当者_YYYY-MM.json と同じ形）'],
  duty: ['月','確定日時','中身（当番表_YYYY-MM.json と同じ形）'],
  changes: ['番号','月','種類','申し込んだ人id','申し込んだ人','相手id','相手','日付','枠','相手の日付','相手の枠','ひとこと','状態','申し込んだ日時','返事の日時','理由'],
  survey: ['看護師id','名前','入りたくない早出（1位から）','入りたくないCS（1位から）','早出とCS','答えた日時','そのほか（自由記入）','連日の当番']
};
/* 希望は日ごとに2文字：[早出][CS]（'a'＝避けたい、'n'＝入れない、'-'＝なし）。例 'n-'＝早出に入れない。
   前の版の 'avoid'／'no' は両方の枠とみなす */
const normW_ = v => v === 'avoid' ? 'aa' : v === 'no' ? 'nn' : String(v || '');
const okW_ = v => /^[-an]{2}$/.test(v) && v !== '--';
const nCount_ = v => { v = normW_(v); return okW_(v) ? (v[0] === 'n') + (v[1] === 'n') : 0; };

/* ---------- シートの読み書き（すべて文字として保存） ---------- */
/* Ver11.6.6：スマホで当番表を開くとき（getRoster・getInit）だけ、同じシートを何度も読まないように、

/* 事務の人がスマホで入れる（事務の人なら、どの日・だれの名前でも入れられる）。id が空なら「空ける」 */
function setClerkDuty(k, ds, slot, id){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    /* Ver11.16.0：院長・アプリ管理者のQRでも、事務の当番を入れかえられる（院長が決めた。急な休みのため） */
    const c = clerkByKey_(k), v = c ? null : viewerByKey_(k);

    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds) || !J_SLOT[slot]) return {ok:false, error:'入れる日がわかりません。'};
    if (ds < today_()) return {ok:false, error:'過ぎた日は変えられません。'};
    if (ds.slice(0,7) > ymAdd_(today_().slice(0,7), 2)) return {ok:false, error:'入れられるのは、再来月までです。'};

  }
}

/* Ver11.9.0：希望の受付は、当番管理が送った「受付を始める日時」（設定の open）から。
   open がない月（前の版の当番管理で始めた月）は、今までどおりすぐ受け付ける */
function openOf_(r){ try { const o = JSON.parse(r[2] || '{}').open; const d = o ? new Date(o) : null; return d && !isNaN(d) ? d : null; } catch(e){ return null; } }
const iso_ = v => { const d = new Date(v); return isNaN(d) ? '' : d.toISOString(); };
/* まだ受付が始まっていない月のうち、いちばん早いもの（スマホに「〇日から入れられます」と出す） */
function nextWish_(rows){
  const now = new Date();
  const L = rows.filter(r => { const o = openOf_(r); return o && now < o; }).sort((a, b) => a[0] < b[0] ? -1 : 1);
  return L.length ? {ym:L[0][0], open:openOf_(L[0]).toISOString(), deadline:iso_(L[0][1])} : null;
}
/* 院長・アプリ管理者のQR用：来月から3か月分の、希望の受付のようす（送った人の数だけ。名前は出さない） */
function wishState_(){
  const now = new Date(), ym0 = today_().slice(0,7), rows = read_('months'), W = read_('wishes');
  const ids = read_('nurses').filter(r => r[3] === '1').map(r => r[0]);   /* テスト用の人は数えない */
  return [1,2,3].map(i => ymAdd_(ym0, i)).map(ym => {
    const m = rows.find(r => r[0] === ym);
    if (!m) return {ym:ym, st:'none'};
    const o = openOf_(m), dl = new Date(m[1]);
    const sent = {}; W.forEach(r => { if (r[0] === ym && r[4] === 'sent') sent[r[1]] = 1; });
    return {ym:ym, st:(o && now < o) ? 'before' : (now > dl ? 'closed' : 'open'), open:o ? o.toISOString() : '', deadline:iso_(m[1]),
            sent:ids.filter(id => sent[id]).length, total:ids.length};
  });
}

/* アンケートに答える（しめきりに関係なく、いつでも答え直せる） */
function saveSurvey(k, a){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    a = a || {};
    const okL = v => Array.isArray(v) && v.length <= 3 && v.every(x => /^[1-6]$/.test(String(x))) && new Set(v.map(String)).size === v.length;
    if (!okL(a.early) || !okL(a.cs) || !SV_PAIR[a.pair] || !SV_ROW[a.row]) return {ok:false, error:'答えをえらんでください。'};
    const note = String(a.note || '').replace(/\r/g,'').trim().slice(0, 500);   /* 自由記入は500字まで */
    const rows = read_('survey').filter(r => r[0] !== n.id);
    const t = now_();
    rows.push([n.id, n.name, svText_(a.early.map(String)), svText_(a.cs.map(String)), SV_PAIR[a.pair], t, note, SV_ROW[a.row]]);
    write_('survey', rows);

  } finally {

  }
}

/* 希望を送る */
function saveWishes(k, ym, map){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    const m = read_('months').find(r => r[0] === ym);
    if (!m) return {ok:false, error:'この月の受付はまだ始まっていません。'};
    const o = openOf_(m); if (o && new Date() < o) return {ok:false, error:'この月の受付はまだ始まっていません。'};
    if (new Date() > new Date(m[1])) return {ok:false, error:'しめきりを過ぎたので、もう直せません。'};
    const cfg = JSON.parse(m[2] || '{}');
    const dayCfg = {}; (cfg.days || []).forEach(d => { dayCfg[d.d] = d; });
    const clean = {};
    Object.keys(map || {}).forEach(ds => {
      const d = dayCfg[ds]; if (String(ds).slice(0,7) !== ym || !d || d.off) return;
      const v = normW_(map[ds]); if (!okW_(v)) return;
      const w = (d.e === false ? '-' : v[0]) + (d.c === false ? '-' : v[1]);   /* その日にない枠は消す */
      if (w !== '--') clean[ds] = w;
    });
    // 上限の確認（入れない枠：前後の月とあわせて続く3か月で。早出だけなら1つ、早出とCSなら2つ）
    const all = read_('wishes');
    const others = all.filter(r => !(r[0] === ym && r[1] === n.id));
    const yy = ym.slice(0,4);
    const noBy = {}, noOld = {};
    all.forEach(r => { if (r[1] === n.id && r[3]){ const k2 = r[3].slice(0,7); noOld[k2] = (noOld[k2]||0) + nCount_(r[4]); } });
    others.forEach(r => {
      if (r[1] !== n.id || !r[3]) return;
      const k2 = r[3].slice(0,7); noBy[k2] = (noBy[k2]||0) + nCount_(r[4]);
    });
    Object.keys(clean).forEach(ds => { noBy[ym] = (noBy[ym]||0) + nCount_(clean[ds]); });
    const lim = cfg.limits || {};
    const noNew = noWorst_(ym, x => noBy[x] || 0), noBefore = noWorst_(ym, x => noOld[x] || 0);
    if (lim.no !== undefined && noNew > lim.no && noNew > noBefore) return {ok:false, error:'入れない枠は、前後の月とあわせて続く3か月で'+lim.no+'つまでです。'};
    const t = now_();
    const add = Object.keys(clean).sort().map(ds => [ym, n.id, n.name, ds, clean[ds], t]);
    add.push([ym, n.id, n.name, '', 'sent', t]);
    write_('wishes', others.concat(add));
    return {ok:true, savedAt:t};
  } finally {
    lock.releaseLock();
  }
}

function admin_(b){
  const P = PropertiesService.getScriptProperties();
  const cur = P.getProperty('ADMIN');
  if (b.action === 'setup'){
    if (!b.admin) return {ok:false, error:'合言葉がありません。'};

    if (cur !== b.admin) return {ok:false, error:'このスプレッドシートは、別の当番アプリのデータとつながっています。'};
    if (b.nurses) saveNurses_(b.nurses);
    if (b.clerks) saveClerks_(b.clerks);
    if (b.viewKey) saveViewKey_(b.viewKey); saveAdmKey_(b.admKey); saveStartYM_(b.startYM);
    return {ok:true, ver:VER};
  }
  if (!cur || cur !== b.admin) return {ok:false, error:'接続が確かめられません。設定の「接続を確かめる」を押してください。'};
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    if (b.nurses) saveNurses_(b.nurses);
    if (b.clerks) saveClerks_(b.clerks);
    if (b.viewKey) saveViewKey_(b.viewKey); saveAdmKey_(b.admKey); saveStartYM_(b.startYM);   /* Ver11.23.0 */
    saveLeaveCfg_(b.leaveCfg);   /* Ver12.0.0 */

    if (b.action === 'publish'){
      upsert_('months', b.ym, [b.ym, b.deadline, JSON.stringify(b.cfg || {})]);

    }
    if (b.action === 'getWishes'){
      const wishes = {}, sent = {};
      read_('wishes').forEach(r => {
        if (r[0] !== b.ym) return;
        if (r[4] === 'sent') sent[r[1]] = r[5];
        else if (r[3]){ (wishes[r[1]] = wishes[r[1]] || {})[r[3]] = r[4]; }
      });
      const survey = {}; read_('survey').forEach(r => { survey[r[0]] = surveyRow_(r); });
      return {ok:true, wishes:wishes, sent:sent, survey:survey};
    }
    if (b.action === 'endoscKey'){   /* 内視鏡カレンダーとの合言葉を保存（PCアプリの設定から）。空なら消す */
      const k = String(b.endoscKey || '').trim(), P2 = PropertiesService.getScriptProperties();
      if (b.check) return {ok:true, set:!!P2.getProperty('ENDOSC_KEY')};
      if (!k){ P2.deleteProperty('ENDOSC_KEY'); return {ok:true, set:false}; }
      if (!/^[\x21-\x7e]{8,64}$/.test(k)) return {ok:false, error:'合言葉は半角の英数字・記号で8〜64文字です。'};
      P2.setProperty('ENDOSC_KEY', k);
      return {ok:true, set:true};
    }
    if (b.action === 'getFrames'){   /* カレンダーから届いた枠のあるなし（院外のPCでも当番を組めるように） */
      const want = Array.isArray(b.months) ? b.months : null;
      return {ok:true, comments:commentsOf_(want), frames:read_('frames').filter(r => !want || want.indexOf(r[0]) >= 0).map(r => { try { return JSON.parse(r[2]); } catch(e){ return null; } }).filter(Boolean)};
    }

          .map(x => ({ds:x.ds, role:x.role, name:String(x.name).slice(0, 40), at:String(x.at)}));

        changes:read_('changes').map(chgObj_).filter(c => c.state === 'done').map(c => ({kind:c.kind, msg:c.msg, ds:c.ds, slot:c.slot, ds2:c.ds2 || '', slot2:c.slot2 || '', fromName:c.fromName || '', toName:c.toName || '', at:String(c.ansAt || c.at || '')})),

    if (b.action === 'roster'){

      upsert_('roster', b.ym, [b.ym, b.at || now_(), JSON.stringify(b.data || {})]);

  } finally {

/* ================= 内視鏡カレンダーとのやりとり（endoscSync） =================
   カレンダー → 枠のあるなし（休診・EGD枠・CS枠。患者の情報や数は来ない）を月ごとに保存
   カレンダー ← 看護師名簿と、確定した当番表（from の月から先）を返す
   院内のPCの台数分、同じ内容が重なって届いてもよい作り */
function isoNow_(){ return Utilities.formatDate(new Date(), 'Asia/Tokyo', "yyyy-MM-dd'T'HH:mm:ssXXX"); }
function endoscSync_(b){
  /* 合言葉：保存されていれば必ず確かめる（まだ保存されていない間だけ、合言葉なしでも受け付ける） */
  /* Ver11.3.0：プロパティは1回でまとめて読む（1分ごとの読み直しで、Googleの1日の上限に近づかないように） */
  const P0 = PropertiesService.getScriptProperties();
  const pr = typeof P0.getProperties === 'function' ? P0.getProperties() : {ENDOSC_KEY:P0.getProperty('ENDOSC_KEY'), J_VER:P0.getProperty('J_VER')};
  const want = pr.ENDOSC_KEY || '', jv = pr.J_VER || '0';
  if (want && String(b.key || '') !== want) return {ok:false, error:'合言葉が違います'};
  /* Ver11.2.0：事務の当番だけの軽い読み直し（"clerkOnly":true）。枠・担当者・看護師の当番は扱わない。
     送る入力がなく、前に受け取った番号（clerkVer）から変わっていなければ、シートを読まずに「同じ」とだけ返す */
  if (b.clerkOnly === true){
    const base = {ok:true, ver:1, kind:'当番連携', clerkOnly:true};
    if (!want){ base.clerkState = 'nokey'; return base; }   /* 合言葉が未保存の間は、事務の当番は扱わない（Ver11.3.0：理由を返す） */
    const has = Array.isArray(b.clerkEdits) && b.clerkEdits.length > 0;
    const cq = (Array.isArray(b.calReqs) && b.calReqs.length) || (Array.isArray(b.calLeave) && b.calLeave.length);   /* Ver12.57.0 */
    if (!has && !cq && !b.clerkFrom && String(b.clerkVer || '') === jv){ base.clerkVer = jv; base.same = true; if (b.calAsk === true) calReqIn_({}, base); return base; }   /* Ver12.58.0：ようすだけ聞くとき（calAsk）は、変わりがなくても calReqState を返す（重い読み直しはしない） */
    const lk = LockService.getScriptLock(); lk.waitLock(20000);
    try { clerkEdits_(b); const o = clerkOut_(base, /^\d{4}-\d{2}$/.test(b.from) ? b.from : '', b.clerkFrom); calReqIn_(b, o); return o; }
    finally { lk.releaseLock(); }
  }
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    (Array.isArray(b.slots) ? b.slots : []).slice(0, 6).forEach(m => {
      if (!m || !/^\d{4}-\d{2}$/.test(m.month) || !m.days || typeof m.days !== 'object') return;
      const days = {};
      Object.keys(m.days).forEach(ds => {
        if (ds.slice(0,7) !== m.month || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
        const x = m.days[ds] || {}, off = x.off === true;
        days[ds] = {off:off, egd:!off && x.egd === true, cs:!off && x.cs === true};
      });
      const old = read_('frames').find(r => r[0] === m.month);
      const t = Date.parse(m.updatedAt), to = old ? Date.parse(old[1]) : NaN;
      if (old && !isNaN(to) && !isNaN(t) && t < to) return;   /* 古い内容があとから届いたときは置きかえない */
      upsert_('frames', m.month, [m.month, String(m.updatedAt || ''), JSON.stringify({month:m.month, updatedAt:m.updatedAt || '', days:days})]);
    });
    /* カレンダーで交代した担当者（manual が true の役割）を、スマホの当番表・カレンダー用当番表に反映し、
       「当番の変更」に「カレンダーで交代」として残す（PCアプリはこれを取り込んで、回数も直す） */
    (Array.isArray(b.staff) ? b.staff : []).slice(0, 6).forEach(m => {
      if (!m || !/^\d{4}-\d{2}$/.test(m.month) || !m.days || typeof m.days !== 'object') return;
      const old = read_('calstaff').find(r => r[0] === m.month);
      const t = Date.parse(m.updatedAt), to = old ? Date.parse(old[1]) : NaN;
      if (old && !isNaN(to) && !isNaN(t) && t < to) return;
      upsert_('calstaff', m.month, [m.month, String(m.updatedAt || ''), JSON.stringify({month:m.month, updatedAt:m.updatedAt || '', days:m.days})]);
      calApply_(m);
    });
    const st = PropertiesService.getScriptProperties().getProperty('STAFF');
    const from = /^\d{4}-\d{2}$/.test(b.from) ? b.from : '';
    const duties = read_('duty').filter(r => r[0] >= from).sort((a, c) => a[0] < c[0] ? -1 : 1).map(r => { try { return JSON.parse(r[2]); } catch(e){ return null; } }).filter(Boolean);
    const res = {ok:true, ver:1, kind:'当番連携', roster: st ? JSON.parse(st) : null, duties:duties};
    /* Ver11.0.0：事務の早出・会計（名前だけ）を、カレンダーでも見る・入れる。
       合言葉が保存されていて、合っているときだけ（保存前は、受け取りも返事もしない） */
    if (want){ clerkEdits_(b); clerkOut_(res, from, b.clerkFrom); calReqIn_(b, res); }   /* Ver12.57.0：カレンダーからの申請 */
    else res.clerkState = 'nokey';   /* Ver11.3.0：事務の当番を返さない理由（カレンダーの「つながるか確認」に出す） */
    return res;
  } finally {
    lock.releaseLock();
  }
}
/* カレンダーで交代した役割を当番表に反映する。
   同じ内容が何度届いても1回だけ反映する（役割ごとに「最後に反映したカレンダーの名前」を覚える）。
   そのあとスマホで交換した当番を、古いカレンダーの内容で戻してしまわないため */
function calApply_(m){
  const R = rosterMap_(); if (!R[m.month]) return;
  const N = nurseMap_(), byName = {}; Object.keys(N).forEach(id => { byName[N[id].name] = N[id]; });
  const P = PropertiesService.getScriptProperties();
  let applied = {}; try { applied = JSON.parse(P.getProperty('CAL_APPLIED') || '{}'); } catch(e){}
  const ROLE = {early:'E', cs:'C', cs2:'C2'};
  const rows = read_('changes'), list = rows.map(chgObj_);
  let changed = false;
  Object.keys(m.days).sort().forEach(ds => {
    const x = m.days[ds] || {}, man = x.manual || {};
    const d = R[m.month].data.days && R[m.month].data.days[ds]; if (!d) return;
    Object.keys(ROLE).forEach(role => {
      const isMan = role === 'cs2' ? (man.cs2 === true || man.cs === true) : man[role === 'early' ? 'early' : 'cs'] === true;
      const t = ROLE[role], name = String(x[role] || ''), key = ds+'|'+t;
      /* Ver9.0.1：カレンダーで「手で変えた」印が消えたら、覚えていた名前も消す。
         （覚えたままだと、あとでもう一度同じ人に交代したときに反映されない） */
      if (!isMan){ if (key in applied) delete applied[key]; return; }
      if (applied[key] === name) return;              /* もう反映した */
      const curId = d[SLOT_KEY[t][0]] || '', curName = d[SLOT_KEY[t][1]] || '';
      applied[key] = name;
      if (curName === name) return;                    /* 当番表と同じ */
      const n = name ? byName[name] : {id:'', name:''};
      if (!n) return;                                  /* 名簿にない名前は反映しない */
      setHolder_(R, ds, t, n);
      dutyApply_(ds, t, n.name);
      const c = {id:'k'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36), ym:m.month, kind:'cal', from:curId, fromName:curName, to:n.id, toName:n.name,
                 ds:ds, slot:t, ds2:'', slot2:'', msg:'', state:'done', at:now_(), ansAt:now_()};
      /* その当番にかかわる返事待ちの申し込みは無効にする */
      list.forEach(y => { if (y.state === 'wait' && ((y.ds === ds && y.slot === t) || (y.kind === 'swap' && y.ds2 === ds && y.slot2 === t))){ y.state = 'bad'; y.why = 'カレンダーで当番が交代されました。'; y.ansAt = c.ansAt; } });
      list.push(c);
      changed = true;
    });
  });
  if (changed){
    upsert_('roster', m.month, [m.month, R[m.month].at, JSON.stringify(R[m.month].data)]);
    write_('changes', list.map(chgRow_));
  }
  /* 2か月より前の記録は消す */
  const lim = Utilities.formatDate(new Date(Date.now() - 62*86400000), 'Asia/Tokyo', 'yyyy-MM-dd');
  Object.keys(applied).forEach(k => { if (k.slice(0,10) < lim) delete applied[k]; });
  P.setProperty('CAL_APPLIED', JSON.stringify(applied));
}
/* カレンダーの「この日のコメント」（普通・重要）。担当者の送り物（calstaff）の各日の comments から取り出す。
   秘密コメントはカレンダーが送ってこない。当番アプリでは書きかえない（見るだけ） */
const CMT_COLOR = {red:1, blue:1, black:1};
/* Ver12.28.0：当番表がまだない月でも、今月と来月のコメントは出す（前は当番表のある月だけだった） */
function cmMonths_(L){ const t = today_(), y = +t.slice(0,4), m = +t.slice(5,7), nx = m === 12 ? (y+1)+'-01' : y+'-'+('0'+(m+1)).slice(-2);
  const a = (L || []).concat([0,1,2,3,4,5].map(i => ymAdd_(t.slice(0,7), i))); return a.filter((x, i) => a.indexOf(x) === i); }   /* Ver12.46.0：6か月先まで */
function commentsOf_(months){
  const out = {};
  read_('calstaff').forEach(r => {
    if (months && months.indexOf(r[0]) < 0) return;
    let j; try { j = JSON.parse(r[2]); } catch(e){ return; }
    Object.keys(j.days || {}).forEach(ds => {
      const c = (j.days[ds] || {}).comments || {};
      const nm = (Array.isArray(c.normal) ? c.normal : []).map(x => String(x && x.text || '').slice(0, 60)).filter(Boolean).slice(0, 10);
      const im = (Array.isArray(c.important) ? c.important : []).map(x => ({text:String(x && x.text || '').slice(0, 60), color:CMT_COLOR[x && x.color] ? x.color : 'black'})).filter(x => x.text).slice(0, 10);
      if (nm.length || im.length) out[ds] = {normal:nm, important:im};
    });
    out['@'+r[0]] = r[1];   /* その月の更新日時 */
  });
  return out;
}
/* スマホで交換・代わりが決まったとき、カレンダー用の当番表もすぐ直す */
function dutyApply_(ds, t, name){
  const ym = String(ds).slice(0,7), row = read_('duty').find(r => r[0] === ym);
  if (!row) return;
  let d; try { d = JSON.parse(row[2]); } catch(e){ return; }
  if (!d.days) d.days = {};
  const x = d.days[ds] = d.days[ds] || {early:'', cs:'', cs2:''};
  x[t === 'E' ? 'early' : t === 'C' ? 'cs' : 'cs2'] = name;
  d.confirmedAt = isoNow_();
  upsert_('duty', ym, [ym, d.confirmedAt, JSON.stringify(d)]);
}

/* ================= 当番表アプリ（roster.html）：当番の交換・代わり =================
   ・交換（swap）：自分の当番と、相手の同じ種類の当番（早出どうし・CSどうし）を入れかえる。回数は変わらない
   ・代わり（give）：自分の当番をだれかに代わってもらう（相手を決めず、みんなに出す。いちばん先に「代わる」を押した人に決まる）。代わった人の回数が1つ増える
   ・代わってあげる（take）：相手の当番に自分が入る。自分の回数が1つ増える（相手が「OK」で決まる）
   ・相手が「OK」を押した時点で決まる（院長の承認はいらない）。決まると当番表がすぐ書きかわる
   ・今日より前の当番は変えられない */
const CHG_KIND = {swap:'交換', give:'代わり', take:'代わってあげる', cal:'カレンダーで交代'};
const CHG_STATE = {wait:'返事待ち', done:'成立', no:'お断り', cancel:'取り消し', bad:'無効'};
const SLOT_NAME = {E:'早出', C:'CS', C2:'CS'};
const SLOT_KEY = {E:['eId','early'], C:['cId','cs'], C2:['c2Id','cs2']};
const typeOf_ = t => t === 'E' ? 'E' : 'C';
function appUrl_(){ try { return ScriptApp.getService().getUrl(); } catch(e){ return ''; } }
function today_(){ return Utilities.formatDate(new Date(), 'Asia/Tokyo', 'yyyy-MM-dd'); }
function chgObj_(r){
  const st = Object.keys(CHG_STATE).find(k => CHG_STATE[k] === r[12]) || 'bad';
  return {id:r[0], ym:r[1], kind:Object.keys(CHG_KIND).find(k => CHG_KIND[k] === r[2]) || '', from:r[3], fromName:r[4], to:r[5], toName:r[6],
          ds:r[7], slot:r[8], ds2:r[9], slot2:r[10], msg:r[11], state:st, at:r[13], ansAt:r[14], why:r[15] || ''};
}
function chgRow_(c){
  return [c.id, c.ym, CHG_KIND[c.kind], c.from, c.fromName, c.to, c.toName, c.ds, c.slot, c.ds2 || '', c.slot2 || '', c.msg || '', CHG_STATE[c.state], c.at, c.ansAt || '', c.why || ''];
}
function nurseMap_(){ const m = {}; read_('nurses').forEach(r => { m[r[0]] = {id:r[0], name:r[1], active:r[3] === '1', canE:r[4] !== '0', canC:r[5] !== '0', ngE:ngList_(r[6]), ngC:ngList_(r[8]), ok:okList_(r[7])}; }); return m; }
/* Ver11.23.0：当番アプリを使い始める月（START_YM。当番管理が、内視鏡カレンダーの設定 dutyStartMonth を読んで送ってくる）。
   その月より前は、当番管理で確定した当番表を使わない（交換・代わり・院長の変更も受け付けない）。
   スマホには、カレンダーで手で入れた看護師の名前（calstaff）を、見るだけで出す */
function startYM_(){ return PropertiesService.getScriptProperties().getProperty('START_YM') || ''; }
function saveStartYM_(v){
  if (typeof v !== 'string') return;
  if (v && !/^\d{4}-\d{2}$/.test(v)) return;
  const P = PropertiesService.getScriptProperties();
  if ((P.getProperty('START_YM') || '') === v) return;
  if (v) P.setProperty('START_YM', v); else P.deleteProperty('START_YM');
}
function calRoster_(){
  const s = startYM_(); if (!s) return [];
  const N = nurseMap_(), byName = {}; Object.keys(N).forEach(id => { if (N[id].active) byName[N[id].name] = id; });
  const F = framesMap_(), min = ymAdd_(today_().slice(0,7), -2), out = [], seen = {};
  read_('calstaff').slice().reverse().forEach(r => {   /* 同じ月が2行あっても、あとの行だけ使う */
    const ym = String(r[0] || ''); if (!/^\d{4}-\d{2}$/.test(ym) || ym >= s || ym < min || seen[ym]) return;
    seen[ym] = 1;
    let o; try { o = JSON.parse(r[2] || '{}'); } catch(e){ return; }
    const days = {}, fm = F[ym] || {};
    Object.keys(o.days || {}).forEach(ds => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds) || ds.slice(0,7) !== ym) return;
      const x = o.days[ds] || {}, f = fm[ds]; if (f && f.off) return;
      const nm = k => String(x[k] || '').slice(0, 40), idOf = n => n ? (byName[n] || 'cal:'+n) : '';
      const d = {};
      if (nm('early') || (f && f.egd)){ d.early = nm('early'); d.eId = idOf(d.early); }
      if (nm('cs') || (f && f.cs)){ d.cs = nm('cs'); d.cId = idOf(d.cs); }
      if (nm('cs2')){ d.cs2 = nm('cs2'); d.c2Id = idOf(d.cs2); }
      if (Object.keys(d).length) days[ds] = d;
    });
    out.push({ym:ym, at:String(o.updatedAt || r[1] || ''), data:{days:days, cal:true}});
  });
  return out;
}
/* 当番管理で確定した当番表（使い始める月から）＋カレンダーで入れた分（その前の月）。スマホに返す一覧 */
function rosterList_(R){ return Object.keys(R).sort().map(ym => ({ym:ym, at:R[ym].at, data:R[ym].data})).concat(calRoster_()).sort((a,b) => a.ym < b.ym ? -1 : a.ym > b.ym ? 1 : 0); }
function rosterMap_(){ const st = startYM_(), m = {}; read_('roster').forEach(r => { if (st && r[0] < st) return; m[r[0]] = {at:r[1], data:JSON.parse(r[2] || '{}')}; }); return m; }
function holder_(R, ds, t){ const m = R[String(ds).slice(0,7)]; const d = m && m.data.days && m.data.days[ds]; return d ? (d[SLOT_KEY[t][0]] || '') : null; }

/* その変更がいま成り立つかを確かめる（成り立たなければ理由を返す） */
function chgProblem_(c, R, N){
  /* Ver12.2.0：交代のあと当番に入る人に、その日の休み（申請中・受理）があれば断る */
  const put = c.kind === 'take' ? [[c.from, c.ds, c.slot]] : c.kind === 'swap' ? [[c.to, c.ds, c.slot], [c.from, c.ds2, c.slot2]] : [[c.to, c.ds, c.slot]];
  const LC = {};
  for (const [id, ds, sl] of put){ const lv = id && leaveOn_('n', id, ds, sl, LC); if (lv) return lvMsg_((N[id] || {}).name || '', ds, lv); }
  return chgProblem0_(c, R, N);
}
function chgProblem0_(c, R, N){
  const td = today_();
  if (c.ds < td || (c.kind === 'swap' && c.ds2 < td)) return '過ぎた日の当番なので変えられません。';
  const to = N[c.to], from = N[c.from];
  if (!from) return '申し込んだ人が見つかりません。';
  if (c.kind === 'give' && !c.to) return holder_(R, c.ds, c.slot) === c.from ? '' : SLOT_NAME[c.slot]+'（'+c.ds.slice(5).replace('-','/')+'）の当番が、もう'+c.fromName+'さんではありません。';   /* みんなに出した「代わってもらう」 */
  if (!to || !to.active) return '相手が見つかりません。';
  const can = (n, t) => typeOf_(t) === 'E' ? n.canE : n.canC;
  const other = t => t === 'C' ? 'C2' : t === 'C2' ? 'C' : null;   /* 同じ日のCS2人が同じ人にならないように */
  const dl = ds => ds.slice(5).replace('-','/');
  const DOWJ = ['日','月','火','水','木','金','土'];
  const dowOf = ds => { const a = String(ds).split('-').map(Number); return new Date(a[0], a[1]-1, a[2]).getDay(); };
  const ngOn = (n, ds, t) => { const L = typeOf_(t) === 'E' ? n.ngE : n.ngC; return L && L.indexOf(dowOf(ds)) >= 0 && !(n.ok && n.ok.indexOf(ds) >= 0) ? n.name+'さんは'+DOWJ[dowOf(ds)]+'曜日の'+SLOT_NAME[t]+'に入れない設定です。' : ''; };
  if (c.kind === 'take'){
    if (holder_(R, c.ds, c.slot) !== c.to) return SLOT_NAME[c.slot]+'（'+dl(c.ds)+'）の当番が、もう'+to.name+'さんではありません。';
    if (!can(from, c.slot)) return from.name+'さんは'+SLOT_NAME[c.slot]+'に入らない設定です。';
    if (ngOn(from, c.ds, c.slot)) return ngOn(from, c.ds, c.slot);
    const o = other(c.slot);
    if (o && holder_(R, c.ds, o) === c.from) return dl(c.ds)+'のCSに、'+from.name+'さんがもう入っています。';
    return '';
  }
  if (holder_(R, c.ds, c.slot) !== c.from) return SLOT_NAME[c.slot]+'（'+dl(c.ds)+'）の当番が、もう'+c.fromName+'さんではありません。';
  if (!can(to, c.slot)) return to.name+'さんは'+SLOT_NAME[c.slot]+'に入らない設定です。';
  if (ngOn(to, c.ds, c.slot)) return ngOn(to, c.ds, c.slot);
  if (c.kind === 'swap' && ngOn(from, c.ds2, c.slot2)) return ngOn(from, c.ds2, c.slot2);
  if (c.kind === 'swap'){
    if (holder_(R, c.ds2, c.slot2) !== c.to) return SLOT_NAME[c.slot2]+'（'+c.ds2.slice(5).replace('-','/')+'）の当番が、もう'+to.name+'さんではありません。';
    if (typeOf_(c.slot) !== typeOf_(c.slot2)) return '交換は、早出どうし・CSどうしでできます。';
    if (c.ds === c.ds2) return '同じ日の当番どうしは交換できません。';
    const o1 = other(c.slot), o2 = other(c.slot2);
    if (o1 && holder_(R, c.ds, o1) === c.to) return c.ds.slice(5).replace('-','/')+'のCSに、'+to.name+'さんがもう入っています。';
    if (o2 && holder_(R, c.ds2, o2) === c.from) return c.ds2.slice(5).replace('-','/')+'のCSに、'+c.fromName+'さんがもう入っています。';
  } else {
    const o1 = other(c.slot);
    if (o1 && holder_(R, c.ds, o1) === c.to) return c.ds.slice(5).replace('-','/')+'のCSに、'+to.name+'さんがもう入っています。';
  }
  return '';
}
function setHolder_(R, ds, t, n){
  const m = R[String(ds).slice(0,7)]; const d = m.data.days[ds];
  d[SLOT_KEY[t][0]] = n.id; d[SLOT_KEY[t][1]] = n.name;
}

/* 当番表アプリを開いたとき */
function getRoster(k){ return once_(() => getRoster_(k)); }
function getRoster_(k){
  const n = nurseByKey_(k);
  if (!n){ const c = clerkByKey_(k); if (c) return clerkRoster_(c); }
  if (!n){ const v = viewerByKey_(k); if (v) return viewerRoster_(v); }
  if (!n) return {ok:false, error:BAD_KEY};
  const both_ = x => x.ngE.filter(w => x.ngC.indexOf(w) >= 0);   /* 前の版のスマホ画面用（早出もCSも入れない曜日） */
  const N = nurseMap_(), R = rosterMap_();
  const nurses = Object.keys(N).map(id => N[id]).filter(x => x.active).map(x => ({id:x.id, name:x.name, canE:x.canE, canC:x.canC, ngE:x.ngE, ngC:x.ngC, ng:both_(x), ok:x.ok}));
  const roster = rosterList_(R);   /* Ver11.23.0：使い始める月より前は、カレンダーで入れた名前 */
  const td = today_();
  const changes = read_('changes').map(chgObj_).filter(c => c.from === n.id || c.to === n.id || c.state === 'done' || (c.state === 'wait' && !c.to && !n.test)).map(c => {

  res.creq = calReqMine_(n.id);   /* Ver12.57.0：カレンダーからの当番の変更（自分にかかわるもの） */

/* 申し込む */
function askChange(k, a){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    if (n.test) return {ok:false, error:NO_TEST};
    a = a || {};
    if (!CHG_KIND[a.kind] || !SLOT_KEY[a.slot] || (a.kind === 'swap' && !SLOT_KEY[a.slot2])) return {ok:false, error:'申し込みの中身がわかりません。'};
    if (a.to === n.id) return {ok:false, error:'自分には申し込めません。'};
    const N = nurseMap_(), R = rosterMap_();
    const open = a.kind === 'give' && !a.to;   /* 代わってもらう：相手を決めず、みんなに出す */
    const to = open ? {id:'', name:''} : N[a.to];
    if (!to) return {ok:false, error:'相手が見つかりません。'};
    const c = {id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36), ym:String(a.ds).slice(0,7), kind:a.kind, from:n.id, fromName:n.name, to:to.id, toName:to.name,
               ds:String(a.ds), slot:a.slot, ds2:a.kind === 'swap' ? String(a.ds2) : '', slot2:a.kind === 'swap' ? a.slot2 : '', msg:String(a.msg || '').replace(/\r/g,'').trim().slice(0, 100),
               state:'wait', at:now_()};
    const why = chgProblem_(c, R, N);
    if (why) return {ok:false, error:why};
    const rows = read_('changes');
    const same = rows.map(chgObj_).find(x => x.state === 'wait' && x.from === n.id && ((x.ds === c.ds && x.slot === c.slot) || (x.kind === 'swap' && c.kind === 'swap' && x.ds2 === c.ds2 && x.slot2 === c.slot2)));
    if (same) return {ok:false, error:'この当番は、もう申し込んでいます。先に取り消してください。'};
    rows.push(chgRow_(c));
    write_('changes', rows);
    return {ok:true, change:c};
  } finally {
    lock.releaseLock();
  }
}

function cqObj_(r){ return {id:r[0], cid:r[1], type:r[2], ds:r[3], slot:r[4], from:r[5], fromName:r[6], to:r[7], toName:r[8], okF:r[9] === '1', okT:r[10] === '1', state:r[11], at:r[12], ansAt:r[13], why:r[14] || '', ref:r[15] || ''}; }
const cqRow_ = o => [o.id, o.cid, o.type, o.ds, o.slot, o.from || '', o.fromName || '', o.to || '', o.toName || '', o.okF ? '1' : '', o.okT ? '1' : '', o.state, o.at, o.ansAt || '', o.why || '', o.ref || ''];

function calReqIn_(b, res){
  const reqs = (Array.isArray(b.calReqs) ? b.calReqs : []).slice(0, 30), lvs = (Array.isArray(b.calLeave) ? b.calLeave : []).slice(0, 30);

  });
  if (lvs.length){

    const NC = {}; read_('clerks').forEach(r => { if (r[3] === '1') NC[r[1]] = {id:r[0], name:r[1]}; });
    lvs.forEach(q => {
      if (!q || !okId(q.id) || has(q.id)) return;
      const grp = q.who === 'clerk' ? 'j' : 'n', ds = String(q.ds || ''), part = String(q.part || ''), name = String(q.name || '').slice(0, 30);
      const o = {id:calReqId_(), cid:q.id, type:'leave', ds:ds, slot:part, to:grp, fromName:name, state:'bad', at:now_()};

/* 入る人がその当番に入れるか（スマホの交代と同じ決まり。あいている枠に入れるときも） */
function cqProblem_(o, t, R, N){

  if (o.from) return chgProblem_({kind:'give', from:o.from, fromName:o.fromName, to:t.id, toName:t.name, ds:o.ds, slot:o.slot}, R, N);

  const oth = o.slot === 'C' ? 'C2' : o.slot === 'C2' ? 'C' : null;
  if (oth && holder_(R, o.ds, oth) === t.id) return md_(o.ds)+'のCSに、'+t.name+'さんがもう入っています。';

/* スマホ：カレンダーからの当番の変更に返事をする（外れる人・入る人） */
function calReqAnswer(k, id, yes){

  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    if (n.test) return {ok:false, error:NO_TEST};
    const list = read_('calreq').map(cqObj_), o = list.find(x => x.id === String(id || '') && x.type === 'duty');
    if (!o || (o.from !== n.id && o.to !== n.id)) return {ok:false, error:'この申請は見つかりません。'};
    if (o.state !== 'wait') return {ok:false, error:'この申請は、もう終わっています。'};

      o.state = 'done'; o.ansAt = t;
      /* 記録は「カレンダーで交代」と同じ形（変更履歴・当番管理にそのまま出る）。ほかの返事待ちは無効にする */
      const C = read_('changes').map(chgObj_);
      C.forEach(x => { if (x.state === 'wait' && ((x.ds === o.ds && x.slot === o.slot) || (x.kind === 'swap' && x.ds2 === o.ds && x.slot2 === o.slot))){ x.state = 'bad'; x.why = 'カレンダーからの申請で当番が変わりました。'; x.ansAt = t; } });

/* スマホ：カレンダーで入れた休みを、本人が確かめる（OK＝申請になる。やめる＝取り消し） */
function leaveSelfOk(k, id, yes){
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const n = nurseByKey_(k), c = n ? null : clerkByKey_(k), p = n || c;
    if (!p) return {ok:false, error:BAD_KEY};
    const grp = n ? 'n' : 'j', list = read_('leave').map(leaveObj_), o = list.find(x => x.id === String(id || ''));
    if (!o || o.grp !== grp || o.pid !== p.id || o.state !== 'self') return {ok:false, error:'その申請が見つかりません。'};

    const hit = leaveDutyHit_(grp, p.id, o.ds, o.part);
    if (hit.length) return {ok:false, error:md_(o.ds)+'は'+hit.join('・')+'の当番が入っています。先に交代してから、もう一度OKを押してください。'};
    o.state = 'wait'; o.src = 'self'; o.at = now_(); leaveSave_(list);

function answerChange(k, id, yes){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    if (n.test) return {ok:false, error:NO_TEST};
    const rows = read_('changes'), list = rows.map(chgObj_);
    const c = list.find(x => x.id === id);
    if (!c || (c.to !== n.id && !(c.kind === 'give' && !c.to && c.from !== n.id))) return {ok:false, error:'この申し込みは見つかりません。'};
    if (c.state !== 'wait') return {ok:false, error:'この申し込みは、もう'+CHG_STATE[c.state]+'になっています。'};
    if (!c.to){ if (!yes) return {ok:true, change:c}; c.to = n.id; c.toName = n.name; }   /* みんなに出したもの：代わると押した人に決まる */
    c.ansAt = now_();
    if (!yes){ c.state = 'no'; write_('changes', list.map(chgRow_)); return {ok:true, change:c}; }
    const N = nurseMap_(), R = rosterMap_();
    const why = chgProblem_(c, R, N);
    if (why){ c.state = 'bad'; c.why = why; write_('changes', list.map(chgRow_)); return {ok:false, error:why+'（この申し込みは無効になりました）'}; }
    const from = N[c.from] || {id:c.from, name:c.fromName}, to = N[c.to];
    setHolder_(R, c.ds, c.slot, c.kind === 'take' ? from : to);
    if (c.kind === 'swap') setHolder_(R, c.ds2, c.slot2, from);
    dutyApply_(c.ds, c.slot, (c.kind === 'take' ? from : to).name);
    if (c.kind === 'swap') dutyApply_(c.ds2, c.slot2, from.name);
    [c.ym, String(c.ds2 || '').slice(0,7)].filter((ym,i,a) => ym && a.indexOf(ym) === i).forEach(ym => upsert_('roster', ym, [ym, R[ym].at, JSON.stringify(R[ym].data)]));
    c.state = 'done';
    /* 同じ当番にかかわる、ほかの返事待ちは無効にする */
    const touched = [[c.ds, c.slot]].concat(c.kind === 'swap' ? [[c.ds2, c.slot2]] : []);
    list.forEach(x => {
      if (x === c || x.state !== 'wait') return;
      const mine = [[x.ds, x.slot]].concat(x.kind === 'swap' ? [[x.ds2, x.slot2]] : []);
      if (mine.some(p => touched.some(q => p[0] === q[0] && p[1] === q[1]))){ x.state = 'bad'; x.why = 'ほかの変更で当番が変わりました。'; x.ansAt = c.ansAt; }
    });
    write_('changes', list.map(chgRow_));
    return {ok:true, change:c};
  } finally {
    lock.releaseLock();
  }
}

/* Ver11.16.0：院長・アプリ管理者のQRで、看護師の当番を入れかえる（本人の同意なしで、すぐ変わる。急な休みのため。院長が決めた）。
   ・使えるのは、院長のQR・アプリ管理者のQRの合言葉だけ。看護師・事務の合言葉では使えない
   ・今日から先の、当番のある枠だけ。入れられるのは、名簿にいる人（テスト用の人は除く）か「なし」
   ・記録は「カレンダーで交代」と同じ形（kind cal）で残す。メモ（msg）に @dr（院長）・@adm（アプリ管理者）と書く。
     こうしておくと、前の版の当番管理（PC）・スマホでも、そのまま当番表に反映される
   ・その当番にかかわる返事待ちの申し込みは、無効にする */
/* Ver12.8.0：12.7.0 でいったん消したが、院長のスマホの「当番変更」タブのために元にもどした（院長が決めた） */
function setDutyByBoss(k, ds, slot, id){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const v = viewerByKey_(k);
    if (!v) return {ok:false, error:BAD_KEY};
    ds = String(ds || ''); slot = String(slot || ''); id = String(id || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds) || !SLOT_KEY[slot]) return {ok:false, error:'変える当番がわかりません。'};
    if (ds < today_()) return {ok:false, error:'過ぎた日の当番は変えられません。'};
    const R = rosterMap_(), N = nurseMap_(), ym = ds.slice(0,7), m = R[ym], d = m && m.data.days && m.data.days[ds];
    if (!d || d[SLOT_KEY[slot][0]] === undefined) return {ok:false, error:'その日には、その当番がありません。画面を新しくして、もう一度ためしてください。'};
    const n = id ? N[id] : {id:'', name:''};
    if (!n || (id && (!n.active || n.test))) return {ok:false, error:'入れる人が見つかりません。'};
    const lv = id && leaveOn_('n', id, ds, slot); if (lv) return {ok:false, error:lvMsg_(n.name, ds, lv)};   /* Ver12.2.0 */
    const curId = d[SLOT_KEY[slot][0]] || '', curName = d[SLOT_KEY[slot][1]] || '';
    if (curId === n.id) return viewerRoster_(v);
    const o = slot === 'C' ? 'C2' : slot === 'C2' ? 'C' : null;
    if (id && o && holder_(R, ds, o) === id) return {ok:false, error:ds.slice(5).replace('-','/')+'のCSに、'+n.name+'さんがもう入っています。'};
    setHolder_(R, ds, slot, n);
    dutyApply_(ds, slot, n.name);
    upsert_('roster', ym, [ym, m.at, JSON.stringify(m.data)]);
    const list = read_('changes').map(chgObj_), t = now_();
    list.forEach(y => { if (y.state === 'wait' && ((y.ds === ds && y.slot === slot) || (y.kind === 'swap' && y.ds2 === ds && y.slot2 === slot))){ y.state = 'bad'; y.why = '院長が当番を変えました。'; y.ansAt = t; } });
    list.push({id:'b'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36), ym:ym, kind:'cal', from:curId, fromName:curName, to:n.id, toName:n.name,
               ds:ds, slot:slot, ds2:'', slot2:'', msg:v.adm ? '@adm' : '@dr', state:'done', at:t, ansAt:t});
    write_('changes', list.map(chgRow_));
    return viewerRoster_(v);
  } finally {
    lock.releaseLock();
  }
}

/* Ver11.17.0：院長・アプリ管理者のQRで、2つの当番を入れかえる（交換。本人の同意なしで、すぐ変わる）。
   who：'n'＝看護師（枠 E・C・C2）、'c'＝事務（枠 E・L）。早出どうし・CSどうし（事務は早出どうし・会計どうし）だけ。
   使えるのは院長・アプリ管理者の合言葉だけ。記録は setDutyByBoss と同じ形（kind cal、msg @dr・@adm）で、枠ごとに1つ残す */
function swapDutyByBoss(k, who, ds1, slot1, ds2, slot2){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const v = viewerByKey_(k);
    if (!v) return {ok:false, error:BAD_KEY};
    ds1 = String(ds1 || ''); ds2 = String(ds2 || ''); slot1 = String(slot1 || ''); slot2 = String(slot2 || '');
    const okD = ds => /^\d{4}-\d{2}-\d{2}$/.test(ds), td = today_(), dl = ds => ds.slice(5).replace('-','/');
    if (!okD(ds1) || !okD(ds2) || (ds1 === ds2 && slot1 === slot2)) return {ok:false, error:'入れかえる当番がわかりません。'};
    if (ds1 < td || ds2 < td) return {ok:false, error:'過ぎた日の当番は変えられません。'};
    if (who === 'c'){
      if (!J_SLOT[slot1] || !J_SLOT[slot2] || slot1 !== slot2) return {ok:false, error:'入れかえは、早出どうし・会計どうしでできます。'};
      const lim = ymAdd_(td.slice(0,7), 2);
      if (ds1.slice(0,7) > lim || ds2.slice(0,7) > lim) return {ok:false, error:'入れられるのは、再来月までです。'};
      const cur = (ds, sl) => { const d = jMonth_(ds.slice(0,7)).days[ds]; return (d && d[J_SLOT[sl][1]]) || ''; };
      const a = cur(ds1, slot1), b = cur(ds2, slot2);
      if (a === b) return viewerRoster_(v);
      { const LC = {}, nm = id => { const r = read_('clerks').find(x => x[0] === id); return r ? r[1] : ''; };   /* Ver12.2.0 */
        const l1 = b && leaveOn_('j', b, ds1, slot1, LC), l2 = a && leaveOn_('j', a, ds2, slot2, LC);
        if (l1) return {ok:false, error:lvMsg_(nm(b), ds1, l1)}; if (l2) return {ok:false, error:lvMsg_(nm(a), ds2, l2)}; }
      const F = framesMap_();
      if ((b && clerkOff_(ds1, F)) || (a && clerkOff_(ds2, F))) return {ok:false, error:'休診日には入れられません。'};
      const at = new Date().toISOString();
      if (jSet_([{ds:ds1, slot:slot1, id:b, at:at}, {ds:ds2, slot:slot2, id:a, at:at}], {}, v.adm ? 'adm' : 'dr') !== 2) return {ok:false, error:'入れかえられませんでした。画面を新しくして、もう一度ためしてください。'};
      return viewerRoster_(v);
    }
    if (!SLOT_KEY[slot1] || !SLOT_KEY[slot2] || typeOf_(slot1) !== typeOf_(slot2)) return {ok:false, error:'入れかえは、早出どうし・CSどうしでできます。'};
    const R = rosterMap_(), N = nurseMap_();
    const dayOf = ds => { const m = R[ds.slice(0,7)]; return m && m.data.days && m.data.days[ds]; };
    const d1 = dayOf(ds1), d2 = dayOf(ds2);
    if (!d1 || !d2 || d1[SLOT_KEY[slot1][0]] === undefined || d2[SLOT_KEY[slot2][0]] === undefined) return {ok:false, error:'その日には、その当番がありません。画面を新しくして、もう一度ためしてください。'};
    const A = {id:d1[SLOT_KEY[slot1][0]] || '', name:d1[SLOT_KEY[slot1][1]] || ''}, B = {id:d2[SLOT_KEY[slot2][0]] || '', name:d2[SLOT_KEY[slot2][1]] || ''};
    if (A.id === B.id) return viewerRoster_(v);
    { const LC = {}, l1 = B.id && leaveOn_('n', B.id, ds1, slot1, LC), l2 = A.id && leaveOn_('n', A.id, ds2, slot2, LC);   /* Ver12.2.0 */
      if (l1) return {ok:false, error:lvMsg_(B.name, ds1, l1)}; if (l2) return {ok:false, error:lvMsg_(A.name, ds2, l2)}; }
    const other = t => t === 'C' ? 'C2' : t === 'C2' ? 'C' : null, o1 = other(slot1), o2 = other(slot2);
    /* 入れかえたあとに、同じ日のCS2人が同じ人にならないように（同じ日のCSどうしの入れかえは、そのまま通す） */
    if (ds1 !== ds2){
      if (B.id && o1 && holder_(R, ds1, o1) === B.id) return {ok:false, error:dl(ds1)+'のCSに、'+B.name+'さんがもう入っています。'};
      if (A.id && o2 && holder_(R, ds2, o2) === A.id) return {ok:false, error:dl(ds2)+'のCSに、'+A.name+'さんがもう入っています。'};
    }
    setHolder_(R, ds1, slot1, B); setHolder_(R, ds2, slot2, A);
    dutyApply_(ds1, slot1, B.name); dutyApply_(ds2, slot2, A.name);
    [ds1.slice(0,7), ds2.slice(0,7)].filter((ym,i,a) => a.indexOf(ym) === i).forEach(ym => upsert_('roster', ym, [ym, R[ym].at, JSON.stringify(R[ym].data)]));
    const list = read_('changes').map(chgObj_), t = now_(), hit = (y, ds, sl) => (y.ds === ds && y.slot === sl) || (y.kind === 'swap' && y.ds2 === ds && y.slot2 === sl);
    list.forEach(y => { if (y.state === 'wait' && (hit(y, ds1, slot1) || hit(y, ds2, slot2))){ y.state = 'bad'; y.why = '院長が当番を変えました。'; y.ansAt = t; } });
    const rec = (ds, sl, from, to, i) => ({id:'b'+Date.now().toString(36)+i+Math.floor(Math.random()*1296).toString(36), ym:ds.slice(0,7), kind:'cal', from:from.id, fromName:from.name, to:to.id, toName:to.name,
                                          ds:ds, slot:sl, ds2:'', slot2:'', msg:v.adm ? '@adm' : '@dr', state:'done', at:t, ansAt:t});
    list.push(rec(ds1, slot1, A, B, 'a')); list.push(rec(ds2, slot2, B, A, 'b'));
    write_('changes', list.map(chgRow_));
    return viewerRoster_(v);
  } finally {
    lock.releaseLock();
  }
}

/* 申し込んだ人が取り消す */
function cancelChange(k, id){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    const list = read_('changes').map(chgObj_);
    const c = list.find(x => x.id === id);
    if (!c || c.from !== n.id) return {ok:false, error:'この申し込みは見つかりません。'};
