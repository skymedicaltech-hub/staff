<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>当番</title>
<meta name="theme-color" content="#B5E1F8">
<link rel="manifest" href="toban.webmanifest">
<link rel="apple-touch-icon" href="toban-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="当番">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2833; --sub:#7A8794; --faint:#B8C2CC; --line:#E3E9EF;
  --bg:#EEF3F8; --card:#FFFFFF; --sky:#3C7DC4; --sky-d:#2F68A8; --sky-s:#E2EDF8;
  --want:#3C8F6B; --want-s:#E0F1E8;
  --avoid:#C2852A; --avoid-s:#FAEEDB;
  --no:#D2564F; --no-s:#FBE3E1;
  --summer:#2A9AA3; --summer-s:#DDF1F2;
  --burden:#8C6BC4;
  --early:#C2662E; --cs:#3C7DC4;
  --r:14px;
}
:root{
  --ink:#1E2833; --sub:#7A8794; --faint:#B8C2CC; --line:#E3E9EF;
  --bg:#EEF3F8; --card:#FFFFFF; --sky:#3C7DC4; --sky-d:#2F68A8; --sky-s:#E2EDF8;
  --ok:#3C8F6B; --ok-s:#E0F1E8; --warn:#C2852A; --warn-s:#FAEEDB; --no:#D2564F; --no-s:#FBE3E1;
  --early:#C2662E; --early-s:#F8E5D9; --cs:#3C7DC4; --me:#FFE48A;
  --r:14px;
}
:root{--nav:calc(62px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:var(--nav)}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:"Outfit",sans-serif;font-feature-settings:"tnum"}
#wWrap{min-height:calc(100vh - var(--nav));display:flex;flex-direction:column}
#wApp{flex:1;display:flex;flex-direction:column}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;background:rgba(30,40,51,.92);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;z-index:9;max-width:84%;text-align:center;line-height:1.6;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:6}
#nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--sub);position:relative}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--sky)}
#demoBar{position:sticky;top:0;z-index:7;background:#1E2833;color:#fff;font-size:12px;padding:8px 10px;text-align:center}
#demoBar .dt2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:5px}
#demoBar button{border:none;border-radius:999px;padding:4px 11px;font-size:12px;background:#3B4856;color:#fff}
#demoBar button.on{background:#FFE48A;color:#1E2833;font-weight:700}
#demoBar #demoReset{background:#D2564F}
#navBadge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:999px;background:var(--no);color:#fff;font-family:"Outfit",sans-serif;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- 当番表・申し込み ---------- */


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:"Outfit",sans-serif;font-feature-settings:"tnum"}

#rWrap .head{padding:22px 20px 0}
#rWrap .hello{font-size:13px;color:var(--sub);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
#rWrap .hello b{color:var(--ink);font-weight:700;font-size:17px}
#rWrap .reload{border:none;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--sub);box-shadow:0 1px 2px rgba(30,40,51,.08)}
#rWrap .seg{display:flex;background:#DDE6EF;border-radius:999px;padding:4px;margin-top:14px}
#rWrap .seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 0;font-size:14px;font-weight:500;color:var(--sub);position:relative}
#rWrap .seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(30,40,51,.12)}
#rWrap .badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:999px;background:var(--no);color:#fff;font-family:"Outfit",sans-serif;font-size:11px;font-weight:600;margin-left:5px;padding:0 5px;vertical-align:1px}
#rWrap .month{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
#rWrap .month .t{display:flex;align-items:baseline;gap:8px}
#rWrap .month .m{font-family:"Outfit",sans-serif;font-size:44px;font-weight:500;line-height:1;letter-spacing:-.02em}
#rWrap .month .m small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:18px;font-weight:700;margin-left:2px}
#rWrap .month .y{font-family:"Outfit",sans-serif;font-size:15px;color:var(--sub)}
#rWrap .arrows{display:flex;gap:6px}
#rWrap .arrows button{width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:18px;box-shadow:0 1px 2px rgba(30,40,51,.08)}
#rWrap .arrows button:disabled{opacity:.3;cursor:default}

#rWrap .sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
#rWrap .sum div{background:#fff;border-radius:12px;padding:9px 12px;font-size:12px;color:var(--sub);display:flex;align-items:baseline;justify-content:space-between}
#rWrap .sum .num{font-size:22px;font-weight:600;color:var(--ink)}
#rWrap .sum .E{color:var(--early)}
#rWrap .sum .C{color:var(--cs)}
#rWrap .filter{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 0;font-size:12px;color:var(--sub)}
#rWrap .sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;user-select:none}
#rWrap .sw i{width:38px;height:22px;border-radius:999px;background:#C9D3DD;position:relative;transition:background .15s}
#rWrap .sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
#rWrap .sw.on i{background:var(--sky)}
#rWrap .sw.on i::after{left:19px}

#rWrap .alert{margin:14px 14px 0;background:var(--warn-s);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:#7A5418;display:flex;align-items:center;justify-content:space-between;gap:10px}
#rWrap .alert button{border:none;background:var(--warn);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap}

#rWrap .list{padding:14px 14px 120px}
#rWrap .day{background:#fff;border-radius:var(--r);margin-bottom:7px;padding:10px 12px;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}
#rWrap .day.past{opacity:.5}
#rWrap .day.today{box-shadow:inset 0 0 0 2px var(--sky)}
#rWrap .dt{text-align:center;line-height:1.1}
#rWrap .dt .num{font-size:24px;font-weight:500;display:block}
#rWrap .dt .w{font-size:12px;color:var(--sub)}
#rWrap .dt.s6 .w{color:var(--sky)}
#rWrap .dt.s0 .w{color:var(--no)}
#rWrap .slots{display:grid;grid-template-columns:auto 1fr;gap:0;align-items:start}
#rWrap .gE,#rWrap .gC{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#rWrap .gE{padding-right:12px;min-width:96px}
#rWrap .gC{border-left:1.5px dashed var(--line);padding-left:12px}
#rWrap .sl{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:6px 10px 6px 6px;font-size:14px;background:var(--bg);text-align:left}
#rWrap .sl .k{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;color:#fff}
#rWrap .sl .k.E{background:var(--early)}
#rWrap .sl .k.C{background:var(--cs)}
#rWrap .sl.mine{background:var(--me);font-weight:700}
#rWrap .sl.sel{box-shadow:0 0 0 3px var(--sky);transform:scale(1.04)}
#rWrap .sl.cand{box-shadow:0 0 0 2px var(--sky);background:#fff}
#rWrap .sl.dim{opacity:.25}
#rWrap .sl{transition:transform .1s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#rWrap .selbar{position:fixed;left:50%;bottom:calc(var(--nav) + 12px);transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:var(--sky);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;box-shadow:0 6px 16px rgba(60,125,196,.35);z-index:4}
#rWrap .selbar span{display:block;text-align:right;font-weight:700;margin-top:2px}
#rWrap .confirm{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transition:transform .22s ease;z-index:7}
#rWrap .confirm.show{transform:translate(-50%,0)}
#rWrap .confirm .ct{font-size:16px;font-weight:700;margin-bottom:10px}
#rWrap .undo{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;width:calc(100% - 28px);max-width:452px;background:rgba(30,40,51,.95);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:opacity .2s,transform .2s;z-index:8}
#rWrap .undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#rWrap .undo button{border:none;background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap}
#rWrap .sl.tap{box-shadow:0 0 0 1.5px #E2B93B}
#rWrap .sl .ch{font-size:11px;color:var(--ok);font-weight:700}
#rWrap .sl.empty{color:var(--faint)}
#rWrap .sl:disabled{cursor:default}
#rWrap .hint{font-size:12px;color:var(--sub);text-align:center;margin:4px 20px 0;line-height:1.7}

#rWrap .box{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px}
#rWrap .h2{font-size:13px;color:var(--sub);font-weight:700;margin:18px 6px 8px;letter-spacing:.04em}
#rWrap .h2:first-child{margin-top:4px}
#rWrap .req .who{font-size:14px}
#rWrap .req .who b{font-size:16px}
#rWrap .req .what{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
#rWrap .pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border-radius:8px;padding:4px 8px;font-size:13.5px}
#rWrap .pill .k{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;color:#fff}
#rWrap .pill .k.E{background:var(--early)}
#rWrap .pill .k.C{background:var(--cs)}
#rWrap .arrow{color:var(--sub);font-size:13px}
#rWrap .req .note{margin-top:8px;font-size:13px;background:var(--bg);border-radius:8px;padding:7px 10px;white-space:pre-wrap}
#rWrap .req .st{margin-top:8px;font-size:12.5px;font-weight:700}
#rWrap .st.done{color:var(--ok)}
#rWrap .st.no,#rWrap .st.bad{color:var(--no)}
#rWrap .st.wait{color:var(--warn)}
#rWrap .st.cancel{color:var(--sub)}
#rWrap .req .why{font-size:12px;color:var(--sub);margin-top:2px}
#rWrap .btns{display:flex;gap:8px;margin-top:12px}
#rWrap .btns button{flex:1;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:700}
#rWrap .b-ok{background:var(--sky);color:#fff}
#rWrap .b-no{background:var(--bg);color:var(--ink)}
#rWrap .b-x{background:var(--bg);color:var(--sub)}
#rWrap .btns button:disabled{opacity:.5}
#rWrap .none{background:#fff;border-radius:var(--r);padding:16px;text-align:center;color:var(--sub);font-size:14px}

/* 下から出る画面 */
#rWrap .sheet-bg{position:fixed;inset:0;background:rgba(30,40,51,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#rWrap .sheet-bg.show{opacity:1;pointer-events:auto}
#rWrap .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--bg);
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));transition:transform .25s ease;z-index:6}
#rWrap .sheet.show{transform:translate(-50%,0)}
#rWrap .sheet h3{margin:0 0 4px;font-size:17px}
#rWrap .sheet .sub{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.7}
#rWrap .big:disabled{cursor:default}
#rWrap .big{display:block;width:100%;border:none;background:#fff;border-radius:14px;padding:14px 16px;text-align:left;margin-bottom:8px}
#rWrap .big b{font-size:16px;display:block}
#rWrap .big span{font-size:12.5px;color:var(--sub)}
#rWrap .pick{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:6px;font-size:15px;text-align:left}
#rWrap .pick .d{color:var(--sub);font-size:13px}
#rWrap .pick.dis{opacity:.45;cursor:default}
#rWrap .pick .why{font-size:11.5px;color:var(--sub)}
#rWrap .grp{font-size:12px;color:var(--sub);font-weight:700;margin:12px 4px 6px}
#rWrap .sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;resize:none;margin-top:4px}
#rWrap .go{width:100%;margin-top:12px;border:none;border-radius:14px;background:var(--sky);color:#fff;padding:15px;font-size:16px;font-weight:700;letter-spacing:.06em;box-shadow:0 6px 16px rgba(60,125,196,.28)}
#rWrap .go:disabled{background:#C9D3DD;box-shadow:none}
#rWrap .back{border:none;background:none;color:var(--sub);font-size:14px;padding:10px 0 0;width:100%}
#rWrap .summary{background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.9}
#rWrap .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
#rWrap .ln .lb{width:100%;font-size:12px;color:var(--sub);line-height:1.3}
#rWrap .summary .eff{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}

#rWrap .msg{margin:60px 24px;text-align:center;color:var(--sub);line-height:1.9}
#rWrap .msg .big2{font-size:17px;color:var(--ink);font-weight:700;margin-bottom:6px}
#rWrap .ver{text-align:center;font-size:10px;color:var(--faint);padding:0 0 14px;font-family:"Outfit",sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 希望・アンケート ---------- */


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
.num{font-family:"Outfit",sans-serif;font-feature-settings:"tnum"}

/* ---------- 上の部分 ---------- */
#wWrap .head{padding:22px 20px 0}
#wWrap .hello{font-size:13px;color:var(--sub);letter-spacing:.04em}
#wWrap .hello b{color:var(--ink);font-weight:700;font-size:17px}
#wWrap .seg{display:flex;background:#DDE6EF;border-radius:999px;padding:4px;margin-top:14px}
#wWrap .seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 0;font-size:14px;font-weight:500;color:var(--sub);transition:background .2s,color .2s}
#wWrap .seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(30,40,51,.12)}
#wWrap .month{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
#wWrap .month .t{display:flex;align-items:baseline;gap:8px}
#wWrap .month .m{font-family:"Outfit",sans-serif;font-size:44px;font-weight:500;line-height:1;letter-spacing:-.02em}
#wWrap .month .m small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:18px;font-weight:700;margin-left:2px}
#wWrap .month .y{font-family:"Outfit",sans-serif;font-size:15px;color:var(--sub)}
#wWrap .arrows{display:flex;gap:6px}
#wWrap .arrows button{width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:18px;color:var(--ink);box-shadow:0 1px 2px rgba(30,40,51,.08)}
#wWrap .arrows button:disabled{opacity:.3;cursor:default}
#wWrap .status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--sub);line-height:1.4}
#wWrap .chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;background:#fff;color:var(--ink)}
#wWrap .chip .num{font-size:15px}
#wWrap .chip.ok{background:var(--want-s);color:var(--want)}
#wWrap .chip.warn{background:var(--avoid-s);color:var(--avoid)}
#wWrap .chip.closed{background:#E4E9EE;color:var(--sub)}
#wWrap .quota{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
#wWrap .qt{background:#fff;border-radius:12px;padding:10px 12px}
#wWrap .qt .l{font-size:12px;color:var(--sub)}
#wWrap .qt .v{display:flex;align-items:baseline;gap:4px;margin-top:2px;font-size:12px;color:var(--sub)}
#wWrap .qt .v .num{font-size:22px;font-weight:600;color:var(--ink);line-height:1.1}
#wWrap .dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
#wWrap .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#wWrap .qt.no .dots i.u{background:var(--no)}
#wWrap .qt.su .dots i.u{background:var(--summer)}

/* ---------- 早出とCSの入り方 ---------- */
#wWrap .pair{background:#fff;border-radius:12px;padding:10px 12px 11px;margin-top:8px}
#wWrap .pl{font-size:12px;color:var(--sub)}
#wWrap .pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;background:var(--bg);border-radius:10px;padding:3px}
#wWrap .pseg button{border:none;background:none;border-radius:8px;padding:8px 0;font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap}
#wWrap .pseg button.on{background:var(--sky);color:#fff;font-weight:700}
#wWrap .pnote{font-size:12px;color:var(--sub);margin:0 6px 10px;line-height:1.7}
#wWrap .sq{font-size:15px;font-weight:700;line-height:1.6;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#wWrap .sq b{font-family:"Outfit",sans-serif;font-size:13px;color:#fff;background:var(--sky);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#wWrap .sq .em{border-radius:6px;padding:0 6px;font-size:14px}
#wWrap .sq .em.E{background:#F8E5D9;color:var(--early)}
#wWrap .sq .em.C{background:var(--sky-s);color:var(--cs)}
#wWrap .sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
#wWrap .sgrid button{border:none;background:var(--bg);border-radius:10px;padding:11px 0;font-size:16px;font-weight:700;color:var(--ink)}
#wWrap .sgrid button.s6{color:var(--sky)}
#wWrap .sgrid button.none{grid-column:1/-1;font-size:13px;font-weight:500;color:var(--sub);padding:9px 0}
#wWrap .sgrid button{position:relative}
#wWrap .sgrid button.on{background:var(--avoid);color:#fff}
#wWrap .sgrid .rk{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;font-family:"Outfit",sans-serif;font-size:11px;font-weight:600;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
#wWrap .pair textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg);resize:vertical}
#wWrap .pair textarea:focus{outline:2px solid var(--sky);outline-offset:0;background:#fff}
#wWrap .shint{font-size:11.5px;color:var(--sub);margin:8px 2px 0;line-height:1.6}
#wWrap .sgrid button.none.on{background:var(--ink);color:#fff}
#wWrap .pair .pseg{margin-top:10px}
#wWrap .pair .pseg button{padding:11px 0;font-size:14px}

    setValues(v){ const d=load(); const a=d[name]||[]; for(let i=0;i<nr;i++){ a[r-1+i]=a[r-1+i]||[]; for(let j=0;j<nc;j++) a[r-1+i][c-1+j]=v[i][j]; } d[name]=a; save(d); return this; },
    getValues(){ const a=load()[name]||[]; const o=[]; for(let i=0;i<nr;i++){ const row=a[r-1+i]||[]; o.push(Array.from({length:nc},(_,j)=>row[c-1+j]===undefined?'':row[c-1+j])); } return o; },
    clearContent(){ const d=load(); const a=d[name]||[]; a.splice(r-1,nr); d[name]=a; save(d); return this; },
    setNumberFormat(){ return this; } }; } }; }
const SpreadsheetApp={getActiveSpreadsheet(){ return { getSheetByName(n){ return load()[n]?sh(n):null; }, insertSheet(n){ const d=load(); d[n]=[]; save(d); return sh(n); } }; }};
const PropertiesService={getScriptProperties(){ return { getProperty(k){ return SS.get('toban_demo_'+k); }, setProperty(k,v){ SS.set('toban_demo_'+k,v); } }; }};
const LockService={getScriptLock(){ return {waitLock(){}, releaseLock(){}}; }};
const Utilities={formatDate(d,tz,f){ const p=n=>('0'+n).slice(-2); const ds=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); return f==='yyyy-MM-dd'?ds:ds+' '+p(d.getHours())+':'+p(d.getMinutes()); }};
const ContentService={MimeType:{JSON:1}, createTextOutput(s){ return {setMimeType(){ return {getContent(){ return s; }}; }}; }};

/**
 * 看護師当番 スマホアプリ用 GAS  Ver8.5.2（当番管理・スマホアプリ「当番」と同じ版数）
 * スプレッドシートの「拡張機能 → Apps Script」に貼り付けて使います。
 * ファイルはこのコード（コード.gs）だけです。看護師さんのスマホアプリ「当番」は GitHub Pages（toban.html）に置き、ここを呼びます。
 */
const VER = '8.5.2';
const SH = {nurses:'看護師', wishes:'希望', months:'受付', roster:'当番表', survey:'アンケート', changes:'当番の変更'};
const HEAD = {
  nurses: ['id','名前','合言葉','有効','早出','CS','入れない曜日','特別に入れる日'],
  wishes: ['月','看護師id','名前','日付','種類','送った日時'],
  months: ['月','しめきり','設定'],
  roster: ['月','確定日時','当番表'],
  changes: ['番号','月','種類','申し込んだ人id','申し込んだ人','相手id','相手','日付','枠','相手の日付','相手の枠','ひとこと','状態','申し込んだ日時','返事の日時','理由'],
  survey: ['看護師id','名前','入りたくない早出（1位から）','入りたくないCS（1位から）','早出とCS','答えた日時','そのほか（自由記入）','連日の当番']
};
/* 希望は日ごとに2文字：[早出][CS]（'a'＝避けたい、'n'＝入れない、'-'＝なし）。例 'n-'＝早出に入れない。
   前の版の 'avoid'／'no' は両方の枠とみなす */
const normW_ = v => v === 'avoid' ? 'aa' : v === 'no' ? 'nn' : String(v || '');
const okW_ = v => /^[-an]{2}$/.test(v) && v !== '--';
const nCount_ = v => { v = normW_(v); return okW_(v) ? (v[0] === 'n') + (v[1] === 'n') : 0; };

/* ---------- シートの読み書き（すべて文字として保存） ---------- */
function sheet_(k){
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SH[k]);
  if (!sh){
    sh = ss.insertSheet(SH[k]);
    sh.getRange(1,1,1,HEAD[k].length).setValues([HEAD[k]]);
  }
  return sh;
}
function read_(k){
  const sh = sheet_(k), n = sh.getLastRow();
  if (n < 2) return [];
  return sh.getRange(2,1,n-1,HEAD[k].length).getValues().map(r => r.map(v => String(v)));
}
function write_(k, rows){
  const sh = sheet_(k), n = sh.getLastRow(), w = HEAD[k].length;
  sh.getRange(1,1,1,w).setValues([HEAD[k]]);
  if (n > 1) sh.getRange(2,1,n-1,w).clearContent();
  if (rows.length){
    const rg = sh.getRange(2,1,rows.length,w);
    rg.setNumberFormat('@');
    rg.setValues(rows.map(r => r.map(v => String(v))));
  }
}
function upsert_(k, key, row){
  const rows = read_(k).filter(r => r[0] !== key);
  rows.push(row);
  rows.sort((a,b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  write_(k, rows);
}
function now_(){ return Utilities.formatDate(new Date(), 'Asia/Tokyo', 'yyyy-MM-dd HH:mm'); }
function pad_(n){ return ('0'+n).slice(-2); }
function ymAdd_(ym, n){ const d = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7))-1+n, 1); return d.getFullYear()+'-'+pad_(d.getMonth()+1); }
/* その月をふくむ「続く3か月」の3通り（前々月〜その月、前月〜翌月、その月〜翌々月）のうち、いちばん多い日数 */
function noWorst_(ym, countOf){
  let worst = 0;
  [-2,-1,0].forEach(s => { let c = 0; for (let i=0;i<3;i++) c += countOf(ymAdd_(ym, s+i)); if (c > worst) worst = c; });
  return worst;
}
/* アンケート：入りたくない曜日の早出・CS（入りたくない順に3つまで。'1'〜'6'＝月〜土、[]＝なし）、早出とCSをまとめたいか */
const SV_PAIR = {same:'まとめたい', split:'分けたい', any:'どちらでも'};
const SV_ROW = {no:'やめてほしい', few:'少しならいい', any:'気にしない'};   /* 連日（2日続けて）の当番 */
const SV_DOW = ['', '月', '火', '水', '木', '金', '土'];
const svList_ = t => (!t || t === 'なし') ? [] : String(t).split(/[・,、]/).map(x => String(SV_DOW.indexOf(x.trim()))).filter(x => /^[1-6]$/.test(x));
const svText_ = a => a.length ? a.map(w => SV_DOW[+w]).join('・') : 'なし';
function surveyRow_(r){ return {early:svList_(r[2]), cs:svList_(r[3]), pair:Object.keys(SV_PAIR).find(k => SV_PAIR[k] === r[4]) || '', at:r[5], note:r[6] || '', row:Object.keys(SV_ROW).find(k => SV_ROW[k] === r[7]) || ''}; }
function surveyOf_(id){ const r = read_('survey').find(x => x[0] === id); return r ? surveyRow_(r) : null; }
function nurseByKey_(k){
  if (!k) return null;
  const r = read_('nurses').find(x => x[2] === String(k) && x[3] === '1');
  return r ? {id:r[0], name:r[1], canE:r[4] !== '0', canC:r[5] !== '0', ng:ngList_(r[6]), ok:okList_(r[7])} : null;
}
/* 入れない曜日（'1,3' → [1,3]。0＝日〜6＝土） */
const ngList_ = t => String(t || '').split(',').filter(x => /^[0-6]$/.test(x)).map(Number);
/* 入れない曜日でも院長が「特別に入れる日」にした日（'2026-12-05,2026-12-19'） */
const okList_ = t => String(t || '').split(',').filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
const BAD_KEY = 'このQRコードは使えません。院長から新しいQRカードをもらってください。';

/* ---------- 看護師さんのスマホ画面 ---------- */
/* 前の版のQRコード（このアドレスを直接開く）で来た人への案内 */
function doGet(e){
  return HtmlService.createHtmlOutput('<div style="font-family:sans-serif;padding:40px 24px;text-align:center;line-height:1.9;color:#1E2833"><b style="font-size:18px">当番アプリは新しくなりました</b><br>院長から新しいQRカードをもらって、読み取ってください。</div>')
    .setTitle('当番')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

/* 画面を開いたときのデータ */
function getInit(k){
  const n = nurseByKey_(k);
  if (!n) return {ok:false, error:BAD_KEY};
  const months = read_('months').map(r => ({ym:r[0], deadline:r[1], cfg:JSON.parse(r[2] || '{}')}));
  const wishes = {}, sent = {};
  read_('wishes').forEach(r => {
    if (r[1] !== n.id) return;
    if (r[4] === 'sent') sent[r[0]] = r[5];
    else if (r[3]) wishes[r[3]] = r[4];
  });
  const roster = read_('roster').map(r => ({ym:r[0], at:r[1], data:JSON.parse(r[2] || '{}')}));
  return {ok:true, ver:VER, id:n.id, name:n.name, now:new Date().toISOString(), months:months, wishes:wishes, sent:sent, roster:roster, survey:surveyOf_(n.id), url:appUrl_()};
}

/* アンケートに答える（しめきりに関係なく、いつでも答え直せる） */
function saveSurvey(k, a){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    a = a || {};
    const okL = v => Array.isArray(v) && v.length <= 3 && v.every(x => /^[1-6]$/.test(String(x))) && new Set(v.map(String)).size === v.length;
    if (!okL(a.early) || !okL(a.cs) || !SV_PAIR[a.pair] || !SV_ROW[a.row]) return {ok:false, error:'答えをえらんでください。'};
    const note = String(a.note || '').replace(/\r/g,'').trim().slice(0, 500);   /* 自由記入は500字まで */
    const rows = read_('survey').filter(r => r[0] !== n.id);
    const t = now_();
    rows.push([n.id, n.name, svText_(a.early.map(String)), svText_(a.cs.map(String)), SV_PAIR[a.pair], t, note, SV_ROW[a.row]]);
    write_('survey', rows);
    return {ok:true, at:t};
  } finally {
    lock.releaseLock();
  }
}

/* 希望を送る */
function saveWishes(k, ym, map){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    const m = read_('months').find(r => r[0] === ym);
    if (!m) return {ok:false, error:'この月の受付はまだ始まっていません。'};
    if (new Date() > new Date(m[1])) return {ok:false, error:'しめきりを過ぎたので、もう直せません。'};
    const cfg = JSON.parse(m[2] || '{}');
    const dayCfg = {}; (cfg.days || []).forEach(d => { dayCfg[d.d] = d; });
    const clean = {};
    Object.keys(map || {}).forEach(ds => {
      const d = dayCfg[ds]; if (String(ds).slice(0,7) !== ym || !d || d.off) return;
      const v = normW_(map[ds]); if (!okW_(v)) return;
      const w = (d.e === false ? '-' : v[0]) + (d.c === false ? '-' : v[1]);   /* その日にない枠は消す */
      if (w !== '--') clean[ds] = w;
    });
    // 上限の確認（入れない枠：前後の月とあわせて続く3か月で。早出だけなら1つ、早出とCSなら2つ）
    const all = read_('wishes');
    const others = all.filter(r => !(r[0] === ym && r[1] === n.id));
    const yy = ym.slice(0,4);
    const noBy = {}, noOld = {};
    all.forEach(r => { if (r[1] === n.id && r[3]){ const k2 = r[3].slice(0,7); noOld[k2] = (noOld[k2]||0) + nCount_(r[4]); } });
    others.forEach(r => {
      if (r[1] !== n.id || !r[3]) return;
      const k2 = r[3].slice(0,7); noBy[k2] = (noBy[k2]||0) + nCount_(r[4]);
    });
    Object.keys(clean).forEach(ds => { noBy[ym] = (noBy[ym]||0) + nCount_(clean[ds]); });
    const lim = cfg.limits || {};
    const noNew = noWorst_(ym, x => noBy[x] || 0), noBefore = noWorst_(ym, x => noOld[x] || 0);
    if (lim.no !== undefined && noNew > lim.no && noNew > noBefore) return {ok:false, error:'入れない枠は、前後の月とあわせて続く3か月で'+lim.no+'つまでです。'};
    const t = now_();
    const add = Object.keys(clean).sort().map(ds => [ym, n.id, n.name, ds, clean[ds], t]);
    add.push([ym, n.id, n.name, '', 'sent', t]);
    write_('wishes', others.concat(add));
    return {ok:true, savedAt:t};
  } finally {
    lock.releaseLock();
  }
}

/* ---------- 院長のPCアプリ（TOBAN）からの呼び出し ---------- */
/* 看護師さんのスマホアプリ（GitHub Pages）から呼べる関数。1つ目の引数はいつも合言葉 */
const NURSE_FN = {getInit:getInit, getRoster:getRoster, saveWishes:saveWishes, saveSurvey:saveSurvey, askChange:askChange, answerChange:answerChange, cancelChange:cancelChange};
function doPost(e){
  let res;
  try {
    const b = JSON.parse(e.postData.contents);
    if (b.fn){
      const f = NURSE_FN[b.fn];
      res = f ? f.apply(null, Array.isArray(b.args) ? b.args : []) : {ok:false, error:'わからない操作です：'+b.fn};
    } else res = admin_(b);
  }
  catch (err) { res = {ok:false, error:String(err && err.message || err)}; }
  return ContentService.createTextOutput(JSON.stringify(res)).setMimeType(ContentService.MimeType.JSON);
}
function admin_(b){
  const P = PropertiesService.getScriptProperties();
  const cur = P.getProperty('ADMIN');
  if (b.action === 'setup'){
    if (!b.admin) return {ok:false, error:'合言葉がありません。'};
    if (!cur){ P.setProperty('ADMIN', b.admin); if (b.nurses) saveNurses_(b.nurses); return {ok:true, first:true, ver:VER}; }
    if (cur !== b.admin) return {ok:false, error:'このスプレッドシートは、別の当番アプリのデータとつながっています。'};
    if (b.nurses) saveNurses_(b.nurses);
    return {ok:true, ver:VER};
  }
  if (!cur || cur !== b.admin) return {ok:false, error:'接続が確かめられません。設定の「接続を確かめる」を押してください。'};
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    if (b.nurses) saveNurses_(b.nurses);
    if (b.action === 'nurses') return {ok:true};
    if (b.action === 'publish'){
      upsert_('months', b.ym, [b.ym, b.deadline, JSON.stringify(b.cfg || {})]);
      return {ok:true};
    }
    if (b.action === 'getWishes'){
      const wishes = {}, sent = {};
      read_('wishes').forEach(r => {
        if (r[0] !== b.ym) return;
        if (r[4] === 'sent') sent[r[1]] = r[5];
        else if (r[3]){ (wishes[r[1]] = wishes[r[1]] || {})[r[3]] = r[4]; }
      });
      const survey = {}; read_('survey').forEach(r => { survey[r[0]] = surveyRow_(r); });
      return {ok:true, wishes:wishes, sent:sent, survey:survey};
    }
    if (b.action === 'getChanges'){
      /* 成立した交換・代わりを返す（PCアプリが取り込んで、回数とカレンダーを直す） */
      return {ok:true, changes:read_('changes').map(chgObj_).filter(c => c.state === 'done')};
    }
    if (b.action === 'roster'){
      upsert_('roster', b.ym, [b.ym, b.at || now_(), JSON.stringify(b.data || {})]);
      return {ok:true};
    }
    return {ok:false, error:'わからない操作です：'+b.action};
  } finally {
    lock.releaseLock();
  }
}
function saveNurses_(list){
  write_('nurses', list.map(n => [n.id, n.name, n.key, n.active ? '1' : '0', n.canE === false ? '0' : '1', n.canC === false ? '0' : '1', (Array.isArray(n.ngDow) ? n.ngDow : []).join(','), (Array.isArray(n.okDays) ? n.okDays : []).join(',')]));
}

/* ================= 当番表アプリ（roster.html）：当番の交換・代わり =================
   ・交換（swap）：自分の当番と、相手の同じ種類の当番（早出どうし・CSどうし）を入れかえる。回数は変わらない
   ・代わり（give）：自分の当番をだれかに代わってもらう（相手を決めず、みんなに出す。いちばん先に「代わる」を押した人に決まる）。代わった人の回数が1つ増える
   ・代わってあげる（take）：相手の当番に自分が入る。自分の回数が1つ増える（相手が「OK」で決まる）
   ・相手が「OK」を押した時点で決まる（院長の承認はいらない）。決まると当番表がすぐ書きかわる
   ・今日より前の当番は変えられない */
const CHG_KIND = {swap:'交換', give:'代わり', take:'代わってあげる'};
const CHG_STATE = {wait:'返事待ち', done:'成立', no:'お断り', cancel:'取り消し', bad:'無効'};
const SLOT_NAME = {E:'早出', C:'CS', C2:'CS'};
const SLOT_KEY = {E:['eId','early'], C:['cId','cs'], C2:['c2Id','cs2']};
const typeOf_ = t => t === 'E' ? 'E' : 'C';
function appUrl_(){ try { return ScriptApp.getService().getUrl(); } catch(e){ return ''; } }
function today_(){ return Utilities.formatDate(new Date(), 'Asia/Tokyo', 'yyyy-MM-dd'); }
function chgObj_(r){
  const st = Object.keys(CHG_STATE).find(k => CHG_STATE[k] === r[12]) || 'bad';
  return {id:r[0], ym:r[1], kind:Object.keys(CHG_KIND).find(k => CHG_KIND[k] === r[2]) || '', from:r[3], fromName:r[4], to:r[5], toName:r[6],
          ds:r[7], slot:r[8], ds2:r[9], slot2:r[10], msg:r[11], state:st, at:r[13], ansAt:r[14], why:r[15] || ''};
}
function chgRow_(c){
  return [c.id, c.ym, CHG_KIND[c.kind], c.from, c.fromName, c.to, c.toName, c.ds, c.slot, c.ds2 || '', c.slot2 || '', c.msg || '', CHG_STATE[c.state], c.at, c.ansAt || '', c.why || ''];
}
function nurseMap_(){ const m = {}; read_('nurses').forEach(r => { m[r[0]] = {id:r[0], name:r[1], active:r[3] === '1', canE:r[4] !== '0', canC:r[5] !== '0', ng:ngList_(r[6]), ok:okList_(r[7])}; }); return m; }
function rosterMap_(){ const m = {}; read_('roster').forEach(r => { m[r[0]] = {at:r[1], data:JSON.parse(r[2] || '{}')}; }); return m; }
function holder_(R, ds, t){ const m = R[String(ds).slice(0,7)]; const d = m && m.data.days && m.data.days[ds]; return d ? (d[SLOT_KEY[t][0]] || '') : null; }

/* その変更がいま成り立つかを確かめる（成り立たなければ理由を返す） */
function chgProblem_(c, R, N){
  const td = today_();
  if (c.ds < td || (c.kind === 'swap' && c.ds2 < td)) return '過ぎた日の当番なので変えられません。';
  const to = N[c.to], from = N[c.from];
  if (!from) return '申し込んだ人が見つかりません。';
  if (c.kind === 'give' && !c.to) return holder_(R, c.ds, c.slot) === c.from ? '' : SLOT_NAME[c.slot]+'（'+c.ds.slice(5).replace('-','/')+'）の当番が、もう'+c.fromName+'さんではありません。';   /* みんなに出した「代わってもらう」 */
  if (!to || !to.active) return '相手が見つかりません。';
  const can = (n, t) => typeOf_(t) === 'E' ? n.canE : n.canC;
  const other = t => t === 'C' ? 'C2' : t === 'C2' ? 'C' : null;   /* 同じ日のCS2人が同じ人にならないように */
  const dl = ds => ds.slice(5).replace('-','/');
  const DOWJ = ['日','月','火','水','木','金','土'];
  const dowOf = ds => { const a = String(ds).split('-').map(Number); return new Date(a[0], a[1]-1, a[2]).getDay(); };
  const ngOn = (n, ds) => n.ng && n.ng.indexOf(dowOf(ds)) >= 0 && !(n.ok && n.ok.indexOf(ds) >= 0) ? n.name+'さんは'+DOWJ[dowOf(ds)]+'曜日に入れない設定です。' : '';
  if (c.kind === 'take'){
    if (holder_(R, c.ds, c.slot) !== c.to) return SLOT_NAME[c.slot]+'（'+dl(c.ds)+'）の当番が、もう'+to.name+'さんではありません。';
    if (!can(from, c.slot)) return from.name+'さんは'+SLOT_NAME[c.slot]+'に入らない設定です。';
    if (ngOn(from, c.ds)) return ngOn(from, c.ds);
    const o = other(c.slot);
    if (o && holder_(R, c.ds, o) === c.from) return dl(c.ds)+'のCSに、'+from.name+'さんがもう入っています。';
    return '';
  }
  if (holder_(R, c.ds, c.slot) !== c.from) return SLOT_NAME[c.slot]+'（'+dl(c.ds)+'）の当番が、もう'+c.fromName+'さんではありません。';
  if (!can(to, c.slot)) return to.name+'さんは'+SLOT_NAME[c.slot]+'に入らない設定です。';
  if (ngOn(to, c.ds)) return ngOn(to, c.ds);
  if (c.kind === 'swap' && ngOn(from, c.ds2)) return ngOn(from, c.ds2);
  if (c.kind === 'swap'){
    if (holder_(R, c.ds2, c.slot2) !== c.to) return SLOT_NAME[c.slot2]+'（'+c.ds2.slice(5).replace('-','/')+'）の当番が、もう'+to.name+'さんではありません。';
    if (typeOf_(c.slot) !== typeOf_(c.slot2)) return '交換は、早出どうし・CSどうしでできます。';
    if (c.ds === c.ds2) return '同じ日の当番どうしは交換できません。';
    const o1 = other(c.slot), o2 = other(c.slot2);
    if (o1 && holder_(R, c.ds, o1) === c.to) return c.ds.slice(5).replace('-','/')+'のCSに、'+to.name+'さんがもう入っています。';
    if (o2 && holder_(R, c.ds2, o2) === c.from) return c.ds2.slice(5).replace('-','/')+'のCSに、'+c.fromName+'さんがもう入っています。';
  } else {
    const o1 = other(c.slot);
    if (o1 && holder_(R, c.ds, o1) === c.to) return c.ds.slice(5).replace('-','/')+'のCSに、'+to.name+'さんがもう入っています。';
  }

/* 申し込む */
function askChange(k, a){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    a = a || {};
    if (!CHG_KIND[a.kind] || !SLOT_KEY[a.slot] || (a.kind === 'swap' && !SLOT_KEY[a.slot2])) return {ok:false, error:'申し込みの中身がわかりません。'};
    if (a.to === n.id) return {ok:false, error:'自分には申し込めません。'};
    const N = nurseMap_(), R = rosterMap_();
    const open = a.kind === 'give' && !a.to;   /* 代わってもらう：相手を決めず、みんなに出す */
    const to = open ? {id:'', name:''} : N[a.to];
    if (!to) return {ok:false, error:'相手が見つかりません。'};
    const c = {id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36), ym:String(a.ds).slice(0,7), kind:a.kind, from:n.id, fromName:n.name, to:to.id, toName:to.name,
               ds:String(a.ds), slot:a.slot, ds2:a.kind === 'swap' ? String(a.ds2) : '', slot2:a.kind === 'swap' ? a.slot2 : '', msg:String(a.msg || '').replace(/\r/g,'').trim().slice(0, 100),
               state:'wait', at:now_()};
    const why = chgProblem_(c, R, N);
    if (why) return {ok:false, error:why};
    const rows = read_('changes');
    const same = rows.map(chgObj_).find(x => x.state === 'wait' && x.from === n.id && ((x.ds === c.ds && x.slot === c.slot) || (x.kind === 'swap' && c.kind === 'swap' && x.ds2 === c.ds2 && x.slot2 === c.slot2)));
    if (same) return {ok:false, error:'この当番は、もう申し込んでいます。先に取り消してください。'};
    rows.push(chgRow_(c));
    write_('changes', rows);
    return {ok:true, change:c};
  } finally {
    lock.releaseLock();
  }
}

/* 相手が返事をする（yes＝OK、no＝お断り） */
function answerChange(k, id, yes){
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const n = nurseByKey_(k);
    if (!n) return {ok:false, error:BAD_KEY};
    const rows = read_('changes'), list = rows.map(chgObj_);
    const c = list.find(x => x.id === id);
    if (!c || (c.to !== n.id && !(c.kind === 'give' && !c.to && c.from !== n.id))) return {ok:false, error:'この申し込みは見つかりません。'};
    if (c.state !== 'wait') return {ok:false, error:'この申し込みは、もう'+CHG_STATE[c.state]+'になっています。'};
    if (!c.to){ if (!yes) return {ok:true, change:c}; c.to = n.id; c.toName = n.name; }   /* みんなに出したもの：代わると押した人に決まる */
    c.ansAt = now_();
    if (!yes){ c.state = 'no'; write_('changes', list.map(chgRow_)); return {ok:true, change:c}; }
    const N = nurseMap_(), R = rosterMap_();
    const why = chgProblem_(c, R, N);
    if (why){ c.state = 'bad'; c.why = why; write_('changes', list.map(chgRow_)); return {ok:false, error:why+'（この申し込みは無効になりました）'}; }
    const from = N[c.from] || {id:c.from, name:c.fromName}, to = N[c.to];
    setHolder_(R, c.ds, c.slot, c.kind === 'take' ? from : to);
    if (c.kind === 'swap') setHolder_(R, c.ds2, c.slot2, from);
    [c.ym, String(c.ds2 || '').slice(0,7)].filter((ym,i,a) => ym && a.indexOf(ym) === i).forEach(ym => upsert_('roster', ym, [ym, R[ym].at, JSON.stringify(R[ym].data)]));
    c.state = 'done';
    /* 同じ当番にかかわる、ほかの返事待ちは無効にする */
    const touched = [[c.ds, c.slot]].concat(c.kind === 'swap' ? [[c.ds2, c.slot2]] : []);
    list.forEach(x => {
      if (x === c || x.state !== 'wait') return;
      const mine = [[x.ds, x.slot]].concat(x.kind === 'swap' ? [[x.ds2, x.slot2]] : []);
      if (mine.some(p => touched.some(q => p[0] === q[0] && p[1] === q[1]))){ x.state = 'bad'; x.why = 'ほかの変更で当番が変わりました。'; x.ansAt = c.ansAt; }
    });
    write_('changes', list.map(chgRow_));
    return {ok:true, change:c};
  } finally {
    lock.releaseLock();
  }
}

/* ---------- 当番を押したとき ----------
   1回押す：その当番をえらぶ（交換できる当番だけが明るくなる）→ もう1つ押すと「交換」を確かめてから申し込む
   2回つづけて押す：自分の当番なら「代わってもらう」（みんなに出す）、相手の当番なら「代わってあげる」 */
let sel = null, lastTap = {k:'', t:0}, swapTimer = null;
/* えらんだ当番 a と、当番 b を交換できるか（できるなら申し込みの中身を返す） */
function pairOf(a, ds, t){
  if (!a || (a.ds === ds && a.t === t)) return null;
  if (ds < D.today || pendingOn(ds, t)) return null;
  const ia = holder(a.ds, a.t), ib = holder(ds, t);
  if (!ib || (ia === D.me.id) === (ib === D.me.id)) return null;   /* 自分の当番と相手の当番の組み合わせだけ */
  if (TY(a.t) !== TY(t) || a.ds === ds) return null;
  const m = ia === D.me.id ? {ds:a.ds, slot:a.t, ds2:ds, slot2:t} : {ds, slot:t, ds2:a.ds, slot2:a.t};
  const other = holder(m.ds2, m.slot2);
  if (otherCS(m.slot) && holder(m.ds, otherCS(m.slot)) === other) return null;
  if (otherCS(m.slot2) && holder(m.ds2, otherCS(m.slot2)) === D.me.id) return null;
  if (!dowOK(nurse(other), m.ds) || !dowOK(D.me, m.ds2)) return null;   /* 入れない曜日には交換できない */
  return Object.assign({kind:'swap', to:other, toName:holderName(m.ds2, m.slot2)}, m);
}
function tapSlot(ds, t){
  const k = ds+'|'+t, now = Date.now();
  if (lastTap.k === k && now - lastTap.t < 400){ clearTimeout(swapTimer); swapTimer = null; lastTap = {k:'', t:0}; sel = null; render(); dblSlot(ds, t); return; }
  lastTap = {k, t:now};
  const p = pairOf(sel, ds, t);
  if (p){   /* 2回押し（代わる）かもしれないので、少し待ってから交換の確認を出す */
    clearTimeout(swapTimer); swapTimer = setTimeout(() => { swapTimer = null; askConfirm(p, holderName(p.ds2,p.slot2)+' さんと交換しますか？'); }, 400); return;
  }
  if (sel && sel.ds === ds && sel.t === t){ sel = null; render(); return; }
  if (pendingOn(ds, t)){ toast('申し込み中です。取り消すときは「申し込み」から。'); return; }
  sel = {ds, t}; render();
}
function dblSlot(ds, t){
  if (pendingOn(ds, t)){ toast('申し込み中です。取り消すときは「申し込み」から。'); return; }
  const id = holder(ds, t);
  if (id === D.me.id){ askConfirm({kind:'give', ds, slot:t, to:''}, 'この当番を、だれかに代わってもらいますか？', 'みんなに出して、いちばん先に「代わる」を押した人に決まります。'); return; }
  if (!can(D.me, t)){ toast(SNAME[t]+'に入らない設定なので、代われません。'); return; }
  if (!dowOK(D.me, ds)){ toast(DOW[pd(ds).getDay()]+'曜日は入れない設定なので、代われません。'); return; }
  if (otherCS(t) && holder(ds, otherCS(t)) === D.me.id){ toast('この日のCSに、もう入っています。'); return; }
  askConfirm({kind:'take', ds, slot:t, to:id}, holderName(ds,t)+' さんの当番を、代わってあげますか？');
}

(function(){

const okW = v => /^[-an]{2}$/.test(v) && v !== '--';
const cntW = (v, ch) => { v = normW(v); return okW(v) ? (v[0] === ch) + (v[1] === ch) : 0; };

  const x = (m.cfg.days||[]).find(d=>d.d===ds); if (!x || x.off) return;
  const kind = pen[0]==='a' ? 'a' : 'n', t = pen[1], i = t==='E' ? 0 : 1;
  if ((t==='E' && x.e === false) || (t==='C' && x.c === false)){ toast('この日は'+(t==='E'?'早出':'CS')+'がありません'); return; }
  const arr = (edit[ds] || '--').split('');
  if (arr[i] === kind) arr[i] = '-';
  else {
    const lim = m.cfg.limits || {};
    if (kind === 'n'){ const w = noWorst(m.ym); if (w.n >= lim.no){ toast('入れない枠は、続く3か月で'+lim.no+'つまでです（'+w.label+'で'+w.n+'つ）'); return; } }
    arr[i] = kind;
  }
  const code = arr.join(''); if (code === '--') delete edit[ds]; else edit[ds] = code;
  dirty = true; render();
}
function send(){
  const m = D.months[mi]; if (!m || busy) return;
  busy = true; render();
  google.script.run.withSuccessHandler(r => {
    busy = false;
    if (!r.ok){ toast(r.error); render(); return; }
    Object.keys(D.wishes).forEach(ds => { if (ds.slice(0,7) === m.ym) delete D.wishes[ds]; });
    Object.assign(D.wishes, edit); D.sent[m.ym] = r.savedAt; dirty = false; render(); toast('送りました');
  }).withFailureHandler(() => { busy = false; render(); toast('送れませんでした。電波のよいところでもう一度押してください'); }).saveWishes(KEY, m.ym, edit);
}

/* ---------- 決まった当番 ---------- */
/* ---------- アンケート ---------- */
function surveyView(){
  if (!svDraft) svDraft = D.survey ? {early:(D.survey.early||[]).slice(), cs:(D.survey.cs||[]).slice(), pair:D.survey.pair, row:D.survey.row||'', note:D.survey.note||''} : {note:''};
  const a = svDraft;
  /* 入りたくない順に押す（3つまで）。押した順に 1・2・3 の番号が付く。もう一度押すと外れる */
  const dowBtns = (q) => { const L = a[q]; return '<div class="sgrid">' + [1,2,3,4,5,6].map(w => { const r = L ? L.indexOf(String(w)) : -1;
      return '<button data-q="'+q+'" data-v="'+w+'" class="'+(r>=0?'on':'')+(w===6?' s6':'')+'">'+DOW[w]+(r>=0?'<span class="rk">'+(r+1)+'</span>':'')+'</button>'; }).join('')
    + '<button data-q="'+q+'" data-v="" class="none'+(L && !L.length ? ' on' : '')+'">なし</button></div>'
    + '<p class="shint">入りたくない順に、3つまで押してください（押した順に 1・2・3）。もう一度押すと外れます。</p>'; };
  const {done, same} = svState();
  let h = '</div><div class="body"><p class="pnote">当番の決め方を考える参考にします。いつでも答え直せます。</p>';
  h += '<div class="pair"><div class="sq"><b>1</b>入りたくない<span class="em E">早出</span>は何曜日ですか？</div>' + dowBtns('early') + '</div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>2</b>入りたくない<span class="em C">CS</span>は何曜日ですか？</div>' + dowBtns('cs') + '</div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>3</b>早出とCSは、同じ日にまとめたいですか？</div><div class="pseg">'
    + ['same','split','any'].map(k => '<button data-q="pair" data-v="'+k+'" class="'+(a.pair===k?'on':'')+'">'+SV_PAIR[k]+'</button>').join('') + '</div></div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>4</b>当番が2日続くのは、どうですか？</div><div class="pseg">'
    + ['no','few','any'].map(k => '<button data-q="row" data-v="'+k+'" class="'+(a.row===k?'on':'')+'">'+SV_ROW[k]+'</button>').join('') + '</div></div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>5</b>そのほか、ご意見があれば書いてください</div>'
    + '<p class="shint" style="margin-top:4px">当番について気になることなど、自由に書いてください（なくてもかまいません）。</p><textarea id="svNote" maxlength="500" rows="4" placeholder="自由に書いてください">'+esc(a.note||'')+'</textarea></div>';
  h += '<button class="send" id="svSend" style="margin-top:16px"'+(done && !same && !svBusy ? '' : ' disabled')+'>'+(svBusy ? '送っています…' : (same ? '答えました' : '答える'))+'</button>';
  if (D.survey && D.survey.at) h += '<p class="pnote" style="text-align:center;margin-top:8px">前に答えた日時：'+esc(D.survey.at)+'</p>';
  return h + '</div>';
}
/* 1〜3がそろっているか、前に送った答えと同じか */
function svState(){
  const a = svDraft || {};
  const done = Array.isArray(a.early) && Array.isArray(a.cs) && !!a.pair && !!a.row;
  const eq = (x,y) => JSON.stringify(x||null) === JSON.stringify(y||null);
  const same = !!D.survey && eq(D.survey.early,a.early) && eq(D.survey.cs,a.cs) && D.survey.pair===a.pair && (D.survey.row||'')===(a.row||'') && (D.survey.note||'') === (a.note||'').trim();
  return {done, same};
}
function refreshSvBtn(){
  const b = document.getElementById('svSend'); if (!b) return;
  const {done, same} = svState();
  b.disabled = !(done && !same && !svBusy); b.textContent = svBusy ? '送っています…' : (same ? '答えました' : '答える');
}
document.addEventListener('input', e => { if (e.target.id === 'svNote' && svDraft){ svDraft.note = e.target.value; refreshSvBtn(); } });
function sendSurvey(){
  if (svBusy) return;
  svBusy = true; render();
  google.script.run.withSuccessHandler(r => {
    svBusy = false;
    if (!r.ok){ render(); toast(r.error); return; }
    D.survey = {early:svDraft.early.slice(), cs:svDraft.cs.slice(), pair:svDraft.pair, row:svDraft.row, note:(svDraft.note||'').trim(), at:r.at}; svDraft = null; render(); toast('答えを送りました。ありがとうございました');
  }).withFailureHandler(() => { svBusy = false; render(); toast('送れませんでした。電波のよいところでもう一度押してください'); }).saveSurvey(KEY, {early:svDraft.early, cs:svDraft.cs, pair:svDraft.pair, row:svDraft.row, note:svDraft.note||''});
}

function rosterView(){
  const r = D.roster[ri];
  if (!r) return '</div><div class="empty">確定した当番表はまだありません。</div>';
  const days = r.data.days || {}, ds = Object.keys(days).sort();
  const mine = ds.filter(d => days[d].eId === D.id || days[d].cId === D.id || days[d].c2Id === D.id);
  let h = monthBar(r.ym, ri, D.roster.length, 'rv') + '</div><div class="body">';
  h += '<div class="h2">わたしの当番　<span class="num" style="font-size:15px;color:var(--ink)">'+mine.length+'</span> 日</div>';
  if (!mine.length) h += '<div class="none">この月の当番はありません</div>';
  else h += '<div class="mine">' + mine.map(d => { const x = days[d], w = pd(d).getDay();
      return '<div class="duty"><div class="dn">'+pd(d).getDate()+'</div><div class="dw s'+w+'">'+DOW[w]+'曜日</div><div class="tags">'
        + (x.eId===D.id?'<span class="tag E">早出</span>':'') + ((x.cId===D.id||x.c2Id===D.id)?'<span class="tag C">CS</span>':'') + '</div></div>'; }).join('') + '</div>';
  h += '<div class="h2" style="margin-top:24px">全員の当番表</div><div class="all"><div class="r hd"><span></span><span class="e">早出</span><span class="c">CS</span></div>';
  const nm = (n,id) => n ? (id===D.id ? '<span class="me">'+esc(n)+'</span>' : esc(n)) : '<span class="em">—</span>';
  ds.forEach(d => { const x = days[d], w = pd(d).getDay();
    h += '<div class="r"><span class="dt s'+w+'"><span class="num">'+pd(d).getDate()+'</span>'+DOW[w]+'</span><span>'+nm(x.early,x.eId)+'</span><span>'+(x.cs===undefined?'':nm(x.cs,x.cId)+(x.cs2===undefined?'':'<br>'+nm(x.cs2,x.c2Id)))+'</span></div>'; });
  return h + '</div><div class="conf">確定：'+esc(r.at)+'</div>'+'</div>';
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-d]'); if (!t || t.disabled || !document.getElementById('wWrap').contains(t)) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); }
  else if (t.dataset.mv){ if (dirty && !confirm('送っていない変更があります。送らずに月を変えますか？')) return; mi += +t.dataset.mv; loadEdit(); render(); }
  else if (t.dataset.rv){ ri += +t.dataset.rv; render(); }
  else if (t.dataset.pen){ pen = t.dataset.pen; render(); }
  else if (t.dataset.q){
    const q = t.dataset.q, v = t.dataset.v;
    if (q === 'pair' || q === 'row') svDraft[q] = v;
    else if (v === '') svDraft[q] = [];
    else {
      const L = Array.isArray(svDraft[q]) ? svDraft[q].slice() : [], i = L.indexOf(v);
      if (i >= 0) L.splice(i,1);
      else if (L.length >= 3){ toast('3つまでです。外したい曜日をもう一度押してください'); return; }
      else L.push(v);
      svDraft[q] = L.length ? L : undefined;
      if (!L.length) delete svDraft[q];
    }
    render();
  }
  else if (t.id === 'svSend') sendSurvey();
  else if (t.id === 'send') send();
  else if (t.dataset.d) tapDay(t.dataset.d);
});
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
start();

window.W = {show(t){ tab = t; if (D) render(); }, ready:() => !!D, restart(){ D = null; svDraft = null; edit = {}; dirty = false; busy = false; svBusy = false; start(); }};

})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('toban-sw.js', {scope:'./toban'}).catch(() => {});
</script>
