/* ================= Ver12.0.0：休み（有給の申請と許可） =================
   ・看護師・事務がスマホで有給（全日・午前・午後）を申請する。締め切りは、休む日の2つ前の診療日の「診療が終わる時刻」まで
     （休診日は数えない。土曜などの半日の日も1日と数える。時刻は当番管理の設定 leaveCfg：end＝ふつうの日、halfEnd＝半日の日）
   ・許可できるのは、同じ職種のリーダー（名簿の「リーダー」）と院長。1人が許可したら受理。自分の申請は自分で許可できない
   ・院長（院長のQR・当番管理）は、締め切りに関係なく、有給・欠勤・病欠を入れられる（入れたらすぐ受理）。消すこともできる
   ・理由（有給・欠勤・病欠）を見られるのは院長だけ。本人・リーダー・ほかのスタッフ・カレンダーには、全日・午前・午後だけを出す
   ・テスト用の人の休みは、院長とテスト用のリーダーにだけ出す（カレンダー・ほかのスタッフには出さない） */
const LV_PART = {all:'全日', am:'午前', pm:'午後'};
const LV_TYPE = {paid:'有給', absent:'欠勤', sick:'病欠'};
function saveLeaveCfg_(c){
  if (!c || typeof c !== 'object') return;
  const tm = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v || '')) ? String(v) : '';
  const o = {end:tm(c.end) || '18:00', halfEnd:tm(c.halfEnd) || '12:30', half:(Array.isArray(c.half) ? c.half : []).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)).slice(-200)};
  const P = PropertiesService.getScriptProperties(), t = JSON.stringify(o);
  if (P.getProperty('LEAVE_CFG') !== t) P.setProperty('LEAVE_CFG', t);
}
function leaveCfg_(){ try { const o = JSON.parse(PropertiesService.getScriptProperties().getProperty('LEAVE_CFG') || '{}'); return {end:o.end || '18:00', halfEnd:o.halfEnd || '12:30', half:Array.isArray(o.half) ? o.half : []}; } catch(e){ return {end:'18:00', halfEnd:'12:30', half:[]}; } }
function dsAdd_(ds, n){ const a = ds.split('-').map(Number), d = new Date(a[0], a[1]-1, a[2]+n); return d.getFullYear()+'-'+pad_(d.getMonth()+1)+'-'+pad_(d.getDate()); }
const halfDs_ = (ds, cfg) => { const a = ds.split('-').map(Number), w = new Date(a[0], a[1]-1, a[2]).getDay(); return w === 3 || w === 6 || cfg.half.indexOf(ds) >= 0; };
/* 締め切り（日本時間の Date）。休む日の2つ前の診療日の、診療が終わる時刻 */
function leaveDeadline_(ds, F, cfg){
  let d = ds, n = 0;
  for (let i = 0; i < 40 && n < 2; i++){ d = dsAdd_(d, -1); if (!clerkOff_(d, F)) n++; }
  return new Date(d+'T'+(halfDs_(d, cfg) ? cfg.halfEnd : cfg.end)+':00+09:00');
}
function leaveObj_(r){ return {id:r[0], grp:r[1], pid:r[2], name:r[3], ds:r[4], part:r[5], type:r[6], state:r[7], at:r[8], by:r[9], decAt:r[10], src:r[11], cx:r[12] || ''}; }
const leaveRow_ = o => [o.id, o.grp, o.pid, o.name, o.ds, o.part, o.type, o.state, o.at, o.by || '', o.decAt || '', o.src || '', o.cx || ''];
/* Ver12.1.0：許可を待っているもの（新しい申請、または受理ずみの休みの「取り消しの申請」） */
const lvPending_ = o => o.state === 'wait' || (o.state === 'ok' && !!o.cx);
/* Ver12.2.0：休み（申請中・受理）の日に、その時間の当番を入れられないようにする（院長が決めた）。
   grp 'n'：E（早出）＝全日・午前、C・C2（CS）＝全日・午前・午後。grp 'j'：E（早出）＝全日・午前、L（会計）＝全日・午後（半日の日は午前も）。
   重なる休みがあれば、その休み（{part, state}）を返す。C：くり返し呼ぶときの入れ物 */
function leaveOn_(grp, pid, ds, slot, C){
  if (!pid) return null;
  C = C || {};
  const L = C.L || (C.L = read_('leave').map(leaveObj_).filter(o => o.state === 'wait' || o.state === 'ok'));
  const o = L.find(x => x.grp === grp && x.pid === pid && x.ds === ds); if (!o) return null;
  if (o.part === 'all') return o;
  if (grp === 'n') return (slot === 'E' ? o.part === 'am' : true) ? o : null;
  if (slot === 'E') return o.part === 'am' ? o : null;
  if (o.part === 'pm') return o;
  const cfg = C.cfg || (C.cfg = leaveCfg_());
  return halfDs_(ds, cfg) ? o : null;
}
const lvMsg_ = (name, ds, o) => md_(ds)+'は'+name+'さんの休み（'+LV_PART[o.part]+'・'+(o.state === 'wait' ? '申請中' : '受理')+'）があるので、当番に入れられません。';
/* 人の一覧（id → {grp, name, test, active}） */
function leaveMen_(){
  const m = {};
  read_('nurses').forEach(r => { m['n:'+r[0]] = {grp:'n', id:r[0], name:r[1], test:r[3] === 'T', active:ON_(r[3])}; });
  read_('clerks').forEach(r => { m['j:'+r[0]] = {grp:'j', id:r[0], name:r[1], test:r[3] === 'T', active:ON_(r[3])}; });
  return m;
}
function leavePeople_(){ const M = leaveMen_(); return Object.keys(M).map(k => M[k]).filter(x => x.active).map(x => ({grp:x.grp, id:x.id, name:x.name, test:x.test})); }
/* 院長に出す一覧（理由つき）。withType=false のときは理由を消す */
function leaveList_(withType, from, all){
  const M = leaveMen_(), td = today_(), f = from || dsAdd_(td, -62);
  return read_('leave').map((r, i) => Object.assign(leaveObj_(r), {_r:i})).filter(o => o.state !== 'del' && o.ds >= f && (all || o.state !== 'cancel')).map(o => {
    const p = M[o.grp+':'+o.pid]; const x = {id:o.id, grp:o.grp, pid:o.pid, name:p ? p.name : o.name, ds:o.ds, part:o.part, state:o.state, at:o.at, decAt:o.decAt, row:o._r, by:o.by, src:o.src, test:!!(p && p.test), cx:o.cx ? true : false};
    if (withType) x.type = o.type;
    return x;
  }).sort((a, b) => a.ds < b.ds ? -1 : a.ds > b.ds ? 1 : (a.at < b.at ? -1 : 1));
}
/* 当番と重なる休み（交代が必要）。part：all＝全部、am＝早出・CS（事務は早出。半日の日は会計も）、pm＝CS（事務は会計） */
/* その人のその日の当番のうち、休みと重なるもの（['早出','CS'] など）。看護師は、使い始める前の月はカレンダーで入れた名前 */
function leaveDutyHit_(grp, pid, ds, part, C){
  C = C || {}; const hit = [];
  if (grp === 'n'){
    const L = C.R || (C.R = rosterList_(rosterMap_())), m = L.find(x => x.ym === ds.slice(0,7)), d = m && m.data && m.data.days && m.data.days[ds]; if (!d) return hit;
    if (d.eId === pid && part !== 'pm') hit.push('早出');
    if (d.cId === pid || d.c2Id === pid) hit.push('CS');
  } else {
    const ym = ds.slice(0,7), JM = C.J || (C.J = {}), m = JM[ym] || (JM[ym] = jMonth_(ym)), d = m.days[ds], cfg = C.cfg || (C.cfg = leaveCfg_()); if (!d) return hit;
    if (d.eId === pid && part !== 'pm') hit.push('早出');
    if (d.lId === pid && (part !== 'am' || halfDs_(ds, cfg))) hit.push('会計');
  }
  return hit;
}
function leaveSwaps_(list){
  const td = today_(), out = [], C = {};
  list.filter(o => o.state === 'ok' && o.ds >= td).forEach(o => {
    const hit = leaveDutyHit_(o.grp, o.pid, o.ds, o.part, C);
    if (hit.length) out.push({id:o.id, grp:o.grp, name:o.name, ds:o.ds, part:o.part, slots:hit.join('・')});
  });
  return out;
}
/* スマホに返す休みの情報。me：{grp,id,name,test,leader} か {boss:true} か {adm:true} */
function leaveFor_(me){
  const td = today_(), F = framesMap_(), cfg = leaveCfg_(), all = leaveList_(!!me.boss, '', false);
  const okAll = all.filter(o => o.state === 'ok');
  const show = o => !o.test || me.boss || me.test;   /* テスト用の人の休みは、院長とテスト用の人にだけ */
  const res = {cfg:{end:cfg.end, halfEnd:cfg.halfEnd}, half:cfg.half.filter(x => x >= td), off:[], ok:okAll.filter(show).map(o => ({grp:o.grp, pid:o.pid, name:o.name, ds:o.ds, part:o.part})),
    pend:all.filter(o => o.state === 'wait' && o.ds >= td).filter(show).map(o => ({grp:o.grp, pid:o.pid, name:o.name, ds:o.ds, part:o.part}))};   /* Ver12.3.0：申請中の休みも当番表に出す（だれが・いつ・全日／午前／午後だけ） */
  for (let i = 0; i < 6; i++) res.off = res.off.concat(clerkOffList_(ymAdd_(td.slice(0,7), i), F));
  if (me.adm) return res;
  if (me.boss){
    res.boss = true; res.list = all; res.wait = all.filter(o => lvPending_(o) && o.ds >= td);
    res.swap = leaveSwaps_(all); res.people = leavePeople_(); res.hist = leaveHist_(all, true);
    return res;
  }
  res.mine = all.filter(o => o.grp === me.grp && o.pid === me.id).map(o => ({id:o.id, ds:o.ds, part:o.part, state:o.state, by:o.by, src:o.src, cx:o.cx, decAt:o.decAt || ''}));   /* Ver12.12.0：decAt（通知の並び順） */
  if (me.leader){
    const mine = all.filter(o => o.grp === me.grp && (o.test === me.test));
    res.leader = true;
    res.wait = mine.filter(o => lvPending_(o) && o.ds >= td).map(o => ({id:o.id, name:o.name, ds:o.ds, part:o.part, at:o.at, cx:o.cx}));   /* Ver12.1.0：自分の申請も自分で許可してよい（院長が決めた） */
    res.swap = leaveSwaps_(mine); res.hist = leaveHist_(mine, false);
  }
  return res;
}
/* Ver12.2.0：休みの履歴（受理されたもの。決めた・入れた日時の新しい順に5つ）。how：リーダー許可・院長許可・院長入力 */
function leaveHist_(list, boss){
  return list.map((o, i) => ({o:o, i:i, t:String(o.decAt || o.at || '')})).filter(x => x.o.state === 'ok').sort((a, b) => a.t < b.t ? 1 : a.t > b.t ? -1 : (b.o.row || 0) - (a.o.row || 0)).slice(0, 5).map(x => {
    const o = x.o, how = o.src !== 'self' ? '院長入力' : o.by === '院長' ? '院長許可' : 'リーダー許可';
    const h = {id:o.id, grp:o.grp, name:o.name, ds:o.ds, part:o.part, how:how, by:o.src === 'self' && o.by !== '院長' ? o.by : '', cx:o.cx};
    if (boss) h.type = o.type;
    return h;
  });
}
function leaveId_(){ return 'v'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36); }
function leaveSave_(list){ write_('leave', list.map(leaveRow_)); jBump_(); }
const dsOk_ = ds => /^\d{4}-\d{2}-\d{2}$/.test(String(ds || ''));
const md_ = ds => (+ds.slice(5,7))+'/'+(+ds.slice(8,10));
/* 申請（本人） */
function leaveAsk(k, ds, part){
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const n = nurseByKey_(k), c = n ? null : clerkByKey_(k), p = n || c;
    if (!p) return {ok:false, error:BAD_KEY};
    ds = String(ds || ''); part = String(part || '');
    if (!dsOk_(ds) || !LV_PART[part]) return {ok:false, error:'日にちと時間（全日・午前・午後）を選んでください。'};
    const td = today_(), F = framesMap_(), cfg = leaveCfg_();
    if (ds <= td) return {ok:false, error:'前の診療日と当日の休みは、スマホからは申請できません。院長に伝えてください。'};
    if (ds > dsAdd_(td, 200)) return {ok:false, error:'半年より先の休みは、まだ申請できません。'};
    if (clerkOff_(ds, F)) return {ok:false, error:md_(ds)+'は休診日です。'};
    if (new Date() > leaveDeadline_(ds, F, cfg)) return {ok:false, error:md_(ds)+'の申請の締め切りは過ぎました（2つ前の診療日の診療が終わるまで）。院長に伝えてください。'};
    const grp = n ? 'n' : 'j', list = read_('leave').map(leaveObj_);
    if (list.some(o => o.grp === grp && o.pid === p.id && o.ds === ds && (o.state === 'wait' || o.state === 'ok'))) return {ok:false, error:md_(ds)+'は、もう申請しています。'};

const wkStart = ds => addD(ds, -pd(ds).getDay());   /* その日をふくむ週の日曜日 */
function wkRange(){ if (!D.roster.length) return null; const a = D.roster[0].ym, b = D.roster[D.roster.length-1].ym; return [wkStart(a+'-01'), wkStart(dsOf(new Date(+b.slice(0,4), +b.slice(5,7), 0)))]; }

/* Ver11.23.0：当番アプリを使い始める前の月は、内視鏡カレンダーで入れた看護師の当番を、見るだけで出す（GASが data.cal を付けて返す） */
const calYm = ym => !!D && !D.clerk && !!(((D.roster.find(x => x.ym === ym) || {}).data || {}).cal);
const blankYm = ym => !!D && !!(D.roster.find(x => x.ym === ym) || {}).blank;

const fillR = (R, clerk) => { R = R || []; const have = R.map(x => x.ym); return R.concat(blankR(clerk, have)).sort((a,b) => a.ym < b.ym ? -1 : a.ym > b.ym ? 1 : 0); };

  const t = (DM && DM.today) || dsOf(new Date()), y = +t.slice(0,4), m = +t.slice(5,7), ck = clerk ? 'lId' : 'cId', cn = clerk ? 'late' : 'cs';
  return Array.from({length:AHEAD}, (_, k) => k).map(k => { const d0 = new Date(y, m-1+k, 1), ym = d0.getFullYear()+'-'+pad(d0.getMonth()+1), last = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate(), dd = {};
    const OFF = ((DM && DM.leave && DM.leave.off) || []);   /* Ver12.54.0：休診日（日曜・祝日・カレンダーの休診。GASの休みの一覧と同じ）は、わくを出さない */

}

/* あなたから見て、入る当番・外れる当番 */
function effect(c, who){
  const inS = [], outS = [];
  if (c.kind === 'swap'){ if (who === c.to){ inS.push([c.ds,c.slot]); outS.push([c.ds2,c.slot2]); } else { inS.push([c.ds2,c.slot2]); outS.push([c.ds,c.slot]); } }
  else if (c.kind === 'give' || c.kind === 'cal'){ (who === c.to ? inS : outS).push([c.ds,c.slot]); }
  else { (who === c.from ? inS : outS).push([c.ds,c.slot]); }
  return {inS, outS};
}
function effHtml(c, who){
  const f = effect(c, who); let h = '';
  if (f.inS.length) h += '<div class="ln"><span class="lb">入る</span>'+f.inS.map(x => pillHtml(x[0],x[1])).join('')+'</div>';
  if (f.outS.length) h += '<div class="ln" style="margin-bottom:0"><span class="lb">外れる</span>'+f.outS.map(x => pillHtml(x[0],x[1])).join('')+'</div>';

function pairOf(a, ds, t){
  if (!a || (a.ds === ds && a.t === t)) return null;
  if (ds < D.today || pendingOn(ds, t)) return null;
  const ia = holder(a.ds, a.t), ib = holder(ds, t);
  if (!ib || (ia === D.me.id) === (ib === D.me.id)) return null;   /* 自分の当番と相手の当番の組み合わせだけ */
  if (TY(a.t) !== TY(t) || a.ds === ds) return null;
  const m = ia === D.me.id ? {ds:a.ds, slot:a.t, ds2:ds, slot2:t} : {ds, slot:t, ds2:a.ds, slot2:a.t};
  const other = holder(m.ds2, m.slot2);
  if (otherCS(m.slot) && holder(m.ds, otherCS(m.slot)) === other) return null;
  if (otherCS(m.slot2) && holder(m.ds2, otherCS(m.slot2)) === D.me.id) return null;
  if (!dowOK(nurse(other), m.ds, m.slot) || !dowOK(D.me, m.ds2, m.slot2)) return null;   /* 入れない曜日には交換できない */
  return Object.assign({kind:'swap', to:other, toName:holderName(m.ds2, m.slot2)}, m);

  };
  let h = monthBar(m.ym, mi, D.months.length, 'mv') + '<div class="status">'+st+'</div>'
    + '<div class="quota">'+qBox('no','入れない枠（早出・CS）','続く3か月',nw0.n,lim.no)+'</div></div>';
  // カレンダー
  h += '<div class="calwrap"><div class="wk">'+DOW.map((x,i)=>'<div class="s'+i+'">'+x+'</div>').join('')+'</div><div class="cal">';
  const days = m.cfg.days || [];
  if (days.length) for (let i=0;i<pd(days[0].d).getDay();i++) h += '<div class="d blank"></div>';
  days.forEach(x => {
    const v = x.off ? '' : (edit[x.d] || ''), cls = cntW(v,'n') ? 'no' : cntW(v,'a') ? 'avoid' : '';
    const mk = (i, lab) => v[i] && v[i] !== '-' ? '<span class="k '+(v[i]==='n'?'kn':'ka')+(i?' sC':' sE')+'">'+lab+'<b>'+(v[i]==='n'?'×':'△')+'</b></span>' : '';
    h += '<div class="d'+(x.off?' off':'')+(!open?' lock':'')+(cls?' '+cls:'')+'" data-d="'+x.d+'"><span class="n">'+pd(x.d).getDate()+'</span>'
      + (cls ? '<span class="ks">'+mk(0,'早')+mk(1,'CS')+'</span>' : '') + (x.b && !x.off ? '<span class="b"></span>' : '') + '</div>';
  });
  h += '</div><div class="legend"><span><i></i>重い当番の日（土曜と水曜のCS・月曜と連休明けの早出）</span><span><i class="off"></i>休診</span></div><div class="legend" style="padding-top:0"><span><span class="lk aE">△</span>早出を避けたい</span><span><span class="lk aC">△</span>CSを避けたい</span><span><span class="lk nE">×</span>早出に入れない</span><span><span class="lk nC">×</span>CSに入れない</span></div></div>';
  if (open){
    const na = Object.values(edit).reduce((a,v)=>a+cntW(v,'a'),0);
    h += '<p class="howto">下で種類を選んでから日付を押してください。もう一度押すと消えます。<br>避けたい枠は、少なく書くほど通りやすくなります。</p>'
      + '<div class="dock"><div class="pens">'
      + '<div class="ph E">早出</div><div class="ph C">CS</div>'
      + PENS.map(([k])=>'<button data-pen="'+k+'" class="'+(k[0]==='a'?'pa':'pn')+' s'+k[1]+(pen===k?' on':'')+'"><b>'+(k[0]==='a'?'△':'×')+'</b>'+(k[0]==='a'?'避けたい':'入れない')+'</button>').join('')
      + '</div><p class="tip">避けたい <b>'+na+'</b> 枠</p>'
      + '<button class="send" id="send"'+((dirty||!D.sent[m.ym]) && !busy ? '' : ' disabled')+'>'+(busy?'送っています…':(D.sent[m.ym]&&!dirty?'送りました':'送る'))+'</button></div>';
  }
  return h;
}
function tapDay(ds){
  const m = D.months[mi]; if (!m || !isOpen(m)) return;
  const x = (m.cfg.days||[]).find(d=>d.d===ds); if (!x || x.off) return;
  const kind = pen[0]==='a' ? 'a' : 'n', t = pen[1], i = t==='E' ? 0 : 1;
  if ((t==='E' && x.e === false) || (t==='C' && x.c === false)){ toast('この日は'+(t==='E'?'早出':'CS')+'がありません'); return; }
  const arr = (edit[ds] || '--').split('');
  if (arr[i] === kind) arr[i] = '-';
  else {
    const lim = m.cfg.limits || {};
    if (kind === 'n'){ const w = noWorst(m.ym); if (w.n >= lim.no){ toast('入れない枠は、続く3か月で'+lim.no+'つまでです（'+w.label+'で'+w.n+'つ）'); return; } }
    arr[i] = kind;
  }
  const code = arr.join(''); if (code === '--') delete edit[ds]; else edit[ds] = code;
  dirty = true; render();
}
function send(){
  const m = D.months[mi]; if (!m || busy) return;
  busy = true; render();
  google.script.run.withSuccessHandler(r => {
    busy = false;
    if (!r.ok){ toast(r.error); render(); return; }
    Object.keys(D.wishes).forEach(ds => { if (ds.slice(0,7) === m.ym) delete D.wishes[ds]; });
    Object.assign(D.wishes, edit); D.sent[m.ym] = r.savedAt; dirty = false; render(); toast('送りました');
  }).withFailureHandler(() => { busy = false; render(); toast('送れませんでした。電波のよいところでもう一度押してください'); }).saveWishes(KEY, m.ym, edit);
}

/* ---------- 決まった当番 ---------- */
/* ---------- アンケート ---------- */
function surveyView(){
  if (!svDraft) svDraft = D.survey ? {early:(D.survey.early||[]).slice(), cs:(D.survey.cs||[]).slice(), pair:D.survey.pair, row:D.survey.row||'', note:D.survey.note||''} : {note:''};
  const a = svDraft;
  /* 入りたくない順に押す（3つまで）。押した順に 1・2・3 の番号が付く。もう一度押すと外れる */
  const dowBtns = (q) => { const L = a[q]; return '<div class="sgrid">' + [1,2,3,4,5,6].map(w => { const r = L ? L.indexOf(String(w)) : -1;
      return '<button data-q="'+q+'" data-v="'+w+'" class="'+(r>=0?'on':'')+(w===6?' s6':'')+'">'+DOW[w]+(r>=0?'<span class="rk">'+(r+1)+'</span>':'')+'</button>'; }).join('')
    + '<button data-q="'+q+'" data-v="" class="none'+(L && !L.length ? ' on' : '')+'">なし</button></div>'
    + '<p class="shint">入りたくない順に、3つまで押してください（押した順に 1・2・3）。もう一度押すと外れます。</p>'; };
  const {done, same} = svState();
  let h = '</div><div class="body"><p class="pnote">当番の決め方を考える参考にします。いつでも答え直せます。</p>';
  h += '<div class="pair"><div class="sq"><b>1</b>入りたくない<span class="em E">早出</span>は何曜日ですか？</div>' + dowBtns('early') + '</div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>2</b>入りたくない<span class="em C">CS</span>は何曜日ですか？</div>' + dowBtns('cs') + '</div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>3</b>早出とCSは、同じ日にまとめたいですか？</div><div class="pseg">'
    + ['same','split','any'].map(k => '<button data-q="pair" data-v="'+k+'" class="'+(a.pair===k?'on':'')+'">'+SV_PAIR[k]+'</button>').join('') + '</div></div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>4</b>当番が2日続くのは、どうですか？</div><div class="pseg">'
    + ['no','few','any'].map(k => '<button data-q="row" data-v="'+k+'" class="'+(a.row===k?'on':'')+'">'+SV_ROW[k]+'</button>').join('') + '</div></div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>5</b>そのほか、ご意見があれば書いてください</div>'
    + '<p class="shint" style="margin-top:4px">当番について気になることなど、自由に書いてください（なくてもかまいません）。</p><textarea id="svNote" maxlength="500" rows="4" placeholder="自由に書いてください">'+esc(a.note||'')+'</textarea></div>';
  h += '<button class="send" id="svSend" style="margin-top:16px"'+(done && !same && !svBusy ? '' : ' disabled')+'>'+(svBusy ? '送っています…' : (same ? '答えました' : '答える'))+'</button>';
  if (D.survey && D.survey.at) h += '<p class="pnote" style="text-align:center;margin-top:8px">前に答えた日時：'+esc(D.survey.at)+'</p>';
  return h + '</div>';
}
/* 1〜3がそろっているか、前に送った答えと同じか */
function svState(){
  const a = svDraft || {};
  const done = Array.isArray(a.early) && Array.isArray(a.cs) && !!a.pair && !!a.row;
  const eq = (x,y) => JSON.stringify(x||null) === JSON.stringify(y||null);
  const same = !!D.survey && eq(D.survey.early,a.early) && eq(D.survey.cs,a.cs) && D.survey.pair===a.pair && (D.survey.row||'')===(a.row||'') && (D.survey.note||'') === (a.note||'').trim();
  return {done, same};
}
function refreshSvBtn(){
  const b = document.getElementById('svSend'); if (!b) return;
  const {done, same} = svState();
  b.disabled = !(done && !same && !svBusy); b.textContent = svBusy ? '送っています…' : (same ? '答えました' : '答える');
}
document.addEventListener('input', e => { if (e.target.id === 'svNote' && svDraft){ svDraft.note = e.target.value; refreshSvBtn(); } });
function sendSurvey(){
  if (svBusy) return;
  svBusy = true; render();
  google.script.run.withSuccessHandler(r => {
    svBusy = false;
    if (!r.ok){ render(); toast(r.error); return; }
    D.survey = {early:svDraft.early.slice(), cs:svDraft.cs.slice(), pair:svDraft.pair, row:svDraft.row, note:(svDraft.note||'').trim(), at:r.at}; svDraft = null; render(); toast('答えを送りました。ありがとうございました');
  }).withFailureHandler(() => { svBusy = false; render(); toast('送れませんでした。電波のよいところでもう一度押してください'); }).saveSurvey(KEY, {early:svDraft.early, cs:svDraft.cs, pair:svDraft.pair, row:svDraft.row, note:svDraft.note||''});
}

function rosterView(){
  const r = D.roster[ri];
  if (!r) return '</div><div class="empty">確定した当番表はまだありません。</div>';
  const days = r.data.days || {}, ds = Object.keys(days).sort();
  const mine = ds.filter(d => days[d].eId === D.id || days[d].cId === D.id || days[d].c2Id === D.id);
  let h = monthBar(r.ym, ri, D.roster.length, 'rv') + '</div><div class="body">';
  h += '<div class="h2">わたしの当番　<span class="num" style="font-size:calc(15px*var(--fs,1));color:var(--ink)">'+mine.length+'</span> 日</div>';
  if (!mine.length) h += '<div class="none">この月の当番はありません</div>';
  else h += '<div class="mine">' + mine.map(d => { const x = days[d], w = pd(d).getDay();
      return '<div class="duty"><div class="dn">'+pd(d).getDate()+'</div><div class="dw s'+w+'">'+DOW[w]+'曜日</div><div class="tags">'
        + (x.eId===D.id?'<span class="tag E">早出</span>':'') + ((x.cId===D.id||x.c2Id===D.id)?'<span class="tag C">CS</span>':'') + '</div></div>'; }).join('') + '</div>';
  h += '<div class="h2" style="margin-top:24px">全員の当番表</div><div class="all"><div class="r hd"><span></span><span class="e">早出</span><span class="c">CS</span></div>';
  const nm = (n,id) => n ? (id===D.id ? '<span class="me">'+esc(n)+'</span>' : esc(n)) : '<span class="em">—</span>';
  ds.forEach(d => { const x = days[d], w = pd(d).getDay();
    h += '<div class="r"><span class="dt s'+w+'"><span class="num">'+pd(d).getDate()+'</span>'+DOW[w]+'</span><span>'+nm(x.early,x.eId)+'</span><span>'+(x.cs===undefined?'':nm(x.cs,x.cId)+(x.cs2===undefined?'':'<br>'+nm(x.cs2,x.c2Id)))+'</span></div>'; });
  return h + '</div><div class="conf">確定：'+esc(r.at)+'</div>'+'</div>';
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-d]'); if (!t || t.disabled || !document.getElementById('wWrap').contains(t)) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); }
  else if (t.dataset.mv){ if (dirty && !confirm('送っていない変更があります。送らずに月を変えますか？')) return; mi += +t.dataset.mv; loadEdit(); render(); }
  else if (t.dataset.rv){ ri += +t.dataset.rv; render(); }
  else if (t.dataset.pen){ pen = t.dataset.pen; render(); }
  else if (t.dataset.q){
    const q = t.dataset.q, v = t.dataset.v;
    if (q === 'pair' || q === 'row') svDraft[q] = v;
    else if (v === '') svDraft[q] = [];
    else {
      const L = Array.isArray(svDraft[q]) ? svDraft[q].slice() : [], i = L.indexOf(v);
      if (i >= 0) L.splice(i,1);
      else if (L.length >= 3){ toast('3つまでです。外したい曜日をもう一度押してください'); return; }
      else L.push(v);
      svDraft[q] = L.length ? L : undefined;
      if (!L.length) delete svDraft[q];
    }
    render();
  }
  else if (t.id === 'svSend') sendSurvey();
  else if (t.id === 'send') send();
  else if (t.dataset.d) tapDay(t.dataset.d);
});
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
/* Ver11.6.6：ここでは始めない（当番表が出たあとに wKick() が始める） */

window.W = {show(t){ tab = t; if (D) render(); }, ready:() => !!D, restart(){ D = null; svDraft = null; edit = {}; dirty = false; busy = false; svBusy = false; start(); }};

})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('toban-sw.js', {scope:'./toban'}).catch(() => {});
</script>
