  .apptitle{font-size:calc(15px*var(--fs,1));font-weight:700;color:var(--sky-d);letter-spacing:.08em}
  .who{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);color:var(--sky-d);
       padding:5px 14px;border-radius:999px;font-size:calc(15px*var(--fs,1))}
  .who b{font-size:calc(17px*var(--fs,1));color:var(--ink)}

  .demo{background:#FFF8D9;border:1px solid #EFD98A;color:#6A5300;border-radius:14px;padding:10px 12px;
        font-size:calc(14px*var(--fs,1));margin-bottom:14px}
  .demo .sw{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .demo .sw button{border:1px solid #D9C064;background:#fff;color:#6A5300;border-radius:999px;padding:5px 12px;font-size:calc(13px*var(--fs,1))}
  .demo .sw button.on{background:#6A5300;color:#fff;border-color:#6A5300}
  .demo .sw button:active,.btn:active,.tabs button:active,.admlink:active,.foot button:active{opacity:.6}

  .list{display:flex;flex-direction:column;gap:12px}
  .app{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
       border-radius:18px;padding:16px;box-shadow:0 2px 6px rgba(30,60,90,.05);cursor:pointer;color:inherit;
       transition:transform .08s ease}

  /* =========================================================
     Ver3.1.0〜 四角いデザイン(色つきタイル)
     ・角はすべてまっすぐ ・アプリは2列の四角いタイル(アプリの色でぬる)
     ・Ver3.1.1〜 背景の空の写真は残す(上の青い帯はやめた)
     ・Ver3.2.0〜 タイルを色のグラデーションに。アイコンの白い四角をやめて大きく。「あなた専用」「匿名」の札はタイルに出さない
     ・Ver3.2.2〜 お知らせを、青い枠と「お知らせ」の見出しがついた半透明の箱にした
     ・Ver3.2.3〜 お知らせの見出しと枠を、スカイブルーにした
     ・Ver3.2.5〜 タイルを、空がはっきりすけて見える、うすいガラス風にした
     ・Ver3.2.8〜 タイルは光の反射だけ(枠と影は付けない)
     ・Ver3.2.9〜 お知らせの箱も、タイルと同じく枠と影をなくし、空がすけるようにした
     ・Ver3.3.0〜 ボタンの数字(赤い丸)
     ========================================================= */
  *,*::before,*::after{border-radius:0 !important}
  :root{--navy:#12324A; --band:#1F7FCB; --paper:#E9F1F7; --notice:#FFD84D}
  header{margin-bottom:0;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
  .logo{max-width:325px;margin:0 auto}   /* Ver3.4.13〜 ロゴの大きさ(290→380は大きすぎたので325) */
  .hrow{margin-top:10px}
  .who{background:none;color:#fff;padding:4px 12px;font-size:calc(16px*var(--fs,1));font-weight:700;text-shadow:0 1px 2px rgba(0,40,80,.5)}   /* Ver3.4.6〜 背景なし・白い文字・薄い影(3.4.5より少し濃く)。名前・さん・職種を同じ大きさと太さに */
  .who b{color:#fff;font-size:calc(16px*var(--fs,1));font-weight:700}
  main.wrap{padding-top:14px}
  .list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .list{grid-auto-rows:1fr} .list > .app{align-self:stretch}   /* Ver3.4.7〜 札(NEWなど)のあるタイルが高くなっても、全部のタイルを同じ高さにそろえる */
  .app{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0;padding:14px;aspect-ratio:1/1;
       color:var(--tk,#fff);border:0;
       background:var(--c,#2F7FC1);
       background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.08) 38%, rgba(255,255,255,0) 60%),
                  linear-gradient(150deg, color-mix(in srgb, var(--c,#2F7FC1) 24%, transparent) 0%, color-mix(in srgb, var(--c,#2F7FC1) 52%, transparent) 100%);   /* Ver3.4.10〜 少しだけすけにくく(14→24%、40→52%) */
       box-shadow:none}
  /* Ver3.4.14〜 押したときの動き(案A すっと沈む)をなめらかに。
     スマホが毎回描き直さなくてよい動き(大きさ・重ねた影のうすさ)だけを使う。
     タイルのごく弱いぼかし(1.5px)は、動きを重くするのでやめた(見た目はほぼ同じ) */
  .app{position:relative;transform:translateZ(0);will-change:transform;backface-visibility:hidden;
       transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .app::after{content:"";position:absolute;inset:0;background:rgba(0,30,60,.14);opacity:0;pointer-events:none;
       transition:opacity .25s ease}
  .app{touch-action:manipulation;-webkit-tap-highlight-color:transparent}   /* Ver3.4.15〜 形を変えるのはプログラムだけにした(:active は使わない) */
  .app.pressed{transform:scale(.96);transition:transform .1s ease-out}
  .app.pressed::after{opacity:1;transition:opacity .1s ease-out}
  .app:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
  .app .icon{flex:0 0 128px;width:128px;height:128px;font-size:104px;background:transparent !important;filter:drop-shadow(0 3px 4px rgba(0,30,60,.25))}
  .app .icon.img{width:128px;height:128px;flex-basis:128px}   /* Ver3.4.8〜 アイコンをさらに大きく(60→100→128) */
  .app .body{flex:0 0 auto;width:100%}
  .app .name{font-size:calc(17px*var(--fs,1));line-height:1.3;color:inherit;word-break:break-all;text-shadow:var(--ts,0 1px 2px rgba(0,30,60,.7), 0 0 8px rgba(0,30,60,.35))}
  .app .desc,.app .arrow{display:none}
  .app .tags{margin-top:6px;gap:4px}
  /* Ver3.4.17〜 アプリの名前を大きく(17→19)。アイコンは真ん中。左右の余白を少しせまく
     Ver3.4.19〜 文字は左ぞろえ(3.4.18の右ぞろえから戻した)。札(NEWなど)はアプリ名の上に出し、アプリ名はどのタイルでもいちばん下の同じ位置 */
  .list > .app{align-items:center;text-align:left;padding-left:10px;padding-right:8px}
  .app .body{display:flex;flex-direction:column;align-items:flex-start;box-sizing:border-box;padding-left:6px}   /* Ver3.4.20〜 アプリ名と札を少し右へ(6px) */
  .app .name{font-size:calc(19px*var(--fs,1));font-weight:700;text-align:left;justify-content:flex-start;word-break:normal;overflow-wrap:anywhere}
  .app .tags{order:-1;margin:0 0 6px;justify-content:flex-start}
  .list > .app .icon{transform:translate(-14px,-6px)}   /* Ver3.4.21〜 アイコンを少し左上へ(左14px・上6px)。タイルの大きさ・アプリ名の位置は変えない */
  .app .bdg{left:calc(50% + 30px);top:1px}
  .app .tag{font-size:calc(11.5px*var(--fs,1));padding:1px 6px;background:rgba(0,40,80,.28);color:inherit;border:1px solid currentColor}
  .app .tag.new{background:#fff;color:var(--navy);border-color:#fff}
  .app .tag.qr{background:#fff;color:#B26A00;border-color:#fff}
  .app .tag.me,.app .tag.anon{display:none}
  .app.locked{background:linear-gradient(150deg,rgba(150,162,171,.2) 0%,rgba(110,124,134,.45) 100%);color:#fff}
  .app.locked .name{color:#fff}
  .app.locked .icon{opacity:.6;filter:grayscale(1)}
  .news{gap:0;margin:0 0 16px;border:0;box-shadow:none;
        background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.08) 38%, rgba(255,255,255,0) 60%), rgba(255,255,255,.3);
        -webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
  .news::before{content:"お知らせ";display:block;background:#3FA9EC;color:#fff;text-shadow:0 1px 2px rgba(0,60,110,.35);font-weight:700;font-size:calc(14px*var(--fs,1));padding:5px 14px;letter-spacing:.05em}
  .nw{border:0;background:transparent;color:#12324A;box-shadow:none;padding:11px 14px}
  .nw + .nw{border-top:1px dashed rgba(63,169,236,.7)}
  .nw .ni{display:none}
  .nw .nb{text-shadow:0 0 6px rgba(255,255,255,.95), 0 0 2px rgba(255,255,255,.95)}
  .nw .nb small{color:#3E5466;opacity:1}
  .nw .na{color:#2A93D6}
  button.nw:active{transform:none;background:rgba(255,255,255,.35)}
  .needreg,.pconly,.panel{background:#fff}
  .prev{background:var(--paper)}
  .prev .app{width:170px;cursor:default}
  .prev .news{margin:0}
  .tabs button{background:#fff}
  /* Ver3.3.0〜 ボタンの数字(まだ読んでいない・答えていない数)。アイコンの右上に赤い丸 */
  .app{position:relative}
  .app .bdg{position:absolute;top:6px;left:122px;min-width:26px;height:26px;padding:0 7px;border-radius:13px !important;
            background:#E2553F;color:#fff;font-size:calc(15px*var(--fs,1));font-weight:700;line-height:26px;text-align:center;
            box-shadow:0 0 0 2px #fff;pointer-events:none;text-shadow:none;font-family:inherit}

  /* =========================================================
     Ver3.5.0〜 文字の大きさ(標準・大・特大)。スタッフが自分のスマホで選ぶ
     ・選んだ大きさは、そのスマホの中だけに覚える(GASには送らない)
     ・標準は Ver3.4.23 と同じ見た目。大=1.3倍、特大=1.6倍
     ・Ver3.5.1〜 タイルの大きさ・並び(2列)・アイコンの大きさは、どの大きさでも標準と同じ(院長の指示)。
       タイルの中の文字(アプリ名・札)は、タイルに入るかぎり大きくする(--tfs。プログラム fsFit が決める)
     ========================================================= */
  html[data-fs="l"]{--fs:1.3}
  html[data-fs="xl"]{--fs:1.6}
  .app .bdg{min-width:calc(26px*var(--fs,1));height:calc(26px*var(--fs,1));line-height:calc(26px*var(--fs,1));
            padding:0 calc(7px*var(--fs,1));border-radius:calc(13px*var(--fs,1)) !important}
  html[data-fs] .toast{white-space:normal;text-align:center;width:max-content}
  html[data-fs] .scan .btns{flex-wrap:wrap}
  html[data-fs] .scan .btns button,html[data-fs] .scan .btns label{white-space:normal}
  html[data-fs] .foot{flex-wrap:wrap;gap:4px 12px}
  .list > .app .name{font-size:calc(19px*var(--tfs,1))}
  .list > .app .tag{font-size:calc(11.5px*var(--tfs,1))}
  .list.fsfix{grid-auto-rows:auto}
  .list.fsfix > .app{aspect-ratio:auto;gap:0;overflow:hidden}
  .list.fsfix > .app .icon{margin-bottom:-6px}
  .list.fsfix > .app .name{line-height:1.25}
  /* Ver3.5.3〜 文字の大きさの入口は、下の列(最新にする・登録を解除)の中の小さい「ぁあ」の印だけ。
     押すと、下から「標準・大・特大」を選ぶ画面が出る(ふだんの画面には何も足さない。院長が選んだ形) */
  .foot .fsbtn{border:1px solid #8FA3B2;background:none;color:#5E7383;font-weight:700;padding:0 7px;line-height:1.5;
       display:inline-flex;align-items:baseline;gap:1px;cursor:pointer;touch-action:manipulation}
  .foot .fsbtn span{font-size:calc(11px*var(--fs,1))}
  .foot .fsbtn b{font-size:calc(17px*var(--fs,1));font-weight:700}
  .fsbg{position:fixed;inset:0;background:rgba(20,35,50,.35);display:none;align-items:flex-end;justify-content:center;z-index:25}
  .fsbg.show{display:flex}
  .fsbox{background:#fff;width:100%;max-width:560px;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .fsbox h3{margin:0 0 14px;font-size:calc(19px*var(--fs,1));color:#22303A}
  .fsrow{display:flex;gap:10px}
  .fsrow button{flex:1 1 0;min-width:0;height:64px;padding:0;border:1px solid #7FB8E4;background:#fff;color:#1F6FB0;font-weight:700;cursor:pointer;touch-action:manipulation}
  .fsrow button:active,.fsclose:active,.foot .fsbtn:active{opacity:.6}
  .fsrow button.on{background:#2F8FD8;color:#fff;border-color:#2F8FD8}
  .fsrow button[data-sz=""]{font-size:16px}
  .fsrow button[data-sz="l"]{font-size:21px}
  .fsrow button[data-sz="xl"]{font-size:26px}
  .fsclose{width:100%;margin-top:14px;padding:13px;border:0;background:#EEF3F7;color:#46535C;font-size:calc(16px*var(--fs,1));cursor:pointer}
  @media print{ .fsbg{display:none !important} }
</style>
</head>

/* ---------- アイコン(Ver1.12.0〜:院長が作った画像を使える) ----------
   アイコンの欄が「portal-icon-〇〇.png」の形のときは、同じ場所(GitHub Pages)に置いたその画像を出す。
   それ以外は今までどおり絵文字。画像が無いとき・読めないときは 📱 を出す。
   画像のファイル名は決めた形のものだけを使う(ほかの場所の画像は読み込まない)。 */
const ICON_RE = /^portal-icon-[a-z0-9][a-z0-9-]{0,29}\.png$/;
function iconFile(v){ v = String(v == null ? '' : v).trim(); return ICON_RE.test(v) ? v : ''; }
/* Ver3.1.0〜:タイルの文字の色。アプリの色が明るいとき(黄色など)は、紺色の文字にする */
function tileInk(c){
  const m = /^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(c || '');
  if (!m) return '#fff';
  const f = v => { v = parseInt(v, 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * f(m[1]) + 0.7152 * f(m[2]) + 0.0722 * f(m[3]);
  return L > 0.36 ? '#12324A' : '#fff';
}
function tileStyle(c){ if (!okColor(c)) return ''; const k = tileInk(c); return ' style="--c:' + c + ';--tk:' + k + (k === '#fff' ? '' : ';--ts:none') + '"'; }
function iconHtml(a, bg){
  const f = iconFile(a.icon);
  if (f) return '<div class="icon img" ' + bg + '><img src="' + f + '" alt=""></div>';
  const em = /^portal-/.test(String(a.icon || '')) ? '' : a.icon;      // 形のちがうファイル名は文字として出さない
  return '<div class="icon" ' + bg + '>' + esc(em || '📱') + '</div>';
}
document.addEventListener('error', e => {                              // 画像が無いときは 📱 にもどす
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('img')){
    // Ver3.4.22〜 電波が一瞬とぎれただけで 📱 にならないよう、少し待って2回まで読み直す
    const tries = Number(t.dataset.try || 0);
    if (tries < 2){
      t.dataset.try = String(tries + 1);
      const base = t.getAttribute('src').split('?')[0];
      setTimeout(() => { if (t.isConnected) t.src = base + '?r=' + (tries + 1); }, tries ? 4000 : 1500);
      return;
    }
    const p = t.parentNode; p.classList.remove('img'); p.textContent = '📱';
  }
}, true);
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- 一覧の取得 ---------- */
// Ver3.4.22〜 電波が一瞬とぎれた・GASの返事がおそいときに、すぐ「通信できない」にしないよう、
//   1回20秒まで待ち、だめなら少し間をおいて2回までやり直す(合言葉がちがう返事のときはやり直さない)
async function fetchOnce(key){
  const u = GAS_URL + '?action=list&k=' + encodeURIComponent(key) + '&t=' + Date.now();
  const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  const tm = ctl ? setTimeout(() => ctl.abort(), 20000) : 0;
  try {
    const res = await fetch(u, ctl ? { cache:'no-store', signal:ctl.signal } : { cache:'no-store' });
    if (!res.ok) throw new Error('http');
    return await res.json();
  } finally { clearTimeout(tm); }
}
async function fetchList(key, role){
  if (DEMO) return demoData(key, role);
  const waits = [1500, 3500];
  for (let n = 0; ; n++){
    try { return await fetchOnce(key); }
    catch(e){
      if (n >= waits.length) throw e;
      await new Promise(r => setTimeout(r, waits[n]));
    }
  }
}

/* ---------- 文字の大きさ(Ver3.5.0〜) ----------
   スタッフが自分のスマホで「標準・大・特大」を選ぶ。選んだものは、このスマホの中だけに覚える。
   Ver3.5.2〜 覚え書きの名前を、スタッフ向けアプリで共通の skyStaff_fs にした(ここで選ぶと、当番・ご意見箱なども同じ大きさで開く)。
   入っているのは l・xl の文字だけ(名前・合言葉は入れない)。
   入口アプリのGAS・記録には送らない。「登録を解除」しても消さない(スマホの持ち主の好みなので)。 */
(function(){ const o = ls.get(LS_FS_OLD); if (o !== null){ if (ls.get(LS_FS) === null && (o === 'l' || o === 'xl')) ls.set(LS_FS, o); ls.del(LS_FS_OLD); } })();
function fsGet(){ const v = ls.get(LS_FS); return (v === 'l' || v === 'xl') ? v : ''; }
function fsSync(){                         // ほかのアプリで大きさを変えてもどってきたときに合わせる
  const v = fsGet(), cur = document.documentElement.getAttribute('data-fs') || '';
  if (v === cur) return;
  fsApply(v); fsFit(); fsMark();
}
function fsApply(v){ const r = document.documentElement; if (v) r.setAttribute('data-fs', v); else r.removeAttribute('data-fs'); }
function fsHtml(){ return '<button type="button" class="fsbtn noprint" aria-label="文字の大きさ"><span>あ</span><b>あ</b></button>'; }
function fsMark(){ const v = fsGet(); document.querySelectorAll('.fsrow button').forEach(x => { const on = x.dataset.sz === v; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); }); }
function fsOpen(){
  let bg = document.getElementById('fsBg');
  if (!bg){
    bg = document.createElement('div'); bg.id = 'fsBg'; bg.className = 'fsbg noprint';
    bg.innerHTML = '<div class="fsbox" role="dialog" aria-label="文字の大きさ"><h3>文字の大きさ</h3><div class="fsrow">'
      + '<button type="button" data-sz="">標準</button><button type="button" data-sz="l">大</button><button type="button" data-sz="xl">特大</button></div>'
      + '<button type="button" class="fsclose">とじる</button></div>';
    document.body.appendChild(bg);
  }
  fsMark(); bg.classList.add('show');
}
function fsClose(){ const bg = document.getElementById('fsBg'); if (bg) bg.classList.remove('show'); }
/* タイルの大きさは標準のまま、中の文字だけを、入るかぎり大きくする(Ver3.5.1〜) */
function fsFit(){
  const list = $('#main .list'); if (!list) return;
  const r = document.documentElement, v = r.getAttribute('data-fs');
  const apps = Array.prototype.slice.call(list.querySelectorAll('.app'));
  list.classList.remove('fsfix');
  apps.forEach(a => { a.style.height = ''; a.style.removeProperty('--tfs'); });
  if (!v) return;
  r.removeAttribute('data-fs');                                   // いったん標準にして、タイルの高さを測る
  const hs = apps.map(a => a.getBoundingClientRect().height);
  r.setAttribute('data-fs', v);
  const fs = parseFloat(getComputedStyle(r).getPropertyValue('--fs')) || 1;
  list.classList.add('fsfix');
  apps.forEach((a, i) => {
    a.style.height = hs[i] + 'px';
    const body = a.querySelector('.body'), icon = a.querySelector('.icon'); if (!body || !icon) return;
    const cs = getComputedStyle(a);
    const room = hs[i] - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - icon.offsetHeight + 6;
    let t = fs; a.style.setProperty('--tfs', String(t));
    while (t > 1 && body.offsetHeight > room + 0.5){ t = Math.max(1, Math.round((t - 0.05) * 100) / 100); a.style.setProperty('--tfs', String(t)); }
  });
}
fsApply(fsGet());
window.addEventListener('pageshow', fsSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fsSync(); });
window.addEventListener('storage', e => { if (e.key === LS_FS) fsSync(); });
let fsFitT = 0;
window.addEventListener('resize', () => { clearTimeout(fsFitT); fsFitT = setTimeout(fsFit, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fsFit).catch(() => {});
document.addEventListener('click', e => {
  const t = e.target; if (!t || !t.closest) return;
  if (t.closest('.fsbtn')) return fsOpen();
  const b = t.closest('.fsrow button');
  if (b){
    const v = (b.dataset.sz === 'l' || b.dataset.sz === 'xl') ? b.dataset.sz : '';
    if (v) ls.set(LS_FS, v); else ls.del(LS_FS);
    fsApply(v); fsFit(); fsMark();
    return;                                    // 選んだ大きさをその場で見られるよう、画面は「とじる」まで出したまま
  }
  if (t.closest('.fsclose') || t.id === 'fsBg') fsClose();
});

         +   '<div class="arrow">' + (locked ? '🔒' : needqr ? '📷' : '›') + '</div>'

    });

  h += '<div class="foot"><span class="ver">' + VERSION + '</span>'

  if (data._at) h += '<div class="updated">' + esc(data._at) + ' の内容です</div>';
  if (hasQR) h += '<a class="admlink" href="#" id="requr">個人QRを読み取り直す</a>';
  $('#main').innerHTML = h;
  bindDemo();
  fsFit();

  document.querySelectorAll('.app').forEach(b => {
    // Ver3.4.16〜 押したときの動き
    //  ・指が触れて少し(0.06秒)たってから縮む。画面をなぞって動かしたとき(スクロール)は縮まない
    //  ・指をはなしたら、すぐに軽くはずんで戻る。戻りながらアプリを開く
    //  ・すばやく押してすぐはなしたとき(縮む前にはなした)も、一瞬だけ縮んで戻る
    const on = () => b.classList.add('pressed');
    const off = () => b.classList.remove('pressed');
    let tDown = 0, waiting = false, sx = 0, sy = 0;
    b.addEventListener('pointerdown', e => {
      sx = e.clientX; sy = e.clientY; waiting = true;
      tDown = setTimeout(() => { waiting = false; on(); }, 60);
    });
    b.addEventListener('pointermove', e => {
      if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) { clearTimeout(tDown); waiting = false; off(); }
    });
    b.addEventListener('pointerup', () => {
      clearTimeout(tDown);
      if (waiting) { waiting = false; on(); setTimeout(off, 90); }   // 縮む前にはなした
      else off();                                                     // はなしたら戻る
    });
    b.addEventListener('pointercancel', () => { clearTimeout(tDown); waiting = false; off(); });
    b.addEventListener('click', () => {
      if (b.dataset.busy) return;                 // すばやい2回押しで2回開かないように
      b.dataset.busy = '1';
      setTimeout(() => { openApp(data.apps[+b.dataset.i]); }, 180);   // 戻る動きが見えてから開く

/* ---------- ボタンの数字(Ver3.3.0〜。連携8-4) ----------
   ほかのスタッフアプリの「数字の部品」を、同じ置き場所から見えない枠(iframe)で開き、
   部品が送ってくる数字(まだ読んでいない・答えていない数)を、そのアプリのボタンに出す。
   ・数字はこの画面に出すだけ。入口アプリのGAS・スマホの中・記録には送らない・保存しない。
   ・部品の合言葉・GAS・スマホの中の覚え書きには、さわらない。
   ・部品がない・返事がない・こわれた返事のときは、数字が出ないだけ。
   ・部品を足すときは、下の一覧に1行足す(files は、その部品が数を送ってくるアプリのファイル名)。 */
const BADGE_PARTS = [
  { src:'goikenbako-badge.html', files:['renraku.html', 'anketo.html'] }   // ご意見箱(業務連絡・アンケート)
];
const badgeFrames = [];          // { src, frame }
const badgeCounts = {};          // ファイル名 → 数(この画面の中だけ)
let badgeData = null;
function appFile(a){
  const u = String((a && (a.base || a.url)) || '');
  return u.split(/[?#]/)[0].split('/').pop().toLowerCase();
}
function badgeAfterList(data){
  badgeData = data;
  if (DEMO || !data || !data.staff) { badgeStop(); return; }       // 見本・未登録では作らない
  const have = {};
  (data.apps || []).forEach(a => { have[appFile(a)] = true; });
  BADGE_PARTS.forEach(p => {
    if (!p.files.some(f => have[f])) return;                        // そのアプリが一覧にない人には作らない
    if (badgeFrames.some(x => x.src === p.src)) return;             // 枠は1つだけ。消さずに置いておく
    setTimeout(() => {                                              // 一覧を出すのを待たせない
      if (badgeFrames.some(x => x.src === p.src)) return;
      try {
        const f = document.createElement('iframe');
        f.src = p.src; f.title = ''; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
        f.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
        badgeFrames.push({ src:p.src, frame:f });
        document.body.appendChild(f);
      } catch(e){}
    }, 200);
  });
  drawBadges();
}
function drawBadges(){
  if (!badgeData) return;
  document.querySelectorAll('#main .app').forEach(b => {
    const a = (badgeData.apps || [])[+b.dataset.i];
    const n = a ? (badgeCounts[appFile(a)] || 0) : 0;
    let el = b.querySelector('.bdg');
    if (!n){ if (el) el.remove(); return; }                         // 0 のときは何も出さない
    if (!el){ el = document.createElement('span'); el.className = 'bdg'; b.appendChild(el); }
    el.textContent = String(n);
  });
}
function badgeStop(){
  badgeFrames.splice(0).forEach(x => { try { x.frame.remove(); } catch(e){} });
  Object.keys(badgeCounts).forEach(k => { delete badgeCounts[k]; });
  document.querySelectorAll('#main .bdg').forEach(el => el.remove());
}
function badgeRefresh(){
  badgeFrames.forEach(x => { try { x.frame.contentWindow.postMessage({ type:'staff-badge-refresh' }, location.origin); } catch(e){} });
}
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;                         // 同じ置き場所からだけ
  const fr = badgeFrames.filter(x => x.frame.contentWindow === e.source)[0];
  if (!fr) return;                                                  // 自分で開いた枠からだけ
  const d = e.data;
  if (!d || typeof d !== 'object' || d.type !== 'staff-badge' || d.v !== 1 || !d.counts || typeof d.counts !== 'object') return;
  const part = BADGE_PARTS.filter(p => p.src === fr.src)[0];
  if (!part) return;
  part.files.forEach(f => {                                         // その部品のアプリの分だけ使う(知らない名前は無視)
    const n = Object.prototype.hasOwnProperty.call(d.counts, f) ? d.counts[f] : 0;
    badgeCounts[f] = Number.isInteger(n) && n > 0 && n <= 99 ? n : 0;
  });
  drawBadges();
});

/* ---------- お知らせ(Ver2.1.0〜) ----------
   院長がPCの設定で書いた文を、アプリ一覧の上に出す(5件まで)。文は必ず esc() を通して出す。
   アプリを結びつけたお知らせは、その人の一覧にそのアプリがあるときだけ、押すと開く。 */
function newsHtml(data){
  const L = Array.isArray(data.notices) ? data.notices.slice(0, 5) : [];
  if (!L.length) return '';
  return '<div class="news">' + L.map(n => {
    const app = n.appId ? (data.apps || []).filter(a => a.id === n.appId)[0] : null;
    const sub = [n.until ? esc(n.until) + 'まで' : '', app ? '押すと「' + esc(app.name) + '」が開きます' : ''].filter(Boolean).join(' ・ ');
    const inner = '<span class="ni">📣</span><span class="nb">' + esc(n.text) + (sub ? '<small>' + sub + '</small>' : '') + '</span>'
      + (app ? '<span class="na">›</span>' : '');
    return app ? '<button class="nw" data-app="' + esc(app.id) + '">' + inner + '</button>' : '<div class="nw">' + inner + '</div>';
  }).join('') + '</div>';
}

window.addEventListener('pageshow', () => {     // Ver3.4.9〜 アプリからもどったとき、押した形を消す
  document.querySelectorAll('.app.pressed').forEach(x => { x.classList.remove('pressed'); delete x.dataset.busy; });
});
function openApp(a){
  if (a.state === 'locked'){
    return showSheet('登録した人だけのアプリです',
      'このアプリは、一人ずつの画面になります。院長からもらった「登録QR」をスマホで読み取ってから開いてください。');
  }
  if (a.state === 'needqr') return openScan(a);
  if (a.state === 'nourl'){
    return showSheet('準備中です', 'あなた用のページがまだ用意されていません。院長にお知らせください。');
  }
  if (DEMO) return showSheet('見本です', '「' + a.name + '」が開きます(見本なので開きません)。'
      + (a.personal ? 'このアプリは、その人専用のページが開きます。' : '匿名のアプリなので、名前などは一切渡さずに開きます。'));
  location.href = a.viaQR ? withFromPortal(a.url) : a.url;
}
/* Ver2.0.1〜:「一人ずつのQR」のアプリを開くときだけ、うしろに from=portal を足す(当番アプリからの依頼)。
   相手アプリが「入口アプリから開かれた=登録ずみ」と分かるようにするための印。
   足すのは開くときだけで、スマホの中に保存するアドレスは印なしのまま。名前・合言葉などは足さない。 */
function withFromPortal(u){
  u = String(u || '');
  const h = u.indexOf('#'), body = h < 0 ? u : u.slice(0, h), tail = h < 0 ? '' : u.slice(h);
  if (/[?&]from=portal(&|$)/.test(body)) return u;
  return body + (body.indexOf('?') < 0 ? '?' : '&') + 'from=portal' + tail;
}

/* ---------- 見本の切り替え ---------- */
function demoBanner(){
  if (!DEMO) return '';
  return '<div class="demo noprint">見本データで表示しています(GASがまだつながっていません)。'
    + '<div class="sw"><button data-v="me" class="' + (demoView==='me'?'on':'') + '">登録した人の見え方</button>'
    + '<button data-v="anon" class="' + (demoView==='anon'?'on':'') + '">登録していないスマホの見え方</button>'
    + '<button data-v="boss" class="' + (demoView==='boss'?'on':'') + '">院長の見え方</button></div></div>';
}
function bindDemo(){
  document.querySelectorAll('.demo .sw button').forEach(b => b.addEventListener('click', () => { demoView = b.dataset.v; start(true); }));
}

/* ---------- おしらせ ---------- */
function showSheet(t, x){
  $('#sheetTitle').textContent = t; $('#sheetText').textContent = x;
  $('#sheetBg').classList.add('show');
}
$('#sheetOk').addEventListener('click', () => $('#sheetBg').classList.remove('show'));
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') $('#sheetBg').classList.remove('show'); });

/* ---------- 読み取った個人QRの保存(このスマホの中だけ) ---------- */
function purlKey(){ return LS_PURL; }
function myQR(){
  try { const o = JSON.parse(ls.get(purlKey()) || 'null'); if (o && o.k === curKey() && o.urls) return o.urls; } catch(e){}
  return {};
}
function saveMyQR(urls){ ls.set(purlKey(), JSON.stringify({ k:curKey(), urls:urls })); }
function curKey(){ return DEMO ? 'demo' : (ls.get(LS_KEY) || ''); }
function qrFits(url, base){ return !!base && typeof url === 'string' && /^https:\/\/\S+$/.test(url) && (url.indexOf(base + '?') === 0 || url.indexOf(base + '#') === 0) && url.length > base.length + 1; }
/* GASからもらった一覧に、このスマホが覚えている個人QRをあてはめる */
function applyMyQR(data){
  const mine = myQR();
  (data.apps || []).forEach(a => {
    if (!a.selfReg) return;
    if (qrFits(mine[a.id], a.base)){ a.state = 'ok'; a.url = mine[a.id]; a.viaQR = true; }
    else { a.state = a.base ? 'needqr' : 'nourl'; a.url = null; a.viaQR = false; }
  });
  return data;
}

/* ---------- 個人QRを読み取って、自分用のアドレスとして登録する ---------- */
let scanApp = null, scanStream = null, scanTimer = null, scanBusy = false, scanErr = '';
const scanCanvas = document.createElement('canvas');

/* 画面の一部を切り出して読む。ぼやけないよう、まず元の大きさのまま試す */
function decodePart(src, sx, sy, sw, sh, max, invert, mirror){
  const s = Math.min(1, max / Math.max(sw, sh));
  const cv = scanCanvas; cv.width = Math.round(sw * s); cv.height = Math.round(sh * s);
  const cx = cv.getContext('2d', { willReadFrequently:true });
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (mirror){ cx.translate(cv.width, 0); cx.scale(-1, 1); }   // 鏡うつしのカメラ用
  cx.drawImage(src, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  const im = cx.getImageData(0, 0, cv.width, cv.height);
  const r = jsQR(im.data, im.width, im.height, { inversionAttempts: invert ? 'attemptBoth' : 'dontInvert' });
  return r && r.data ? r.data.trim() : '';
}
/* まん中・全体の順に、何通りか試す */
function decodeFrom(src, w, h, hard){
  const m = Math.min(w, h), cx = (w - m) / 2, cy = (h - m) / 2;
  const tries = [
    [cx, cy, m, m, 1200, false],                                  // まん中(白いわくのあたり)
    [0, 0, w, h, 1400, false],                                    // 画面ぜんたい
    [cx + m * 0.15, cy + m * 0.15, m * 0.7, m * 0.7, 1000, false] // もっと寄せて
  ];
  if (hard) tries.push([cx, cy, m, m, 1200, true, false], [0, 0, w, h, 900, true, false],
                       [cx, cy, m, m, 1200, false, true], [0, 0, w, h, 1200, false, true]);   // 鏡うつしも試す
  if (typeof jsQR !== 'function'){ scanErr = 'QRを読む部品が読み込めていません。'; return ''; }
  for (const a of tries){
    try {
      const r = decodePart(src, a[0], a[1], a[2], a[3], a[4], a[5], a[6]);
      if (r) return r;
    } catch(e){ scanErr = 'エラー:' + (e && e.message ? e.message : e); return ''; }
  }
  return '';
}
let scanCb = null;   // 読み取った文字を受け取る関数。エラーの文を返すと読み取りを続け、'' を返すと閉じる
function openScan(a){
  scanApp = a;
  return openScanWith('「' + a.name + '」のQRを読み取る', '自分の個人QRを、白いわくの中に入れてください', text => {
    if (!qrFits(text, a.base)) return 'このアプリのQRではないようです。「' + a.name + '」の自分のQRを読み取ってください。';
    const mine = myQR(); mine[a.id] = text; saveMyQR(mine);
    toast('「' + a.name + '」を登録しました');
    setTimeout(() => start(false), 0);
    return '';
  });
}
async function openScanWith(title, sub, cb){
  scanCb = cb; scanBusy = false;
  $('#scanTitle').textContent = title; $('#scanSub').textContent = sub;
  $('#scanMsg').textContent = 'カメラを準備しています…';
  $('#scan').classList.add('show');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
    const v = $('#scanVideo'); v.srcObject = scanStream; await v.play();
    $('#scanMsg').textContent = '';
    let n = 0, noFrame = 0;
    scanTimer = setInterval(() => {
      if (scanBusy) return;
      if (!v.videoWidth){
        if (++noFrame === 15) $('#scanInfo').textContent = 'カメラの映像が出ていません(0×0)';
        return;
      }
      n++;
      const text = decodeFrom(v, v.videoWidth, v.videoHeight, n % 3 === 0);
      $('#scanInfo').textContent = scanErr ? scanErr : '読み取り中… ' + v.videoWidth + '×' + v.videoHeight + ' / ' + n + '回';
      if (text) return gotQR(text);
      if (n === 25) $('#scanMsg').textContent = 'QRに近づけて、画面いっぱいに写してみてください。';
      if (n === 70) $('#scanMsg').textContent = '読み取れないときは「写真で読み取る」か「アドレスを貼る」をお試しください。';
    }, 180);
  } catch(e){
    $('#scanMsg').textContent = 'カメラが使えません。下の「写真で読み取る」か「アドレスを貼る」をお使いください。';
    $('#scanInfo').textContent = (e && e.name ? e.name : '') + (e && e.message ? ' / ' + e.message : '');
  }
}
function closeScan(){
  clearInterval(scanTimer); scanTimer = null; scanErr = '';
  $('#scanMsg').textContent = ''; $('#scanInfo').textContent = '';
  if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  $('#scanVideo').srcObject = null;
  $('#scan').classList.remove('show');
}
$('#scanCancel').addEventListener('click', closeScan);
$('#scanPaste').addEventListener('click', () => {
  const s = prompt('アドレス(https://… )を貼り付けてください');
  if (s) gotQR(s.trim());
});
$('#scanFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const img = new Image();
  $('#scanMsg').textContent = '写真を読み取っています…';
  img.onload = () => { const text = decodeFrom(img, img.naturalWidth, img.naturalHeight, true); URL.revokeObjectURL(img.src);
    $('#scanInfo').textContent = scanErr ? scanErr : '写真 ' + img.naturalWidth + '×' + img.naturalHeight;
    if (text) gotQR(text); else $('#scanMsg').textContent = 'この写真からはQRが読み取れませんでした。QRが大きく、まっすぐ写るように撮ってください。'; };
  img.onerror = () => { $('#scanMsg').textContent = '写真を読み込めませんでした。'; };
  img.src = URL.createObjectURL(f);
});

function gotQR(text){
  if (scanBusy || !scanCb) return;
  const err = scanCb(text);
  if (err){ $('#scanMsg').textContent = err; return; }
  scanBusy = true;
  closeScan();
}

/* ---------- ほかのアプリから渡されたアドレスを登録する ----------
   例: portal.html?regurl=<そのアプリの個人用アドレス>
   相手アプリの「入口アプリに登録」ボタンから来る。アドレスが合うときだけ、本人のスマホに保存する。
   Ver1.14.0〜:アプリID(regapp)は無くてよい。どのアプリかは、アドレスの「?」より前で見分ける
   (regapp が付いていて合えばそれを使い、合わなければアドレスで見分ける) */
function tryRegFromLink(data){
  const id = params.get('regapp'), url = params.get('regurl');
  if (!url) return;
  const clean = () => { try { history.replaceState(null, '', location.pathname); } catch(e){} };
  const list = (data.apps || []).filter(x => x.selfReg);
  const a = (id ? list.filter(x => x.id === id)[0] : null) || list.filter(x => qrFits(url, x.base))[0];
  if (!a){ alert('このアドレスのアプリは、入口アプリに登録されていないため、登録しませんでした。'); clean(); return; }
  if (!qrFits(url, a.base)){ alert('「' + a.name + '」のアドレスではないため、登録しませんでした。'); clean(); return; }
  if (confirm('「' + a.name + '」をこのスマホに登録しますか?\n\n次からは、入口アプリのボタンだけで開けます。')){
    const mine = myQR(); mine[a.id] = url; saveMyQR(mine);
    setTimeout(() => toast('「' + a.name + '」を登録しました'), 300);
  }
  clean();
}

/* ---------- 画面:登録QRが必要 ---------- */
function renderNeedReg(msg){
  badgeStop();
  $('#who').style.display = 'none';
  $('#main').innerHTML = demoBanner() + (msg ? '<div class="err">' + esc(msg) + '</div>' : '')
    + '<div class="needreg"><div class="big">🔑</div><h2>登録QRを読み取ってください</h2>'
    + '<p>このアプリは、スカイメディカルクリニックのスタッフ専用です。<br>院長からもらった「登録QR」をスマホのカメラで読み取ると使えます。</p></div>'
    + '<div class="foot"><span class="ver">' + VERSION + '</span>' + fsHtml() + '</div>';
  bindDemo();
}

/* ---------- 画面:相手アプリから登録しようとしたが、このブラウザーは未登録(Ver1.15.0〜) ----------
   iPhoneで入口アプリを「ホーム画面に追加」している人は、ここに来ることが多い
   (カメラアプリやほかのアプリから開くと、ホーム画面のスタッフアプリとは別の場所で開くため) */
function renderNeedRegFromLink(){
  badgeStop();
  $('#who').style.display = 'none';
  $('#main').innerHTML = '<div class="needreg"><div class="big">📲</div><h2>ここでは登録できませんでした</h2>'
    + '<p>この画面は、ホーム画面の「スタッフアプリ」とは別の場所で開いています。</p>'
    + '<ol><li>この画面を閉じる</li>'
    + '<li>ホーム画面の「スタッフアプリ」を開く</li>'
    + '<li>登録したいアプリ(当番など)の 📷 のボタンを押す</li>'
    + '<li>スタッフアプリの中のカメラで、QRカードを読み取る</li></ol>'
    + '<p style="margin-top:14px;font-size:calc(13.5px*var(--fs,1))">スタッフアプリをまだ使っていない人は、先に院長からもらった「登録QR」を読み取ってください。</p></div>'
    + '<div class="foot"><span class="ver">' + VERSION + '</span></div>';
}

/* ---------- 起動 ---------- */
async function start(force){
  const key = DEMO ? (demoView === 'me' ? 'demo' : demoView === 'boss' ? 'boss' : '') : getKey();
  const role = '';
  if (!key){                          // 登録QRを読んでいないスマホには、何も出さない(GASにも問い合わせない)
    if (!DEMO && params.get('regurl')){ // 相手アプリの「登録する」ボタンから来たが、このブラウザーは未登録
      try { history.replaceState(null, '', location.pathname); } catch(e){}   // 受け取ったアドレスは捨てる(保存しない・GASにも送らない)
      return renderNeedRegFromLink();
    }
    return renderNeedReg();
  }

  // まず前回の内容をすぐ出す
  const cacheId = key + '|' + role;
  let cache = null;
  try { cache = JSON.parse(ls.get(LS_CACHE) || 'null'); } catch(e){}
  if (!DEMO && cache && cache.id === cacheId && !force) renderList(cache.data);
  else if (!DEMO) $('#main').innerHTML = '<div class="loading">読み込み中…</div>';

  try {
    const data = await fetchList(key, role);
    if (!data.ok){
      if (data.error === 'badkey' || data.error === 'nokey'){
        ls.del(LS_KEY); ls.del(LS_CACHE);
        return renderNeedReg('この登録QRは使えなくなっています。院長に新しい登録QRをもらってください。');
      }
      throw new Error(data.error || 'error');
    }
    tryRegFromLink(data);
    const d = new Date();
    data._at = (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
    if (!DEMO) ls.set(LS_CACHE, JSON.stringify({ id:cacheId, data }));
    renderList(data);
  } catch(e){
    const shown = !DEMO && cache && cache.id === cacheId && !force && $('#main .list');
    if (shown){                                   // Ver3.4.22〜 出ている一覧(アイコン)はそのまま。知らせだけ足す
      if (!$('#main .netnote')){
        const d = document.createElement('div'); d.className = 'err netnote';
        d.textContent = 'いま通信できないため、前回の内容を出しています(アプリは開けます)。';
        $('#main').insertBefore(d, $('#main').firstChild);
      }
    }
    else if (cache && cache.id === cacheId) renderList(cache.data, 'いま通信できないため、前回の内容を出しています(アプリは開けます)。');
    else {
      $('#main').innerHTML = '<div class="err">読み込めませんでした。電波のよいところで「最新にする」を押してください。</div>'
         + '<div class="foot"><span class="ver">' + VERSION + '</span><button id="reload">↻ 最新にする</button></div>';
      $('#reload').addEventListener('click', () => start(true));
    }
  }
}

/* =========================================================
   Ver3.0.0〜:院長用の設定は、別のアプリ「スタッフアプリ管理」(院内のPCに置く)に分けた。
   このファイル(GitHub Pages に置く)には、設定のしくみは入っていない。
   ========================================================= */
function okColor(c){ return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : ''; }
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 1800); }
/* 前の版の設定のアドレス(portal.html?admin=1)を開いたとき */
function renderAdminMoved(){
  $('#who').style.display = 'none';

    + '<a class="btn" style="display:inline-block;text-decoration:none;margin-top:6px" href="' + esc(location.pathname) + '">スタッフの画面を開く</a></div>'
    + '<div class="foot"><span class="ver">' + VERSION + '</span></div>';
}

document.getElementById('verTop').textContent = VERSION;

/* ---------- ホーム画面アプリ(GitHub Pages に置いたときだけ) ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('portal-sw.js', { scope: './portal' }).catch(() => {});
}

if (params.get('admin')) renderAdminMoved(); else start(false);
