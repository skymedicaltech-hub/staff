  .apptitle{font-size:15px;font-weight:700;color:var(--sky-d);letter-spacing:.08em}
  .who{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);color:var(--sky-d);
       padding:5px 14px;border-radius:999px;font-size:15px}
  .who b{font-size:17px;color:var(--ink)}

  .demo{background:#FFF8D9;border:1px solid #EFD98A;color:#6A5300;border-radius:14px;padding:10px 12px;
        font-size:14px;margin-bottom:14px}
  .demo .sw{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .demo .sw button{border:1px solid #D9C064;background:#fff;color:#6A5300;border-radius:999px;padding:5px 12px;font-size:13px}
  .demo .sw button.on{background:#6A5300;color:#fff;border-color:#6A5300}
  .demo .sw button:active,.btn:active,.tabs button:active,.admlink:active,.foot button:active{opacity:.6}

  .list{display:flex;flex-direction:column;gap:12px}
  .app{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
       border-radius:18px;padding:16px;box-shadow:0 2px 6px rgba(30,60,90,.05);cursor:pointer;color:inherit;
       transition:transform .08s ease}
  .app:active{transform:scale(.98)}
  .icon{flex:0 0 56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;
        background:var(--sky-soft)}
  .body{flex:1;min-width:0}
  .name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .desc{font-size:14.5px;color:var(--sub);margin-top:2px}
  .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:700;line-height:1.6}
  .tag.new{background:var(--new);color:#fff}
  .tag.until{background:var(--until-soft);color:var(--until)}
  .tag.me{background:var(--sky-soft);color:var(--sky-d)}
  .tag.anon{background:#EEF1F3;color:#56636C}
  .arrow{flex:0 0 auto;color:#B6C1C9;font-size:22px}
  .app.locked{background:#F7F9FA}
  .app.locked .icon{filter:grayscale(1);opacity:.55}
  .app.locked .name{color:#7C8890}

  .empty{text-align:center;color:var(--sub);padding:40px 10px}
  .foot{margin-top:26px;display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:13px}
  .foot button{border:none;background:none;color:var(--sky-d);font-size:15px;padding:8px 4px}
  .foot .reset{color:#5E7383;font-size:12.5px}
  .ver{color:#5E7383}
  .updated{font-size:12.5px;color:#5E7383;text-align:center;margin-top:10px}

  .needreg{background:rgba(255,255,255,.93);border-radius:18px;padding:26px 20px;text-align:center}
  .needreg .big{font-size:44px}
  .needreg h2{font-size:20px;margin:6px 0 8px}
  .needreg p{font-size:15.5px;color:#46535C;margin:0}
  .regnote{background:rgba(255,255,255,.9);border:1px dashed #9CC3E2;border-radius:14px;padding:11px 14px;font-size:14.5px;color:#46535C;margin-bottom:12px}

  /* おしらせ(下から出る) */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,35,50,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet-bg.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 8px;font-size:19px}
  .sheet p{margin:0 0 16px;color:#46535C;font-size:16px}
  .sheet button{width:100%;padding:15px;border:none;border-radius:14px;background:var(--sky);color:#fff;font-size:17px;font-weight:700}

  .loading{text-align:center;color:var(--sub);padding:30px 0}
  .err{background:#FDEDEA;border:1px solid #F3C2B8;color:#9A2F1C;border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:12px}

  /* 院長用 設定 */
  .admin{max-width:900px}
  .admin h2{font-size:20px;margin:4px 0 10px}
  .admin .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .admin input,.admin select,.mbox input,.mbox select{font-size:16px;padding:10px 12px;border:1px solid #C9D4DC;border-radius:10px;font-family:inherit;background:#fff;color:var(--ink)}
  .btn{padding:10px 18px;border:none;border-radius:10px;background:var(--sky);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.sub{background:#fff;color:var(--sky-d);border:1px solid var(--sky)}
  .btn.del{background:#fff;color:#C0392B;border:1px solid #E3A49B}
  .btn.sm{padding:6px 12px;font-size:14px}
  .adm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .adm-top a{color:var(--sky-d);font-size:14px;text-decoration:none;background:rgba(255,255,255,.85);padding:6px 12px;border-radius:999px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:110px;padding:12px 10px;border:1px solid #BFD3E2;background:rgba(255,255,255,.8);border-radius:12px;font-size:16px;font-weight:700;color:var(--sky-d);cursor:pointer}
  .tabs button.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:14px}
  .panel .hint{font-size:13.5px;color:var(--sub);margin:0 0 12px}
  .arow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
  .arow:first-of-type{border-top:none}
  .arow .mv{display:flex;flex-direction:column;gap:3px}
  .arow .mv button{width:34px;height:26px;border:1px solid #C9D4DC;background:#fff;border-radius:7px;cursor:pointer;color:#5E7383;font-size:12px}
  .arow .mv button:disabled{opacity:.3;cursor:default}
  .arow .icon{flex:0 0 46px;height:46px;font-size:24px;border-radius:13px}
  .arow .info{flex:1;min-width:0}
  .arow .nm{font-weight:700;font-size:17px}
  .arow .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
  .chip{font-size:12px;padding:1px 8px;border-radius:999px;background:#EEF1F3;color:#56636C}
  .chip.off{background:#FDEDEA;color:#9A2F1C}
  .chip.me{background:var(--sky-soft);color:var(--sky-d)}
  .chip.warn{background:#FFF3DF;color:#B26A00}
  .srow{display:grid;grid-template-columns:1fr 130px 70px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .srow:first-of-type{border-top:none}
  .srow input[type=text]{width:100%}
  .srow label{font-size:14px;display:flex;align-items:center;gap:4px;white-space:nowrap}
  .srow .ops{display:flex;gap:6px}
  .srow.off input[type=text]{color:#9AA5AD}
  @media(max-width:560px){ .srow{display:flex;flex-wrap:wrap} .srow input[type=text]{flex:1 1 55%;width:auto} .srow select{width:118px} .srow .ops{margin-left:auto} }

  .modal-bg{position:fixed;inset:0;background:rgba(20,35,50,.4);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:24px 10px}
  .modal-bg.show{display:flex}
  .mbox{background:#fff;border-radius:18px;width:100%;max-width:620px;padding:20px}
  .mbox h3{margin:0 0 12px;font-size:19px}
  .fld{margin-bottom:12px}
  .fld>label{display:block;font-size:14px;font-weight:700;color:#46535C;margin-bottom:4px}
  .fld .note{font-size:12.5px;color:var(--sub);margin-top:3px}
  .fld input[type=text],.fld input[type=url],.fld select{width:100%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pick-ic{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .pick-ic button{width:40px;height:40px;font-size:21px;border:1px solid #DDE4E9;background:#fff;border-radius:10px;cursor:pointer}
  .pick-ic button.on{border:2px solid var(--sky);background:var(--sky-soft)}
  .pick-co{display:flex;gap:6px;flex-wrap:wrap}
  .pick-co button{border:2px solid transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:#fff;font-weight:700}
  .pick-co button.on{border-color:#22303A;box-shadow:0 0 0 2px #fff inset}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;padding:10px;border:1px solid #C9D4DC;background:#fff;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:700}
  .prev{background:#EEF5FB;border-radius:14px;padding:10px;margin-bottom:14px}
  .prev .app{cursor:default}
  .purl{border:1px solid var(--line);border-radius:12px;padding:10px;background:#FAFCFD}
  .purl .pr{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:6px}
  .purl .pr span{font-size:14px;font-weight:700}
  .purl .pr input{width:100%;font-size:14px;padding:8px 10px}
  .mfoot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
  .mfoot .r{display:flex;gap:8px;margin-left:auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22303A;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.95}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.5);z-index:40;display:none;align-items:center;justify-content:center;font-size:17px;color:var(--sky-d);font-weight:700}
  .busy.show{display:flex}
  .admlink{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:#7E909C;text-decoration:none}
  .admlink.adm-on{display:block;width:fit-content;margin:16px auto 0;font-size:15px;font-weight:700;color:var(--sky-d);background:rgba(255,255,255,.9);border:1px solid #BFD3E2;padding:10px 20px;border-radius:999px}

  /* 登録QRの印刷 */
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:#fff;border:1px solid #CCD6DD;border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;break-inside:avoid}
  .card .qr svg,.card .qr img{width:120px;height:120px;display:block}
  .card .nm{font-size:20px;font-weight:700}
  .card .rl{font-size:13px;color:var(--sub)}
  .card .how{font-size:12px;color:#46535C;margin-top:8px;line-height:1.5}
  .card .ttl{font-size:11px;letter-spacing:.1em;color:var(--sky-d)}
  @media print{
    body{background:#fff}
    header,.noprint,.skybg{display:none!important}
    .wrap{max-width:none;padding:0}
    .cards{gap:6mm}
    .card{border:1px dashed #999;border-radius:0;height:62mm}
    @page{size:A4;margin:12mm}
  }
</style>
</head>

<script>
/* =========================================================
   スカイ スタッフアプリ(入口アプリ)
   ========================================================= */
const VERSION = 'Ver1.7.0';
// GASのアドレスは、同じ場所に置く portal-config.js に書きます(このファイルには書きません)。
// portal-config.js が無い・空欄のときは、見本データで動きます。
const GAS_URL = (typeof window.PORTAL_GAS_URL === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(window.PORTAL_GAS_URL.trim())) ? window.PORTAL_GAS_URL.trim() : '';

const LS_KEY  = 'skyPortal_k';
const LS_CACHE= 'skyPortal_cache';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const params = new URLSearchParams(location.search);
const DEMO = !GAS_URL;
let demoView = 'me';   // 見本: me=登録した人 / anon=登録していない人

/* ---------- 登録(合言葉)の読み取り ---------- */
function getKey(){
  const k = params.get('k');
  if (k){ ls.set(LS_KEY, k); return k; }
  return ls.get(LS_KEY) || '';
}

/* ---------- 見本データ ---------- */
function demoData(key, role){
  const t = new Date(); const md = d => (d.getMonth()+1)+'/'+d.getDate();
  const end = new Date(t); end.setDate(end.getDate()+12);
  const staff = key === 'boss' ? { name:'見本 院長', role:'院長' } : key ? { name:'見本 花子', role:'看護師' } : null;
  const r = staff ? staff.role : role;
  const all = [
    { id:'toban', name:'当番希望', desc:'早出・CSの希望を入れる・当番表を見る', icon:'📅', color:'#2F7FC1', personal:true, target:'看護師' },
    { id:'kakidashi', name:'業務の書き出し', desc:'院長が知らない業務を教えてください(匿名)', icon:'📝', color:'#2E9E6B', personal:false, target:'全員', isNew:true, until:md(end) },
    { id:'furikaeri', name:'週1回の振り返り', desc:'土曜〜水曜に5分で答えるアンケート(匿名)', icon:'🔁', color:'#D9822B', personal:false, target:'全員' },
    { id:'hyoka', name:'スタッフ評価(自己評価)', desc:'1項目ずつ5段階でつけます', icon:'⭐', color:'#8A5CC2', personal:true, target:'全員', until:md(end) },
  ];
  const apps = all.filter(a => a.target === '全員' || a.target === r || r === '院長').map(a => Object.assign({}, a, {
    state: a.personal && !staff ? 'locked' : 'ok', url: '#demo'
  }));
  return { ok:true, staff, apps };
}

/* ---------- 一覧の取得 ---------- */
async function fetchList(key, role){
  if (DEMO) return demoData(key, role);
  const u = GAS_URL + '?action=list&k=' + encodeURIComponent(key) + '&t=' + Date.now();
  const res = await fetch(u, { cache:'no-store' });
  return await res.json();
}

/* ---------- 画面:アプリ一覧 ---------- */
function renderList(data, note){
  const who = $('#who');
  if (data.staff){
    who.innerHTML = '<b>' + esc(data.staff.name) + '</b>さん <span>' + esc(data.staff.role) + '</span>';
    who.style.display = '';
  } else {
    who.style.display = 'none';
  }

  let h = demoBanner();
  if (note) h += '<div class="err">' + note + '</div>';
  if (!data.apps || !data.apps.length){
    h += '<div class="empty">いま使えるアプリはありません</div>';
  } else {
    h += '<div class="list">';
    data.apps.forEach((a, i) => {
      const locked = a.state !== 'ok';
      const tags = [];
      if (a.isNew) tags.push('<span class="tag new">NEW</span>');
      if (a.until) tags.push('<span class="tag until">' + esc(a.until) + 'まで</span>');
      if (a.personal) tags.push('<span class="tag me">' + (locked && a.state==='locked' ? '登録した人だけ' : 'あなた専用') + '</span>');
      else tags.push('<span class="tag anon">匿名</span>');
      const bg = okColor(a.color) ? 'style="background:' + a.color + '1F"' : '';
      h += '<button class="app' + (locked ? ' locked' : '') + '" data-i="' + i + '">'
         +   '<div class="icon" ' + bg + '>' + esc(a.icon || '📱') + '</div>'
         +   '<div class="body"><div class="name">' + esc(a.name) + '</div>'
         +     (a.desc ? '<div class="desc">' + esc(a.desc) + '</div>' : '')
         +     '<div class="tags">' + tags.join('') + '</div></div>'
         +   '<div class="arrow">' + (locked ? '🔒' : '›') + '</div>'
         + '</button>';
    });
    h += '</div>';
  }
  h += '<div class="foot"><span class="ver">' + VERSION + '</span>'
     +   '<button id="reload">↻ 最新にする</button>'
     +   (data.staff ? '<button class="reset" id="reset">登録を解除</button>' : '<span></span>') + '</div>';
  if (data._at) h += '<div class="updated">' + esc(data._at) + ' の内容です</div>';
  if (data.staff && data.staff.role === '院長') h += '<a class="admlink adm-on" href="?admin=1">⚙ 院長用の設定</a>';
  $('#main').innerHTML = h;
  bindDemo();

  document.querySelectorAll('.app').forEach(b => b.addEventListener('click', () => openApp(data.apps[+b.dataset.i])));
  const al = document.querySelector('.adm-on');
  if (al && DEMO) al.addEventListener('click', e => { e.preventDefault(); demoView = 'admin'; admTab = 'apps'; renderAdmin(); window.scrollTo(0, 0); });
  $('#reload').addEventListener('click', () => start(true));
  if (data.staff) $('#reset').addEventListener('click', () => {
    if (!confirm('このスマホの登録を解除しますか?\nもう一度使うときは登録QRを読み取ります。')) return;
    ls.del(LS_KEY); ls.del(LS_CACHE);
    if (params.get('k')) { location.href = location.pathname; return; }
    start(true);
  });
}

function openApp(a){
  if (a.state === 'locked'){
    return showSheet('登録した人だけのアプリです',
      'このアプリは、一人ずつの画面になります。院長からもらった「登録QR」をスマホで読み取ってから開いてください。');
  }
  if (a.state === 'nourl'){
    return showSheet('準備中です', 'あなた用のページがまだ用意されていません。院長にお知らせください。');
  }
  if (DEMO) return showSheet('見本です', '「' + a.name + '」が開きます(見本なので開きません)。'
      + (a.personal ? 'このアプリは、その人専用のページが開きます。' : '匿名のアプリなので、名前などは一切渡さずに開きます。'));
  location.href = a.url;
}

/* ---------- 見本の切り替え ---------- */
function demoBanner(){
  if (!DEMO) return '';
  return '<div class="demo noprint">見本データで表示しています(GASがまだつながっていません)。'
    + '<div class="sw"><button data-v="me" class="' + (demoView==='me'?'on':'') + '">登録した人の見え方</button>'
    + '<button data-v="anon" class="' + (demoView==='anon'?'on':'') + '">登録していないスマホの見え方</button>'
    + '<button data-v="boss" class="' + (demoView==='boss'?'on':'') + '">院長の見え方</button>'
    + '<button data-v="admin" class="' + (demoView==='admin'?'on':'') + '">院長用の設定</button></div></div>';
}
function bindDemo(){
  document.querySelectorAll('.demo .sw button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.v === 'admin'){ demoView = 'admin'; admTab = 'apps'; renderAdmin(); window.scrollTo(0, 0); return; }
    $('#main').classList.remove('admin'); demoView = b.dataset.v; start(true);
  }));
}

/* ---------- おしらせ ---------- */
function showSheet(t, x){
  $('#sheetTitle').textContent = t; $('#sheetText').textContent = x;
  $('#sheetBg').classList.add('show');
}
$('#sheetOk').addEventListener('click', () => $('#sheetBg').classList.remove('show'));
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') $('#sheetBg').classList.remove('show'); });

/* ---------- 画面:登録QRが必要 ---------- */
function renderNeedReg(msg){
  $('#who').style.display = 'none';
  $('#main').innerHTML = demoBanner() + (msg ? '<div class="err">' + esc(msg) + '</div>' : '')
    + '<div class="needreg"><div class="big">🔑</div><h2>登録QRを読み取ってください</h2>'
    + '<p>このアプリは、スカイメディカルクリニックのスタッフ専用です。<br>院長からもらった「登録QR」をスマホのカメラで読み取ると使えます。</p></div>'
    + '<div class="foot"><span class="ver">' + VERSION + '</span></div>';
  bindDemo();
}

/* ---------- 起動 ---------- */
async function start(force){
  const key = DEMO ? (demoView === 'me' ? 'demo' : demoView === 'boss' ? 'boss' : '') : getKey();
  const role = '';
  if (!key) return renderNeedReg();   // 登録QRを読んでいないスマホには、何も出さない(GASにも問い合わせない)

  // まず前回の内容をすぐ出す
  const cacheId = key + '|' + role;
  let cache = null;
  try { cache = JSON.parse(ls.get(LS_CACHE) || 'null'); } catch(e){}
  if (!DEMO && cache && cache.id === cacheId && !force) renderList(cache.data);
  else if (!DEMO) $('#main').innerHTML = '<div class="loading">読み込み中…</div>';

  try {
    const data = await fetchList(key, role);
    if (!data.ok){
      if (data.error === 'badkey' || data.error === 'nokey'){
        ls.del(LS_KEY); ls.del(LS_CACHE);
        return renderNeedReg('この登録QRは使えなくなっています。院長に新しい登録QRをもらってください。');
      }
      throw new Error(data.error || 'error');
    }
    const d = new Date();
    data._at = (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
    if (!DEMO) ls.set(LS_CACHE, JSON.stringify({ id:cacheId, data }));
    renderList(data);
  } catch(e){
    if (cache && cache.id === cacheId) renderList(cache.data, '通信できなかったため、前回の内容を出しています。');
    else {
      $('#main').innerHTML = '<div class="err">読み込めませんでした。電波のよいところで「最新にする」を押してください。</div>'
         + '<div class="foot"><span class="ver">' + VERSION + '</span><button id="reload">↻ 最新にする</button></div>';
      $('#reload').addEventListener('click', () => start(true));
    }
  }
}

async function loadAdmin(pw){
  $('#main').innerHTML = '<div class="loading">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'admin', pw:pw }) });
    const d = await res.json();
    if (!d.ok){
      try { sessionStorage.removeItem('skyPortal_pw'); } catch(e){}
      return drawLogin(ADMIN_ERR[d.error] || '読み込めませんでした。');
    }
    ADM = d; ADM_PW = pw; try { sessionStorage.setItem('skyPortal_pw', pw); } catch(e){}
    drawAdmin();
  } catch(e){ drawLogin('読み込めませんでした。電波を確かめてください。'); }
}

async function saveAdmin(msg){
  if (DEMO){ ADM.staff.forEach(s => { if (!s.k) s.k = 'demo' + Math.random().toString(36).slice(2, 8); }); drawAdmin(); toast('見本なので保存はされません'); return true; }
  busy(true);
  try {
    const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'save', pw:ADM_PW, apps:ADM.apps, staff:ADM.staff, purl:ADM.purl }) });
    const d = await res.json();
    if (!d.ok) throw new Error(ADMIN_ERR[d.error] || d.error || 'error');
    ADM = d; drawAdmin(); toast(msg || '保存しました'); return true;
  } catch(e){
    alert('保存できませんでした。もう一度お試しください。\n(' + e.message + ')');
    return false;
  } finally { busy(false); }
}

function appStatus(a){
  const today = new Date(); const t = today.getFullYear() + '-' + ('0'+(today.getMonth()+1)).slice(-2) + '-' + ('0'+today.getDate()).slice(-2);
  if (!a.show) return '<span class="chip off">非表示</span>';
  if (a.from && t < a.from) return '<span class="chip warn">' + fmtMD(a.from) + 'から公開</span>';
  if (a.until && t > a.until) return '<span class="chip off">公開終了</span>';
  return a.until ? '<span class="chip warn">' + fmtMD(a.until) + 'まで</span>' : '<span class="chip">公開中</span>';
}

      + '<button data-dn="' + i + '"' + (i === L.length - 1 ? ' disabled' : '') + '>▼</button></div>'

  const m = $('#modalBg');
  const prevHtml = () => {
    const bg = okColor(a.color) ? 'style="background:' + a.color + '1F"' : '';

  };

    const staffList = ADM.staff.filter(s => s.active && (a.target === '全員' || s.role === a.target || s.role === '院長'));
    m.innerHTML = '<div class="mbox">'
      + '<h3>' + (isNew ? 'アプリを追加' : 'アプリを編集') + '</h3>'
      + '<div class="prev" id="m_prev">' + prevHtml() + '</div>'

      + '<div class="fld"><label>アプリ名</label><input type="text" id="f_name" value="' + esc(a.name) + '" placeholder="例:当番希望"></div>'
      + '<div class="fld"><label>説明(ボタンの小さい文字)</label><input type="text" id="f_desc" value="' + esc(a.desc) + '" placeholder="例:早出・CSの希望を入れる"></div>'
      + '<div class="fld"><label>アイコン</label><div class="row" style="margin:0"><input type="text" id="f_icon" value="' + esc(a.icon) + '" style="width:80px;text-align:center;font-size:22px">'
      +   '<span class="note" style="font-size:12.5px;color:#66737C">下から選ぶか、絵文字を入れてください</span></div>'
      +   '<div class="pick-ic">' + ICONS.map(ic => '<button data-ic="' + ic + '" class="' + (a.icon === ic ? 'on' : '') + '">' + ic + '</button>').join('') + '</div></div>'
      + '<div class="fld"><label>色</label><div class="pick-co">' + COLORS.map(c => '<button data-co="' + c[0] + '" style="background:' + c[0] + '" class="' + (a.color === c[0] ? 'on' : '') + '">' + c[1] + '</button>').join('') + '</div></div>'
      + '<div class="fld"><label>使う人</label><div class="seg" id="f_target">' + TARGETS.map(t => '<button data-v="' + t + '" class="' + (a.target === t ? 'on' : '') + '">' + t + '</button>').join('') + '</div></div>'
      + '<div class="fld"><label>本人確認</label><div class="seg" id="f_personal">'
      +   '<button data-v="0" class="' + (!a.personal ? 'on' : '') + '">なし(匿名)</button><button data-v="1" class="' + (a.personal ? 'on' : '') + '">あり(本人専用)</button></div>'
      +   '<div class="note">「なし」は名前などを一切渡さずに開きます。「あり」は登録QRで登録した人だけが使えます。</div></div>'
      + '<div class="fld"><label>' + (a.personal ? '共通のアドレス(URL)' : 'アドレス(URL)') + '</label><input type="url" id="f_url" value="' + esc(a.url) + '" placeholder="https://…">'
      +   (a.personal ? '<div class="note">下の「一人ずつのアドレス」が空欄の人は、このアドレスが開きます。アプリの中で名前を選ぶ方式なら、ここだけ入れれば十分です。</div>' : '') + '</div>'
      + (a.personal ? '<div class="fld"><label>一人ずつのアドレス(個人用のQRがあるアプリだけ)</label><div class="purl">'
          + (staffList.length ? staffList.map((s, j) => '<div class="pr"><span>' + esc(s.name) + '</span><input type="url" data-pn="' + esc(s.name) + '" value="' + esc(purl[s.name] || '') + '" placeholder="空欄なら共通のアドレス"></div>').join('')
                              : '<div class="note">対象のスタッフがいません(「スタッフ」で登録します)</div>')
          + '</div></div>' : '')
      + '<div class="fld"><label>公開する期間(空欄ならずっと)</label><div class="two">'
      +   '<input type="date" id="f_from" value="' + esc(a.from) + '"><input type="date" id="f_until" value="' + esc(a.until) + '"></div>'
      +   '<div class="note">左:この日から出す / 右:この日まで出す(終わると自動で消えます)</div></div>'
      + '<div class="fld"><label style="display:flex;align-items:center;gap:8px;font-size:16px"><input type="checkbox" id="f_show"' + (a.show ? ' checked' : '') + ' style="width:22px;height:22px"> スタッフのスマホに出す</label></div>'
      + '<div class="mfoot">' + (isNew ? '' : '<button class="btn del" id="m_del">削除</button>')
      +   '<div class="r"><button class="btn sub" id="m_cancel">やめる</button><button class="btn" id="m_save">保存</button></div></div>'
      + '</div>';

    const sync = () => {
      a.name = $('#f_name').value.trim(); a.desc = $('#f_desc').value.trim(); a.icon = $('#f_icon').value.trim();
      a.url = $('#f_url').value.trim(); a.from = $('#f_from').value; a.until = $('#f_until').value; a.show = $('#f_show').checked;
      m.querySelectorAll('[data-pn]').forEach(inp => purl[inp.dataset.pn] = inp.value.trim());
    };
    m.querySelectorAll('[data-ic]').forEach(b => b.addEventListener('click', () => { sync(); a.icon = b.dataset.ic; redraw2(); }));
    m.querySelectorAll('[data-co]').forEach(b => b.addEventListener('click', () => { sync(); a.color = b.dataset.co; redraw2(); }));
    m.querySelectorAll('#f_target button').forEach(b => b.addEventListener('click', () => { sync(); a.target = b.dataset.v; redraw2(); }));
    m.querySelectorAll('#f_personal button').forEach(b => b.addEventListener('click', () => { sync(); a.personal = b.dataset.v === '1'; redraw2(); }));
    function redraw2(){ const y = m.scrollTop; draw(); m.scrollTop = y; }
    ['#f_name','#f_desc','#f_icon','#f_until'].forEach(s => $(s).addEventListener('input', () => { sync(); $('#m_prev').innerHTML = prevHtml(); }));
    $('#m_cancel').addEventListener('click', () => m.classList.remove('show'));
    if (!isNew) $('#m_del').addEventListener('click', () => {
      if (!confirm('「' + ADM.apps[idx].name + '」を削除しますか?\n(一時的に隠すだけなら「スタッフのスマホに出す」のチェックを外してください)')) return;
      const id = ADM.apps[idx].id;
      ADM.apps.splice(idx, 1); ADM.purl = ADM.purl.filter(p => p.id !== id);
      m.classList.remove('show'); saveAdmin('削除しました');
    });
    $('#m_save').addEventListener('click', async () => {
      sync();
      if (!a.name) return alert('アプリ名を入れてください');
      if (a.url && !/^https:\/\/\S+$/.test(a.url)) return alert('アドレスは https:// で始まる形で入れてください');
      if (!a.personal && !a.url) return alert('アドレス(URL)を入れてください');
      if (a.from && a.until && a.from > a.until) return alert('公開する期間の日付が逆になっています');
      for (const n in purl) if (purl[n] && !/^https:\/\/\S+$/.test(purl[n])) return alert(n + ' さんのアドレスは https:// で始まる形で入れてください');
      if (isNew){ a.id = 'a' + Date.now().toString(36); ADM.apps.push(a); }
      else ADM.apps[idx] = a;
      ADM.purl = ADM.purl.filter(p => p.id !== a.id);
      if (a.personal) for (const n in purl) if (purl[n]) ADM.purl.push({ name:n, id:a.id, url:purl[n] });
      m.classList.remove('show');
      await saveAdmin(isNew ? '追加しました' : '保存しました');
    });
  };
  draw();
  m.classList.add('show'); m.scrollTop = 0;
}

/* ---------- スタッフ ---------- */
function drawStaff(){
  const L = ADM.staff;
  let h = '<div class="panel"><p class="hint">名前・職種を変えると、その場で保存されます。職種を「院長」にした人の登録QRで開いたスマホにだけ、「院長用の設定」ボタンが出ます。辞めた人は「在籍」のチェックを外すと、登録QRが使えなくなります。</p>'
    + '<div class="row"><input type="text" id="n_name" placeholder="名前(例:山田 花子)" style="flex:1;min-width:160px">'
    + '<select id="n_role">' + STAFF_ROLES.map(r => '<option>' + r + '</option>').join('') + '</select>'
    + '<button class="btn" id="n_add">＋ 追加</button></div>';
  L.forEach((s, i) => {
    h += '<div class="srow' + (s.active ? '' : ' off') + '"><input type="text" data-nm="' + i + '" value="' + esc(s.name) + '">'
      + '<select data-rl="' + i + '">' + STAFF_ROLES.map(r => '<option' + (s.role === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>'
      + '<label><input type="checkbox" data-ac="' + i + '"' + (s.active ? ' checked' : '') + '>在籍</label>'
      + '<div class="ops"><button class="btn sub sm" data-rk="' + i + '">QRを作り直す</button><button class="btn del sm" data-dl="' + i + '">削除</button></div></div>';
  });
  if (!L.length) h += '<div class="empty">まだスタッフがいません</div>';
  h += '</div>';
  $('#admBody').innerHTML = h;

  const add = () => {
    const n = $('#n_name').value.trim(); if (!n) return $('#n_name').focus();
    if (L.some(s => s.name === n)) return alert('同じ名前の人がいます。名前を少し変えてください(例:山田 花子A)');
    L.push({ name:n, role:$('#n_role').value, k:'', active:true });
    saveAdmin(n + ' さんを追加しました').then(() => { const e = $('#n_name'); if (e) e.focus(); });
  };
  $('#n_add').addEventListener('click', add);
  $('#n_name').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  document.querySelectorAll('[data-nm]').forEach(inp => inp.addEventListener('change', () => {
    const s = L[+inp.dataset.nm], old = s.name, n = inp.value.trim();
    if (!n || L.some(x => x !== s && x.name === n)){ inp.value = old; return alert(n ? '同じ名前の人がいます' : '名前を入れてください'); }
    s.name = n; ADM.purl.forEach(p => { if (p.name === old) p.name = n; });
    saveAdmin();
  }));
  document.querySelectorAll('[data-rl]').forEach(sel => sel.addEventListener('change', () => { L[+sel.dataset.rl].role = sel.value; saveAdmin(); }));
  document.querySelectorAll('[data-ac]').forEach(cb => cb.addEventListener('change', () => { L[+cb.dataset.ac].active = cb.checked; saveAdmin(); }));
  document.querySelectorAll('[data-rk]').forEach(b => b.addEventListener('click', () => {
    const s = L[+b.dataset.rk];
    if (!confirm(s.name + ' さんの登録QRを作り直しますか?\n今のQRは使えなくなり、新しいQRを印刷して渡す必要があります。')) return;
    s.k = ''; saveAdmin('作り直しました。「登録QRの印刷」から印刷してください');
  }));
  document.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => {
    const s = L[+b.dataset.dl];
    if (!confirm(s.name + ' さんを削除しますか?\n(辞めた人は「在籍」のチェックを外すだけでも使えなくなります)')) return;
    L.splice(+b.dataset.dl, 1); ADM.purl = ADM.purl.filter(p => p.name !== s.name);
    saveAdmin('削除しました');
  }));
}

/* ---------- 登録QRの印刷 ---------- */
function drawQR(){
  const list0 = ADM.staff.filter(s => s.active && s.k);
  const roles = [...new Set(list0.map(s => s.role).filter(Boolean))];
  let h = '<div class="panel noprint"><div class="row">'
    + '<select id="selRole"><option value="">全員(' + list0.length + '人)</option>' + roles.map(r => '<option>' + esc(r) + '</option>').join('') + '</select>'
    + '<select id="selName"><option value="">— 一人だけ印刷するとき —</option>' + list0.map((s, i) => '<option value="' + i + '">' + esc(s.name) + '</option>').join('') + '</select>'
    + '<button class="btn" id="print">印刷する</button></div>'
    + '<p class="hint" style="margin:0">登録QRは本人だけに渡してください(ほかの人が読むと、その人として登録されます)。なくしたときは「スタッフ」の「QRを作り直す」で新しくできます。</p></div>'
    + '<div id="qrOut" style="margin-top:12px"></div>';
  $('#admBody').innerHTML = h;
  const draw = () => {
    const r = $('#selRole').value, n = $('#selName').value;
    const list = list0.filter((s, i) => n !== '' ? String(i) === n : (!r || s.role === r));
    $('#qrOut').innerHTML = list.length ? '<div class="cards">' + list.map(s => {
      const url = portalBase() + '?k=' + encodeURIComponent(s.k);
      return '<div class="card"><div class="qr">' + qrSvg(url) + '</div><div>'
        + '<div class="ttl">スタッフアプリ 登録QR</div>'
        + '<div class="nm">' + esc(s.name) + ' さん</div><div class="rl">' + esc(s.role) + '</div>'
        + '<div class="how">① スマホのカメラで読み取る<br>② 開いたページを「ホーム画面に追加」<br>③ 次からはホーム画面のアイコンから開く<br>※ 本人専用です。人に見せないでください</div>'
        + '</div></div>';
    }).join('') + '</div>' : '<div class="empty">印刷する人がいません</div>';
  };
  $('#selRole').addEventListener('change', () => { $('#selName').value = ''; draw(); });
  $('#selName').addEventListener('change', draw);
  $('#print').addEventListener('click', () => window.print());
  draw();
}

function qrSvg(text){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

/* ---------- ホーム画面アプリ(GitHub Pages に置いたときだけ) ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('portal-sw.js', { scope: './portal' }).catch(() => {});
}

/* ---------- 開始 ---------- */
if (params.get('admin')) renderAdmin(); else start(false);
</script>
