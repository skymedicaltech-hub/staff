const changedSlot = (ds, t) => D.changes.some(c => c.state === 'done' && ((c.ds === ds && c.slot === t) || (c.kind === 'swap' && c.ds2 === ds && c.slot2 === t)));
const otherCS = t => t === 'C' ? 'C2' : t === 'C2' ? 'C' : null;
function days(ym){ return Object.keys((D.roster.find(x => x.ym === ym) || {data:{}}).data.days || {}).sort(); }

/* ---------- 画面 ---------- */
function render(){
  const nIn = waitIn().length;
  let h = '<div class="head"><div class="hello"><span><b>'+esc(D.me.name)+'</b> さん'+(D.me.test ? '<span class="tst">テスト用</span>' : D.me.viewer ? '<span class="tst">'+(D.me.adm ? 'アプリ管理者用' : '見るだけ')+'</span>' : '')+'</span><button class="reload" id="reload" style="white-space:nowrap;flex-shrink:0">↻ 更新する</button></div>';
  if (DM.stale) h += '<div class="stale" style="margin:10px 4px 0;padding:8px 11px;border-radius:10px;background:#FFF6DD;color:#7A5B00;font-size:12.5px;line-height:1.6">'+(DM.staleFail ? 'つながりませんでした。前に見た当番表（'+esc(rcWhen(DM.stale))+'）を出しています。「更新する」を押してください。' : '更新中…')+'</div>';
  if (tab === 'roster') h += rosterHead();
  h += '</div>';
  h += tab === 'roster' ? rosterBody() : reqBody();
  h += '<div class="ver">当番 Ver'+APP_VER+'</div>';
  document.getElementById('rApp').innerHTML = h;
  bind(); navBadge(nIn);
}
function sideHtml(){
  if (!DM.other) return '';
  const L = DM.clerk ? ['事務','看護師'] : ['看護師','事務'];
  return '<div class="seg side"><button data-side="0" class="'+(side?'':'on')+'">'+L[0]+'の当番表</button><button data-side="1" class="'+(side?'on':'')+'">'+L[1]+'の当番表</button></div>';
}
function rosterHead(){
  if (!D.roster.length) return sideHtml();
  const m = month(), y = +m.ym.slice(0,4), mo = +m.ym.slice(5,7);
  let e = 0, c = 0; days(m.ym).forEach(ds => SL.forEach(t => { if (holder(ds,t) === D.me.id){ if (t === 'E') e++; else c++; } }));
  let h = '<div class="month"><div class="t"><span class="m">'+mo+'<small>月</small></span><span class="y">'+y+'</span></div>'
    + '<div class="arrows"><button id="prev" '+(mi<=0?'disabled':'')+'>‹</button><button id="next" '+(mi>=D.roster.length-1?'disabled':'')+'>›</button></div></div>';
  h = sideHtml() + h;
  if (D.ro && DM.stale && !DM.viewer && !side) return h;
  if (D.ro) return h + '<div class="filter"><span style="font-size:13px;color:var(--sub)">見るだけです（変えられません）</span></div>';
  h += '<div class="sum"><div><span class="E">自分の早出</span><span><span class="num">'+e+'</span> 回</span></div><div><span class="C">自分の'+SNAME.C+'</span><span><span class="num">'+c+'</span> 回</span></div></div>';
  h += '<div class="filter"><span></span><label class="sw'+(onlyMe?' on':'')+'" id="onlyMe"><i></i>自分の当番だけ</label></div>';
  return h;
}
function rosterBody(){
  if (!D.roster.length) return '<div class="msg"><div class="big2">まだ当番表がありません</div></div>';
  if (onlyMe) return calBody();
  let h = '';
  const nIn = waitIn().length;
  if (nIn) h += '<div class="alert"><span>申し込みが <b>'+nIn+'件</b> 届いています</span><button data-tab="req">見る</button></div>';
  h += '<div class="list">';
  let shown = 0;
  const nPast = days(month().ym).filter(ds => ds < D.today).length, hidePast = !showPast && month().ym === D.today.slice(0,7) && nPast > 0;
  if (hidePast) h += '<button class="pick" id="showPast" style="justify-content:center;color:var(--sub);font-size:13px">過ぎた日も見る（'+nPast+'日）</button>';
  days(month().ym).forEach(ds => {
    const d = dayOf(ds), past = ds < D.today;
    if (past && hidePast) return;
    const mine = SL.some(t => holder(ds,t) === D.me.id);
    if (onlyMe && !mine) return;
    const slots = SL.filter(t => d[KEYS[t][0]] !== undefined);
    if (!slots.length) return;
    shown++;
    const w = pd(ds).getDay();
    h += '<div class="day'+(past?' past':'')+(ds===D.today?' today':'')+'"><div class="dt s'+w+'"><span class="num">'+(+ds.slice(8,10))+'</span><span class="w">'+DOW[w]+'</span></div><div class="slots">';
    const chip = t => {
      const id = holder(ds,t), nm = holderName(ds,t), me = id === D.me.id, tap = !D.ro && !past && (D.clerk || !!id);
      const isSel = sel && sel.ds === ds && sel.t === t, cand = sel && !isSel && !!pairOf(sel, ds, t);
      return '<button class="sl'+(me?' mine':'')+(isSel?' sel':'')+(cand?' cand':'')+(sel && !isSel && !cand?' dim':'')+(id?'':' empty')+'" '+(tap?'data-ds="'+ds+'" data-t="'+t+'"':'disabled')+'><span class="k '+TY(t)+'">'+SNAME[t]+'</span>'+(id?esc(nm):(D.clerk?'未定':'なし'))
        + (pendingOn(ds,t) ? '<span class="ch" style="color:var(--warn)" title="申し込み中">待</span>' : changedSlot(ds,t) ? '<span class="ch">⇄</span>' : '') + '</button>';
    };
    const gE = slots.filter(t => t === 'E'), gC = slots.filter(t => t !== 'E');
    h += '<div class="gE">'+gE.map(chip).join('')+'</div><div class="gC">'+gC.map(chip).join('')+'</div>';
    h += '</div>'+cmtHtml(ds)+'</div>';
  });
  if (!shown) h += '<div class="none">'+(onlyMe?'この月は、あなたの当番はありません。':'この月の当番はありません。')+'</div>';
  h += (D.ro ? '' : D.clerk ? '<p class="hint">当番を押すと、入れる人をえらべます。内視鏡カレンダーにも同じ内容が出ます。</p>' : '<p class="hint"><b>交換</b>：自分の当番と相手の当番を、1回ずつ押す<br><b>代わってもらう／代わってあげる</b>：当番を2回つづけて押す</p>')+'</div>';
  if (sel) h += '<div class="selbar" id="selbar">'+SNAME[sel.t]+' '+md(sel.ds)+' をえらびました。交換できる当番（青い枠）を押してください。<span>やめる ✕</span></div>';
  return h;
}
/* 「自分の当番だけ」：自分の当番をカレンダー（月表示）で見せる */
function calBody(){
  const ym = month().ym, y = +ym.slice(0,4), m = +ym.slice(5,7), last = new Date(y, m, 0).getDate();
  let h = '<div class="list"><div class="mcal"><div class="mwk">'+DOW.map((x,i) => '<div class="s'+i+'">'+x+'</div>').join('')+'</div><div class="mgrid">';
  for (let i = 0; i < new Date(y, m-1, 1).getDay(); i++) h += '<div class="mc blank"></div>';
  let n = 0;
  for (let d = 1; d <= last; d++){
    const ds = ym+'-'+('0'+d).slice(-2), w = pd(ds).getDay(), day = dayOf(ds);
    const e = day && holder(ds,'E') === D.me.id, c = day && (holder(ds,'C') === D.me.id || holder(ds,'C2') === D.me.id);
    if (e || c) n++;
    const cm = cmtOf(ds), dot = cm ? '<span class="mcm" style="background:'+(cm.important && cm.important.length ? (CM_COLOR[cm.important[0].color]||CM_COLOR.black) : '#9FB3C2')+'"></span>' : '';
    h += '<div class="mc s'+w+(day?'':' none')+(e||c?' on':'')+(ds<D.today?' past':'')+(ds===D.today?' today':'')+'"><span class="mn">'+d+'</span>'
      + (e ? '<span class="mt E">早出</span>' : '') + (c ? '<span class="mt C">'+SNAME.C+'</span>' : '') + dot + '</div>';
  }
  h += '</div></div>';
  if (!n) h += '<div class="none" style="margin-top:10px">この月は、あなたの当番はありません。</div>';
  const cds = Object.keys(D.comments || {}).filter(ds => ds.slice(0,7) === ym).sort();
  if (cds.length) h += '<div class="h2">この月のコメント</div><div class="box">' + cds.map(ds => '<div class="cmrow"><span class="cmd">'+md(ds)+'</span>'+cmtHtml(ds)+'</div>').join('') + '</div>';
  h += (D.clerk ? '' : '<p class="hint">交換や代わりをするときは、「自分の当番だけ」を切って一覧から押してください。</p>')+'</div>';
  return h;
}
/* 内視鏡カレンダーの「この日のコメント」（見るだけ）。重要コメントはカレンダーと同じ色 */
const CM_COLOR = {red:'#D2484A', blue:'#287FB8', black:'#1E2833'};
const cmtOf = ds => (D.comments || {})[ds];
function cmtHtml(ds){
  const c = cmtOf(ds); if (!c) return '';
  return '<div class="dcm">' + (c.important || []).map(x => '<div class="cmi" style="color:'+(CM_COLOR[x.color]||CM_COLOR.black)+'">'+esc(x.text)+'</div>').join('')
    + (c.normal || []).map(t => '<div class="cmn">'+esc(t)+'</div>').join('') + '</div>';
}
function pillHtml(ds, t){ return '<span class="pill"><span class="k '+TY(t)+'">'+SNAME[t]+'</span>'+md(ds)+'</span>'; }
/* あなたから見て、入る当番・外れる当番 */
function effect(c, who){
  const inS = [], outS = [];
  if (c.kind === 'swap'){ if (who === c.to){ inS.push([c.ds,c.slot]); outS.push([c.ds2,c.slot2]); } else { inS.push([c.ds2,c.slot2]); outS.push([c.ds,c.slot]); } }
  else if (c.kind === 'give' || c.kind === 'cal'){ (who === c.to ? inS : outS).push([c.ds,c.slot]); }
  else { (who === c.from ? inS : outS).push([c.ds,c.slot]); }
  return {inS, outS};
}
function effHtml(c, who){
  const f = effect(c, who); let h = '';
  if (f.inS.length) h += '<div class="ln"><span class="lb">入る</span>'+f.inS.map(x => pillHtml(x[0],x[1])).join('')+'</div>';
  if (f.outS.length) h += '<div class="ln" style="margin-bottom:0"><span class="lb">外れる</span>'+f.outS.map(x => pillHtml(x[0],x[1])).join('')+'</div>';
  return h;
}
function reqCard(c, mode){
  const open = c.kind === 'give' && !c.to;
  const other = c.from === D.me.id ? c.toName : c.fromName;
  if (c.kind === 'cal') return '<div class="box req"><div class="who">内視鏡カレンダーで交代しました</div><div class="what" style="display:block">'+effHtml(c, D.me.id)+'</div><div class="st done">'+(c.from===D.me.id?esc(c.toName||'なし')+' さんに':esc(c.fromName||'なし')+' さんから')+'</div></div>';
  const who = open ? (mode === 'in' ? '<b>'+esc(c.fromName)+'</b> さんが、代わってくれる人をさがしています' : '代わってくれる人をさがしています（みんなに）') : '<b>'+esc(other)+'</b> さん'+(mode==='in'?'から':'と');
  let h = '<div class="box req"><div class="who">'+who+'</div><div class="what" style="display:block">'+effHtml(open && mode === 'in' ? Object.assign({}, c, {to:D.me.id}) : c, D.me.id)+'</div>';
  if (mode === 'in' && open) h += '<div class="btns"><button class="b-ok" data-ans="'+c.id+'" data-yes="1">代わる</button></div>';
  else if (mode === 'in') h += '<div class="btns"><button class="b-no" data-ans="'+c.id+'" data-yes="0">お断り</button><button class="b-ok" data-ans="'+c.id+'" data-yes="1">OK</button></div>';
  else if (mode === 'out') h += '<div class="st wait">返事待ち</div><div class="btns"><button class="b-x" data-cancel="'+c.id+'">取り消す</button></div>';
  else h += '<div class="st '+c.state+'">'+ST[c.state]+'</div>'+(c.why?'<div class="why">'+esc(c.why)+'</div>':'');
  return h + '</div>';
}
function reqBody(){
  const ins = waitIn(), outs = waitOut();
  const past = D.changes.filter(c => c.state !== 'wait' && (c.from === D.me.id || c.to === D.me.id)).sort((a,b) => (b.ansAt||b.at) < (a.ansAt||a.at) ? -1 : 1).slice(0, 10);
  let h = '<div class="list">';
  h += '<div class="h2">届いた申し込み</div>' + (ins.length ? ins.map(c => reqCard(c,'in')).join('') : '<div class="none">ありません</div>');
  if (outs.length) h += '<div class="h2">送った申し込み</div>' + outs.map(c => reqCard(c,'out')).join('');
  if (past.length) h += '<div class="h2">これまで</div>' + past.map(c => reqCard(c,'log')).join('');
  h += '<p class="hint">相手が「OK」を押すと、すぐに当番表が変わります。</p></div>';
  return h;
}

function bind(){
  const $ = id => document.getElementById(id);
  $('reload').onclick = () => { $('reload').textContent = '…'; load(false); };
  document.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { const ym = D.roster[mi] ? D.roster[mi].ym : ''; setSide(+b.dataset.side, ym); render(); });
  document.querySelectorAll('#rApp [data-tab]').forEach(b => b.onclick = () => goTab(b.dataset.tab));
  if ($('prev')) $('prev').onclick = () => { mi--; render(); };
  if ($('next')) $('next').onclick = () => { mi++; render(); };
  if ($('onlyMe')) $('onlyMe').onclick = () => { onlyMe = !onlyMe; render(); };
  if ($('showPast')) $('showPast').onclick = () => { showPast = true; render(); };
  document.querySelectorAll('.sl[data-ds]').forEach(b => b.onclick = () => tapSlot(b.dataset.ds, b.dataset.t));
  /* 出たばかりの帯は押せないようにする（画面の下のほうの当番を2回つづけて押すとき、2回目が帯に当たらないように） */
  const bar = $('selbar'); if (bar){ bar.style.pointerEvents = 'none'; setTimeout(() => { bar.style.pointerEvents = ''; }, 450); bar.onclick = () => { sel = null; render(); }; }
  document.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => answer(b.dataset.ans, b.dataset.yes === '1'));
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancel(b.dataset.cancel));
}

/* ---------- 下から出る画面 ---------- */
function sheet(html){
  const s = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
  s.innerHTML = html; s.classList.add('show'); bg.classList.add('show'); s.scrollTop = 0;
  bg.onclick = closeSheet;
  s.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  return s;
}
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); document.getElementById('sheetBg').classList.remove('show'); }

/* ---------- 当番を押したとき ----------
   1回押す：その当番をえらぶ（交換できる当番だけが明るくなる）→ もう1つ押すと「交換」を確かめてから申し込む
   2回つづけて押す：自分の当番なら「代わってもらう」（みんなに出す）、相手の当番なら「代わってあげる」 */
let sel = null, lastTap = {k:'', t:0}, swapTimer = null;
/* えらんだ当番 a と、当番 b を交換できるか（できるなら申し込みの中身を返す） */
function pairOf(a, ds, t){
  if (!a || (a.ds === ds && a.t === t)) return null;
  if (ds < D.today || pendingOn(ds, t)) return null;
  const ia = holder(a.ds, a.t), ib = holder(ds, t);
  if (!ib || (ia === D.me.id) === (ib === D.me.id)) return null;   /* 自分の当番と相手の当番の組み合わせだけ */
  if (TY(a.t) !== TY(t) || a.ds === ds) return null;
  const m = ia === D.me.id ? {ds:a.ds, slot:a.t, ds2:ds, slot2:t} : {ds, slot:t, ds2:a.ds, slot2:a.t};
  const other = holder(m.ds2, m.slot2);
  if (otherCS(m.slot) && holder(m.ds, otherCS(m.slot)) === other) return null;
  if (otherCS(m.slot2) && holder(m.ds2, otherCS(m.slot2)) === D.me.id) return null;
  if (!dowOK(nurse(other), m.ds, m.slot) || !dowOK(D.me, m.ds2, m.slot2)) return null;   /* 入れない曜日には交換できない */
  return Object.assign({kind:'swap', to:other, toName:holderName(m.ds2, m.slot2)}, m);
}
/* 事務の人：当番を押すと、入れる人をえらぶ画面が出る（事務の人なら、だれの名前でも入れられる） */
function pickClerk(ds, t){
  const el = document.getElementById('confirm'), cur = holder(ds,t) || '';
  const offDay = !!(dayOf(ds) || {}).off;   /* Ver11.3.0：休診日は、未定にもどすことだけできる */
  const list = offDay ? [] : D.nurses.slice().sort((a,b) => (a.id === D.me.id ? -1 : b.id === D.me.id ? 1 : 0));
  el.innerHTML = '<div class="ct">'+md(ds)+' の'+SNAME[t]+(offDay ? '（休診日）' : '')+'</div><div class="pick">'
    + list.map(n => '<button data-id="'+esc(n.id)+'" class="'+(n.id === cur ? 'on' : '')+'">'+esc(n.name)+(n.id === D.me.id ? '（自分）' : '')+'</button>').join('')
    + '<button data-id="" class="none'+(cur ? '' : ' on')+'">未定にする</button></div><div class="btns"><button class="b-no" id="cfNo">やめる</button></div>';
  el.classList.add('show'); document.getElementById('sheetBg').classList.add('show');
  const close = () => { el.classList.remove('show'); document.getElementById('sheetBg').classList.remove('show'); };
  document.getElementById('sheetBg').onclick = close; el.querySelector('#cfNo').onclick = close;
  el.querySelectorAll('.pick button').forEach(b => { b.onclick = () => {
    close(); const id = b.dataset.id; if (id === cur || busy) return; busy = true;
    google.script.run.withSuccessHandler(r => { busy = false; if (!r.ok){ toast(r.error); load(); return; } const ym = D.roster[mi] ? D.roster[mi].ym : ''; DM = r; setSide(0, ym); toast('入れました'); render(); })
      .withFailureHandler(e => { busy = false; toast('入れられませんでした。電波を確かめて、もう一度ためしてください。'); })
      .setClerkDuty(KEY, ds, t === 'E' ? 'E' : 'L', id);
  }; });
}
function tapSlot(ds, t){
  if (D.clerk){ pickClerk(ds, t); return; }
  const k = ds+'|'+t, now = Date.now();
  if (lastTap.k === k && now - lastTap.t < 400){ clearTimeout(swapTimer); swapTimer = null; lastTap = {k:'', t:0}; sel = null; render(); dblSlot(ds, t); return; }
  lastTap = {k, t:now};
  const p = pairOf(sel, ds, t);
  if (p){   /* 2回押し（代わる）かもしれないので、少し待ってから交換の確認を出す */
    clearTimeout(swapTimer); swapTimer = setTimeout(() => { swapTimer = null; askConfirm(p, holderName(p.ds2,p.slot2)+' さんと交換しますか？'); }, 400); return;
  }
  if (sel && sel.ds === ds && sel.t === t){ sel = null; render(); return; }
  if (pendingOn(ds, t)){ toast('申し込み中です。取り消すときは「申し込み」から。'); return; }
  sel = {ds, t}; render();
}
function dblSlot(ds, t){
  if (pendingOn(ds, t)){ toast('申し込み中です。取り消すときは「申し込み」から。'); return; }
  const id = holder(ds, t);
  if (id === D.me.id){ askConfirm({kind:'give', ds, slot:t, to:''}, 'この当番を、だれかに代わってもらいますか？', 'みんなに出して、いちばん先に「代わる」を押した人に決まります。'); return; }
  if (!can(D.me, t)){ toast(SNAME[t]+'に入らない設定なので、代われません。'); return; }
  if (!dowOK(D.me, ds, t)){ toast(DOW[pd(ds).getDay()]+'曜日の'+SNAME[t]+'は入れない設定なので、代われません。'); return; }
  if (otherCS(t) && holder(ds, otherCS(t)) === D.me.id){ toast('この日のCSに、もう入っています。'); return; }
  askConfirm({kind:'take', ds, slot:t, to:id}, holderName(ds,t)+' さんの当番を、代わってあげますか？');
}
/* 送るかどうかを聞く（画面の下に出す） */
function askConfirm(req, title, note){
  const el = document.getElementById('confirm');
  const c = {kind:req.kind, from:D.me.id, to:req.kind === 'give' ? '' : req.to, ds:req.ds, slot:req.slot, ds2:req.ds2, slot2:req.slot2};
  el.innerHTML = '<div class="ct">'+esc(title)+'</div><div class="summary">'+effHtml(c, D.me.id)+(note?'<div class="eff">'+esc(note)+'</div>':'')+'</div>'
    + '<div class="btns"><button class="b-no" id="cfNo">やめる</button><button class="b-ok" id="cfOk">送る</button></div>';
  el.classList.add('show'); document.getElementById('sheetBg').classList.add('show');
  const close = () => { el.classList.remove('show'); document.getElementById('sheetBg').classList.remove('show'); };
  document.getElementById('sheetBg').onclick = () => { close(); sel = null; render(); };
  el.querySelector('#cfNo').onclick = () => { close(); sel = null; render(); };
  el.querySelector('#cfOk').onclick = () => { close(); sel = null; render(); ask({kind:req.kind, ds:req.ds, slot:req.slot, to:req.to, ds2:req.ds2, slot2:req.slot2}); };
}
function ask(req){
  if (busy) return; busy = true;
  google.script.run.withSuccessHandler(r => {
    busy = false;
    if (!r || !r.ok){ toast(r && r.error || '送れませんでした'); return; }
    toast(req.kind === 'give' ? '代わってくれる人をさがしています。' : '申し込みました。返事を待ってください。'); load(false);
  }).withFailureHandler(() => { busy = false; toast('送れませんでした。電波のよいところで、もう一度。'); }).askChange(KEY, req);
}

function answer(id, yes){


  if (busy) return; busy = true;
  document.querySelectorAll('[data-ans="'+id+'"]').forEach(b => b.disabled = true);
  google.script.run.withSuccessHandler(r => {
    busy = false;
    if (!r || !r.ok){ toast(r && r.error || '送れませんでした'); load(false); return; }
    toast(yes ? '当番を変更しました。' : 'お断りしました。'); load(false);
  }).withFailureHandler(() => { busy = false; document.querySelectorAll('[data-ans="'+id+'"]').forEach(b => b.disabled = false); toast('送れませんでした。電波のよいところで、もう一度。'); }).answerChange(KEY, id, yes);
}
function cancel(id){
  if (busy) return; busy = true;
  google.script.run.withSuccessHandler(r => {
    busy = false;
    if (!r || !r.ok){ toast(r && r.error || '取り消せませんでした'); load(false); return; }
    toast('取り消しました。'); load(false);
  }).withFailureHandler(() => { busy = false; toast('取り消せませんでした。'); }).cancelChange(KEY, id);
}
start();

window.R = {show(t){ tab = t; if (D) render(); }, restart(){ D = null; sel = null; showPast = false; onlyMe = false; busy = false; start(); }};

})();
/* ===== 希望・アンケート ===== */
(function(){

const APP_VER = '11.8.0';
const DOW = ['日','月','火','水','木','金','土'];
/* 希望は日ごとに2文字：[早出][CS]（'a'＝避けたい、'n'＝入れない、'-'＝なし） */
const PENS = [['aE','早出を避けたい'],['aC','CSを避けたい'],['nE','早出に入れない'],['nC','CSに入れない']];
const normW = v => v === 'avoid' ? 'aa' : v === 'no' ? 'nn' : String(v || '');
const okW = v => /^[-an]{2}$/.test(v) && v !== '--';
const cntW = (v, ch) => { v = normW(v); return okW(v) ? (v[0] === ch) + (v[1] === ch) : 0; };
let KEY = '', D = null, tab = 'wish', mi = 0, ri = 0, pen = 'aE', edit = {}, dirty = false, busy = false;

const pad = n => ('0'+n).slice(-2);
const pd = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymAdd = (ym,n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7)-1+n, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
/* その月をふくむ「続く3か月」の3通りのうち、いちばん多い日数と、その3か月 */
function noWorst(ym){
  let best = {n:-1, label:''};
  [-2,-1,0].forEach(s => {
    const ms = [0,1,2].map(i => ymAdd(ym, s+i));
    let n = 0;
    Object.keys(D.wishes).forEach(ds => { if (ds.slice(0,7) !== ym && ms.indexOf(ds.slice(0,7)) >= 0) n += cntW(D.wishes[ds], 'n'); });
    if (ms.indexOf(ym) >= 0) Object.keys(edit).forEach(ds => { n += cntW(edit[ds], 'n'); });
    if (n > best.n) best = {n, label:(+ms[0].slice(5,7))+'〜'+(+ms[2].slice(5,7))+'月'};
  });
  return best;
}
const SV_PAIR = {same:'まとめたい', split:'分けたい', any:'どちらでも'};
const SV_ROW = {no:'やめてほしい', few:'少しならいい', any:'気にしない'};
let svDraft = null, svBusy = false;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 2600); }
function msg(big, small){ document.getElementById('wApp').innerHTML = '<div class="msg"><div class="big">'+esc(big)+'</div>'+(small?esc(small):'')+'</div>'; }

function start(){
  google.script.url.getLocation(loc => {
    KEY = (loc.parameter && loc.parameter.k) || '';
    google.script.run.withSuccessHandler(r => {
      if (!r.ok){ msg('開けませんでした', r.error); return; }
      D = r; pickMonth(); render();
    }).withFailureHandler(e => msg('読み込めませんでした', '電波のよいところで開き直してください。')).getInit(KEY);
  });
}
const isOpen = m => new Date() <= new Date(m.deadline);
function pickMonth(){
  mi = D.months.findIndex(isOpen); if (mi < 0) mi = Math.max(0, D.months.length-1);
  ri = Math.max(0, D.roster.length-1); loadEdit();
}
function loadEdit(){
  const m = D.months[mi]; edit = {}; dirty = false; if (!m) return;
  Object.keys(D.wishes).forEach(ds => { const v = normW(D.wishes[ds]); if (ds.slice(0,7) === m.ym && okW(v)) edit[ds] = v; });
}
function used(kind, months, year){
  const m = D.months[mi]; let n = 0;
  Object.keys(D.wishes).forEach(ds => { if (ds.slice(0,7) === m.ym || D.wishes[ds] !== kind) return;
    if (year ? ds.slice(0,4) === year : months.indexOf(ds.slice(0,7)) >= 0) n++; });
  Object.keys(edit).forEach(ds => { if (edit[ds] === kind) n++; });
  return n;
}

function render(){
  let h = '<div class="head"><div class="hello"><b>'+esc(D.name)+'</b> さん</div>';
  h += tab === 'wish' ? wishView() : tab === 'roster' ? rosterView() : surveyView();
  document.getElementById('wApp').innerHTML = h + '<div class="ver">Ver '+APP_VER+'</div>';
}
function monthBar(ym, idx, len, key){
  return '<div class="month"><div class="t"><span class="m">'+(+ym.slice(5,7))+'<small>月</small></span><span class="y">'+ym.slice(0,4)+'</span></div>'
    + '<div class="arrows"><button data-'+key+'="-1" aria-label="前の月"'+(idx<=0?' disabled':'')+'>‹</button><button data-'+key+'="1" aria-label="次の月"'+(idx>=len-1?' disabled':'')+'>›</button></div></div>';
}

/* ---------- 希望を入れる ---------- */
function wishView(){
  const m = D.months[mi];
  if (!m) return '</div><div class="empty">希望の受付はまだ始まっていません。<br>始まったら院長から声がかかります。</div>';
  const dl = new Date(m.deadline), open = isOpen(m);
  const dtx = (dl.getMonth()+1)+'/'+dl.getDate()+'（'+DOW[dl.getDay()]+'）';
  const left = Math.ceil((new Date(dl.getFullYear(),dl.getMonth(),dl.getDate()) - new Date(new Date().toDateString())) / 86400000);
  let st;
  if (!open) st = '<span class="chip closed">受付は終わりました</span><span>見るだけです</span>';
  else if (D.sent[m.ym] && !dirty) st = '<span class="chip ok">✓ 送りました</span><span>しめきり '+dtx+' まで直せます</span>';
  else st = '<span class="chip warn">'+(left>0 ? 'しめきりまで あと<span class="num">'+left+'</span>日' : '今日がしめきり')+'</span><span>'+dtx+'　'+(D.sent[m.ym]?'直した分は未送信':'未送信')+'</span>';
  const lim = m.cfg.limits || {}, nw0 = noWorst(m.ym), y = m.ym.slice(0,4);
  const qBox = (cls, label, sub, usedN, max) => {
    let dots = ''; for (let i=0;i<max;i++) dots += '<i class="'+(i<usedN?'u':'')+'"></i>';
    return '<div class="qt '+cls+'"><div class="l">'+label+'</div><div class="v">あと<span class="num">'+Math.max(0,max-usedN)+'</span>つ<span style="margin-left:auto">'+sub+'</span></div><div class="dots">'+dots+'</div></div>';
  };
  let h = monthBar(m.ym, mi, D.months.length, 'mv') + '<div class="status">'+st+'</div>'
    + '<div class="quota">'+qBox('no','入れない枠（早出・CS）','続く3か月',nw0.n,lim.no)+'</div></div>';
  // カレンダー
  h += '<div class="calwrap"><div class="wk">'+DOW.map((x,i)=>'<div class="s'+i+'">'+x+'</div>').join('')+'</div><div class="cal">';
  const days = m.cfg.days || [];
  if (days.length) for (let i=0;i<pd(days[0].d).getDay();i++) h += '<div class="d blank"></div>';
  days.forEach(x => {
    const v = x.off ? '' : (edit[x.d] || ''), cls = cntW(v,'n') ? 'no' : cntW(v,'a') ? 'avoid' : '';
    const mk = (i, lab) => v[i] && v[i] !== '-' ? '<span class="k '+(v[i]==='n'?'kn':'ka')+(i?' sC':' sE')+'">'+lab+'<b>'+(v[i]==='n'?'×':'△')+'</b></span>' : '';
    h += '<div class="d'+(x.off?' off':'')+(!open?' lock':'')+(cls?' '+cls:'')+'" data-d="'+x.d+'"><span class="n">'+pd(x.d).getDate()+'</span>'
      + (cls ? '<span class="ks">'+mk(0,'早')+mk(1,'CS')+'</span>' : '') + (x.b && !x.off ? '<span class="b"></span>' : '') + '</div>';
  });
  h += '</div><div class="legend"><span><i></i>重い当番の日（土曜と水曜のCS・月曜と連休明けの早出）</span><span><i class="off"></i>休診</span></div><div class="legend" style="padding-top:0"><span><span class="lk aE">△</span>早出を避けたい</span><span><span class="lk aC">△</span>CSを避けたい</span><span><span class="lk nE">×</span>早出に入れない</span><span><span class="lk nC">×</span>CSに入れない</span></div></div>';
  if (open){
    const na = Object.values(edit).reduce((a,v)=>a+cntW(v,'a'),0);
    h += '<p class="howto">下で種類を選んでから日付を押してください。もう一度押すと消えます。<br>避けたい枠は、少なく書くほど通りやすくなります。</p>'
      + '<div class="dock"><div class="pens">'
      + '<div class="ph E">早出</div><div class="ph C">CS</div>'
      + PENS.map(([k])=>'<button data-pen="'+k+'" class="'+(k[0]==='a'?'pa':'pn')+' s'+k[1]+(pen===k?' on':'')+'"><b>'+(k[0]==='a'?'△':'×')+'</b>'+(k[0]==='a'?'避けたい':'入れない')+'</button>').join('')
      + '</div><p class="tip">避けたい <b>'+na+'</b> 枠</p>'
      + '<button class="send" id="send"'+((dirty||!D.sent[m.ym]) && !busy ? '' : ' disabled')+'>'+(busy?'送っています…':(D.sent[m.ym]&&!dirty?'送りました':'送る'))+'</button></div>';
  }
  return h;
}
function tapDay(ds){
  const m = D.months[mi]; if (!m || !isOpen(m)) return;
  const x = (m.cfg.days||[]).find(d=>d.d===ds); if (!x || x.off) return;
  const kind = pen[0]==='a' ? 'a' : 'n', t = pen[1], i = t==='E' ? 0 : 1;
  if ((t==='E' && x.e === false) || (t==='C' && x.c === false)){ toast('この日は'+(t==='E'?'早出':'CS')+'がありません'); return; }
  const arr = (edit[ds] || '--').split('');
  if (arr[i] === kind) arr[i] = '-';
  else {
    const lim = m.cfg.limits || {};
    if (kind === 'n'){ const w = noWorst(m.ym); if (w.n >= lim.no){ toast('入れない枠は、続く3か月で'+lim.no+'つまでです（'+w.label+'で'+w.n+'つ）'); return; } }
    arr[i] = kind;
  }
  const code = arr.join(''); if (code === '--') delete edit[ds]; else edit[ds] = code;
  dirty = true; render();
}
function send(){
  const m = D.months[mi]; if (!m || busy) return;
  busy = true; render();
  google.script.run.withSuccessHandler(r => {
    busy = false;
    if (!r.ok){ toast(r.error); render(); return; }
    Object.keys(D.wishes).forEach(ds => { if (ds.slice(0,7) === m.ym) delete D.wishes[ds]; });
    Object.assign(D.wishes, edit); D.sent[m.ym] = r.savedAt; dirty = false; render(); toast('送りました');
  }).withFailureHandler(() => { busy = false; render(); toast('送れませんでした。電波のよいところでもう一度押してください'); }).saveWishes(KEY, m.ym, edit);
}

/* ---------- 決まった当番 ---------- */
/* ---------- アンケート ---------- */
function surveyView(){
  if (!svDraft) svDraft = D.survey ? {early:(D.survey.early||[]).slice(), cs:(D.survey.cs||[]).slice(), pair:D.survey.pair, row:D.survey.row||'', note:D.survey.note||''} : {note:''};
  const a = svDraft;
  /* 入りたくない順に押す（3つまで）。押した順に 1・2・3 の番号が付く。もう一度押すと外れる */
  const dowBtns = (q) => { const L = a[q]; return '<div class="sgrid">' + [1,2,3,4,5,6].map(w => { const r = L ? L.indexOf(String(w)) : -1;
      return '<button data-q="'+q+'" data-v="'+w+'" class="'+(r>=0?'on':'')+(w===6?' s6':'')+'">'+DOW[w]+(r>=0?'<span class="rk">'+(r+1)+'</span>':'')+'</button>'; }).join('')
    + '<button data-q="'+q+'" data-v="" class="none'+(L && !L.length ? ' on' : '')+'">なし</button></div>'
    + '<p class="shint">入りたくない順に、3つまで押してください（押した順に 1・2・3）。もう一度押すと外れます。</p>'; };
  const {done, same} = svState();
  let h = '</div><div class="body"><p class="pnote">当番の決め方を考える参考にします。いつでも答え直せます。</p>';
  h += '<div class="pair"><div class="sq"><b>1</b>入りたくない<span class="em E">早出</span>は何曜日ですか？</div>' + dowBtns('early') + '</div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>2</b>入りたくない<span class="em C">CS</span>は何曜日ですか？</div>' + dowBtns('cs') + '</div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>3</b>早出とCSは、同じ日にまとめたいですか？</div><div class="pseg">'
    + ['same','split','any'].map(k => '<button data-q="pair" data-v="'+k+'" class="'+(a.pair===k?'on':'')+'">'+SV_PAIR[k]+'</button>').join('') + '</div></div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>4</b>当番が2日続くのは、どうですか？</div><div class="pseg">'
    + ['no','few','any'].map(k => '<button data-q="row" data-v="'+k+'" class="'+(a.row===k?'on':'')+'">'+SV_ROW[k]+'</button>').join('') + '</div></div>';
  h += '<div class="pair" style="margin-top:10px"><div class="sq"><b>5</b>そのほか、ご意見があれば書いてください</div>'
    + '<p class="shint" style="margin-top:4px">当番について気になることなど、自由に書いてください（なくてもかまいません）。</p><textarea id="svNote" maxlength="500" rows="4" placeholder="自由に書いてください">'+esc(a.note||'')+'</textarea></div>';
  h += '<button class="send" id="svSend" style="margin-top:16px"'+(done && !same && !svBusy ? '' : ' disabled')+'>'+(svBusy ? '送っています…' : (same ? '答えました' : '答える'))+'</button>';
  if (D.survey && D.survey.at) h += '<p class="pnote" style="text-align:center;margin-top:8px">前に答えた日時：'+esc(D.survey.at)+'</p>';
  return h + '</div>';
}
/* 1〜3がそろっているか、前に送った答えと同じか */
function svState(){
  const a = svDraft || {};
  const done = Array.isArray(a.early) && Array.isArray(a.cs) && !!a.pair && !!a.row;
  const eq = (x,y) => JSON.stringify(x||null) === JSON.stringify(y||null);
  const same = !!D.survey && eq(D.survey.early,a.early) && eq(D.survey.cs,a.cs) && D.survey.pair===a.pair && (D.survey.row||'')===(a.row||'') && (D.survey.note||'') === (a.note||'').trim();
  return {done, same};
}
function refreshSvBtn(){
  const b = document.getElementById('svSend'); if (!b) return;
  const {done, same} = svState();
  b.disabled = !(done && !same && !svBusy); b.textContent = svBusy ? '送っています…' : (same ? '答えました' : '答える');
}
document.addEventListener('input', e => { if (e.target.id === 'svNote' && svDraft){ svDraft.note = e.target.value; refreshSvBtn(); } });
function sendSurvey(){
  if (svBusy) return;
  svBusy = true; render();
  google.script.run.withSuccessHandler(r => {
    svBusy = false;
    if (!r.ok){ render(); toast(r.error); return; }
    D.survey = {early:svDraft.early.slice(), cs:svDraft.cs.slice(), pair:svDraft.pair, row:svDraft.row, note:(svDraft.note||'').trim(), at:r.at}; svDraft = null; render(); toast('答えを送りました。ありがとうございました');
  }).withFailureHandler(() => { svBusy = false; render(); toast('送れませんでした。電波のよいところでもう一度押してください'); }).saveSurvey(KEY, {early:svDraft.early, cs:svDraft.cs, pair:svDraft.pair, row:svDraft.row, note:svDraft.note||''});
}

function rosterView(){
  const r = D.roster[ri];
  if (!r) return '</div><div class="empty">確定した当番表はまだありません。</div>';
  const days = r.data.days || {}, ds = Object.keys(days).sort();
  const mine = ds.filter(d => days[d].eId === D.id || days[d].cId === D.id || days[d].c2Id === D.id);
  let h = monthBar(r.ym, ri, D.roster.length, 'rv') + '</div><div class="body">';
  h += '<div class="h2">わたしの当番　<span class="num" style="font-size:15px;color:var(--ink)">'+mine.length+'</span> 日</div>';
  if (!mine.length) h += '<div class="none">この月の当番はありません</div>';
  else h += '<div class="mine">' + mine.map(d => { const x = days[d], w = pd(d).getDay();
      return '<div class="duty"><div class="dn">'+pd(d).getDate()+'</div><div class="dw s'+w+'">'+DOW[w]+'曜日</div><div class="tags">'
        + (x.eId===D.id?'<span class="tag E">早出</span>':'') + ((x.cId===D.id||x.c2Id===D.id)?'<span class="tag C">CS</span>':'') + '</div></div>'; }).join('') + '</div>';
  h += '<div class="h2" style="margin-top:24px">全員の当番表</div><div class="all"><div class="r hd"><span></span><span class="e">早出</span><span class="c">CS</span></div>';
  const nm = (n,id) => n ? (id===D.id ? '<span class="me">'+esc(n)+'</span>' : esc(n)) : '<span class="em">—</span>';
  ds.forEach(d => { const x = days[d], w = pd(d).getDay();
    h += '<div class="r"><span class="dt s'+w+'"><span class="num">'+pd(d).getDate()+'</span>'+DOW[w]+'</span><span>'+nm(x.early,x.eId)+'</span><span>'+(x.cs===undefined?'':nm(x.cs,x.cId)+(x.cs2===undefined?'':'<br>'+nm(x.cs2,x.c2Id)))+'</span></div>'; });
  return h + '</div><div class="conf">確定：'+esc(r.at)+'</div>'+'</div>';
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-d]'); if (!t || t.disabled || !document.getElementById('wWrap').contains(t)) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); }
  else if (t.dataset.mv){ if (dirty && !confirm('送っていない変更があります。送らずに月を変えますか？')) return; mi += +t.dataset.mv; loadEdit(); render(); }
  else if (t.dataset.rv){ ri += +t.dataset.rv; render(); }
  else if (t.dataset.pen){ pen = t.dataset.pen; render(); }
  else if (t.dataset.q){
    const q = t.dataset.q, v = t.dataset.v;
    if (q === 'pair' || q === 'row') svDraft[q] = v;
    else if (v === '') svDraft[q] = [];
    else {
      const L = Array.isArray(svDraft[q]) ? svDraft[q].slice() : [], i = L.indexOf(v);
      if (i >= 0) L.splice(i,1);
      else if (L.length >= 3){ toast('3つまでです。外したい曜日をもう一度押してください'); return; }
      else L.push(v);
      svDraft[q] = L.length ? L : undefined;
      if (!L.length) delete svDraft[q];
    }
    render();
  }
  else if (t.id === 'svSend') sendSurvey();
  else if (t.id === 'send') send();
  else if (t.dataset.d) tapDay(t.dataset.d);
});
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
/* Ver11.6.6：ここでは始めない（当番表が出たあとに wKick() が始める） */

window.W = {show(t){ tab = t; if (D) render(); }, ready:() => !!D, restart(){ D = null; svDraft = null; edit = {}; dirty = false; busy = false; svBusy = false; start(); }};

})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('toban-sw.js', {scope:'./toban'}).catch(() => {});
</script>
